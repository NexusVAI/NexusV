<?xml version="1.0" encoding="UTF-8"?>
<!--
  2026-05-15: 登录页背景"等高线"纹理（浅色版）。
  与 auth-bg.svg 同 pipeline（fractalNoise → blur → diffuseLighting →
  discrete 量化），但 tableValues 调到偏亮的"沙漠/羊皮纸"暖色区间：
  低 band 约 #b08858（深沙），高 band 约 #faecd0（暖白），所有 band
  都比浅色主题的 cream 底色（#e8d9b8）稍暗或相近，确保等高线在浅底
  上仍清晰可辨而不刺眼。seed/baseFrequency/octaves 全部沿用深色版以
  保持视觉一致：切主题时只是配色翻转，地形纹路完全一样。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <filter id="topo" x="0%" y="0%" width="100%" height="100%" filterUnits="userSpaceOnUse">
      <feTurbulence type="fractalNoise" baseFrequency="0.0045" numOctaves="6" seed="7" result="n"/>
      <feGaussianBlur in="n" stdDeviation="1.4" result="nb"/>
      <feDiffuseLighting in="nb" surfaceScale="22" diffuseConstant="1.05" lighting-color="#ffffff" result="lit">
        <feDistantLight azimuth="135" elevation="55"/>
      </feDiffuseLighting>
      <feComponentTransfer in="lit" result="banded">
        <feFuncR type="discrete" tableValues="0.70 0.76 0.82 0.86 0.90 0.94 0.98"/>
        <feFuncG type="discrete" tableValues="0.62 0.68 0.74 0.79 0.84 0.88 0.92"/>
        <feFuncB type="discrete" tableValues="0.50 0.56 0.62 0.68 0.74 0.80 0.84"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="#e8d9b8"/>
  <rect width="1600" height="1000" filter="url(#topo)"/>
</svg>
