<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 2026-05-15 审查：抽离内联 script 到 ./api/api-apply-app.js，删 'unsafe-inline' script-src（style-src 沿用，待 Finding 2 整治 inline style 时一并处理）。 -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://diusqgphvybnzazgopor.supabase.co; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self';">
  <title>申请 · Cancri 开放平台</title>
  <link rel="icon" type="image/png" href="../Logo/Cancri.png">
  <link rel="apple-touch-icon" href="../Logo/Cancri.png">
  <link rel="preload" as="image" href="../Logo/Cancri1.jpg" fetchpriority="high">
  <link rel="preload" as="image" href="../Logo/Cancri.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./api/api-platform.css?v=2026-05-22-docs-single-page">
  <script src="./api/api-platform.js?v=20260513"></script>
  <!-- Cancri 双主题 logo 同步 -->
  <script src="./cancri_logo_theme.js?v=2026-05-17-logo-theme" defer></script>
  <style>
    /* 页面专有：申请页是 banner + 单卡上下堆叠，水平居中 */
    .apply-page-stack {
      width: 100%;
      max-width: 480px;
      margin: 12px auto 0;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .apply-page-stack .cancri-promo-banner { margin: 0; }
    .apply-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 32px;
      width: 100%;
    }
    .apply-card .full-btn { width: 100%; padding: 11px; margin-top: 8px; font-size: 14px; }
    .apply-card .secondary-btn { width: 100%; padding: 10px; margin-top: 16px; font-size: 13px; }
    .login-hint { text-align: center; margin-top: 16px; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar__inner">
      <a class="brand" href="./api/" aria-label="Cancri 开放平台">
        <img
          class="brand__logo cancri-logo"
          src="../Logo/Cancri1.jpg"
          data-dark-src="../Logo/Cancri1.jpg"
          data-light-src="../Logo/Cancri.png"
          alt="Cancri"
          width="28"
          height="28"
        />
      </a>
      <nav class="topnav" aria-label="开放平台导航">
        <a href="./api/">概览</a>
        <a href="./api_apply.html" class="is-active">申请</a>
        <a href="./api_keys.html">Keys</a>
        <a href="./api_models.html">模型</a>
        <a href="./api_docs.html">文档</a>
        <a href="./pricing.html">套餐</a>
        <a href="./orders.html">我的订单</a>
        <a href="./" class="topnav__back">← 返回聊天</a>
      </nav>
      <button class="theme-toggle" type="button" data-theme-toggle aria-label="切换主题" title="切换主题">
        <svg class="theme-toggle__sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        <svg class="theme-toggle__moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </div>
  </header>

  <main class="page-shell page-shell--narrow">
  <div class="apply-page-stack">
    <!-- ── 站主赞助横幅（与模型广场同款） ── -->
    <div class="cancri-promo-banner" id="cancriPromoBanner">
      <button
        type="button"
        class="cancri-promo-banner__head"
        id="cancriPromoToggle"
        aria-expanded="true"
        aria-controls="cancriPromoBody"
      >
        <span class="cancri-promo-banner__heart" aria-hidden="true">❤</span>
        <span class="cancri-promo-banner__title">站主不易，喜欢就请喝杯咖啡</span>
        <span class="cancri-promo-banner__hint">点击展开/收起</span>
        <svg class="cancri-promo-banner__chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true">
          <path d="m18 15-6-6-6 6"></path>
        </svg>
      </button>
      <div class="cancri-promo-banner__body" id="cancriPromoBody">
        <img src="../Logo/1107.jpg" alt="微信收款码" class="cancri-promo-banner__qr" loading="lazy" />
        <div class="cancri-promo-banner__copy">
          <span class="cancri-promo-banner__lead">所有模型免费，API 也免费申请使用。如果觉得对你有帮助，扫码随手打赏一点。</span>
          <span class="cancri-promo-banner__sub">打赏完全自愿，与申请审核、额度、优先级无任何关联。</span>
        </div>
      </div>
    </div>

    <div class="apply-card">
    <h1 class="page-title">API 申请</h1>
    <p class="subtitle">申请 Cancri API Key，用于调用大模型接口</p>

    <div id="loading" class="loading">加载中...</div>

    <div id="login-section" style="display:none">
      <p style="margin-bottom:12px">请先登录后再申请 API Key。</p>
      <button id="login-redirect-btn" class="btn-primary full-btn">前往登录</button>
    </div>

    <div id="apply-section" style="display:none">
      <div id="existing-status" style="display:none"></div>
      <div id="apply-form">
        <div class="form-group">
          <label>邮箱</label>
          <input type="email" id="email" readonly>
        </div>
        <div class="form-group">
          <label>用途说明</label>
          <textarea id="purpose" placeholder="简要描述你的使用场景，例如：个人项目开发、学术研究、企业集成等"></textarea>
        </div>
        <button id="submit-btn" class="btn-primary full-btn">提交申请</button>
        <div class="msg" id="msg"></div>
      </div>
    </div>

    <div id="key-section" style="display:none">
      <p style="margin-bottom:12px; color: var(--ok)">你的申请已通过！可以生成 API Key 了。</p>
      <button id="manage-keys-btn" class="btn-primary full-btn">管理 API Keys</button>
    </div>

    <button id="back-to-chat-btn" class="btn-secondary secondary-btn">返回聊天</button>
    </div>
  </div>
  </main>

  <footer class="site-footer">
    <div class="site-footer__inner">
      <div class="site-footer__sig">Built with care · Cancri</div>
      <div>&copy; 2026 NexusV / Cancri Open Platform</div>
    </div>
  </footer>

  <script src="./cancri_config.js"></script>
  <!-- 客户端错误回传（2026-05-14 上线）：经用户同意后捕获 JS 异常用于诊断移动端 bug。-->
  <script src="../js/telemetry.js?v=2026-05-14-tel-init" defer></script>
  <!-- 设备 / 浏览器指纹（2026-05-16）：反多账号信号采集。详见 js/fingerprint.js 顶部注释。 -->
  <script src="../js/fingerprint.js?v=2026-05-16-fp-init" defer></script>
  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.46.1/dist/umd/supabase.js"
    crossorigin="anonymous"
  ></script>
  <!-- 2026-05-15 审查：原 inline <script> 抽离到 ./api/api-apply-app.js，并从 CSP 删 'unsafe-inline' script-src。 -->
  <script src="./api/api-apply-app.js?v=2026-05-19-permission-init"></script>
</body>
</html>
