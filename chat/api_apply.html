    (() => {

      if (theme === 'warm') document.documentElement.classList.add('warm-theme');

      <!-- 两栏：左功能 / 右表单 -->
      <div class="cs-cols">
        <!-- 左栏：功能 + Trusted by -->
        <aside class="cs-col-left">
          <div>
            <p class="cs-features-label">功能</p>
            <ul class="cs-features">
              <li class="cs-feature">

              </li>
              <li class="cs-feature">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 13 12"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" d="m8.215 10.25-1.25-2m-2.25 2 1.25-2M7.71 2.716 2.773 4.769A1 1 0 0 0 2.205 6l.19.586a1 1 0 0 0 1.223.653L5.18 6.8m2.429-.683 1.104-.31m1.108.164.476-.154a.75.75 0 0 0 .481-.945l-.927-2.854a.75.75 0 0 0-.945-.481l-.475.154a1 1 0 0 0-.643 1.26l.773 2.378a1 1 0 0 0 1.26.642"></path><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" d="M6.465 8.25a1.25 1.25 0 1 0 0-2.5 1.25 1.25 0 0 0 0 2.5"></path></svg>

              </li>
              <li class="cs-feature">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 22 18"><path fill="currentColor" d="M6.821 2.571a2.25 2.25 0 1 0 0 4.5 2.25 2.25 0 0 0 0-4.5m-4.25 2.25a4.25 4.25 0 1 1 8.5 0 4.25 4.25 0 0 1-8.5 0M15.643 3.5a1.786 1.786 0 1 0 0 3.571 1.786 1.786 0 0 0 0-3.571m-3.786 1.786a3.786 3.786 0 1 1 7.572 0 3.786 3.786 0 0 1-7.572 0m-8.202 7.711c-.82.73-1.405 1.846-1.405 3.432a1 1 0 1 1-2 0c0-2.129.808-3.799 2.077-4.927 1.25-1.11 2.889-1.645 4.494-1.645 1.606 0 3.245.534 4.495 1.645 1.269 1.128 2.077 2.798 2.077 4.927a1 1 0 1 1-2 0c0-1.586-.585-2.702-1.405-3.432-.84-.746-1.987-1.14-3.167-1.14s-2.326.394-3.166 1.14m14.547-.557c-.918-.58-2.132-.735-3.216-.43a1 1 0 0 1-.543-1.924c1.593-.45 3.397-.24 4.827.663 1.468.928 2.48 2.55 2.48 4.751a1 1 0 1 1-2 0c0-1.522-.667-2.503-1.548-3.06"></path></svg>
                <p>轻松管理成员、权限和账单</p>
              </li>
              <li class="cs-feature">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24"><path fill="currentColor" d="M8.75 17.25a2 2 0 1 0-4 0 2 2 0 0 0 4 0m10.5 0a2 2 0 1 0-4 0 2 2 0 0 0 4 0M8.75 6.75a2 2 0 1 0-4 0 2 2 0 0 0 4 0m10.5 0a2 2 0 1 0-4 0 2 2 0 0 0 4 0m2 10.5a4 4 0 1 1-8 0 4 4 0 0 1 8 0m-10.5-10.5a4 4 0 1 1-8 0 4 4 0 0 1 8 0m10.5 0a4 4 0 1 1-6.032 3.445l-5.023 5.023a4 4 0 1 1-1.414-1.414l5.023-5.023A4 4 0 1 1 21.25 6.75"></path></svg>

              </li>

          <div class="cs-trusted">
            <p class="cs-trusted__label">接入数十个企业级的 AI，例如</p>

          <!-- 已登录：申请区 -->
          <div id="apply-section" style="display:none">
            <div id="existing-status" style="display:none"></div>

            <form id="apply-form" class="cs-form" onsubmit="return false">
              <div class="cs-field cs-field--half">
                <label class="cs-label" for="cs-interest">您对哪些方面感兴趣？&nbsp;<span class="req">*</span></label>
                <div class="cs-select-wrap">
                  <select id="cs-interest" class="cs-select" required>
                    <option value="" disabled selected>从下拉列表中选择一项。</option>
                    <option value="Codex">Codex</option>
                    <option value="ChatGPT for Healthcare">ChatGPT 医疗保健版</option>
                    <option value="ChatGPT Gov">面向政府的 ChatGPT</option>
                    <option value="ChatGPT Education">ChatGPT 教育版</option>
                    <option value="API for Enterprise">面向企业的 API</option>
                    <option value="OpenAI Frontier">OpenAI Frontier</option>
                    <option value="ChatGPT Enterprise">ChatGPT Enterprise</option>
                  </select>
                  <svg class="cs-select-chevron" xmlns="http://www.w3.org/2000/svg" width="10" fill="none" viewBox="0 0 10 16"><path fill="currentColor" d="M.21 5.352a.714.714 0 0 1 1.01 0L5 9.132l3.78-3.78a.714.714 0 0 1 1.01 1.01l-4.285 4.286a.714.714 0 0 1-1.01 0L.209 6.362a.714.714 0 0 1 0-1.01"></path></svg>
                </div>
              </div>

              <div class="cs-field cs-field--half">
                <label class="cs-label" for="email">工作电子邮件&nbsp;<span class="req">*</span></label>
                <input id="email" class="cs-input" type="email" autocomplete="email" disabled />
              </div>

              <div class="cs-field cs-field--half">
                <label class="cs-label" for="cs-companysize">公司规模&nbsp;<span class="req">*</span></label>
                <div class="cs-select-wrap">
                  <select id="cs-companysize" class="cs-select" required>
                    <option value="" disabled selected>请选择</option>
                    <option value="1-50">1-50</option>
                    <option value="51-250">51-250</option>
                    <option value="251-500">251-500</option>
                    <option value="501-1,000">501-1,000</option>
                    <option value="1,001-5,000">1,001-5,000</option>
                    <option value="5,001-10,000">5,001-10,000</option>
                    <option value="10,001-20,000">10,001-20,000</option>
                    <option value="20,001+">20,001+</option>
                  </select>
                  <svg class="cs-select-chevron" xmlns="http://www.w3.org/2000/svg" width="10" fill="none" viewBox="0 0 10 16"><path fill="currentColor" d="M.21 5.352a.714.714 0 0 1 1.01 0L5 9.132l3.78-3.78a.714.714 0 0 1 1.01 1.01l-4.285 4.286a.714.714 0 0 1-1.01 0L.209 6.362a.714.714 0 0 1 0-1.01"></path></svg>
                </div>
              </div>

              <div class="cs-field cs-field--half">
                <label class="cs-label" for="cs-company">公司名称&nbsp;<span class="req">*</span></label>
                <input id="cs-company" class="cs-input" type="text" autocomplete="organization" />
              </div>

              <div class="cs-field cs-field--half">
                <label class="cs-label" for="cs-lastname">姓氏&nbsp;<span class="req">*</span></label>
                <input id="cs-lastname" class="cs-input" type="text" autocomplete="family-name" />
              </div>

              <div class="cs-field cs-field--half">
                <label class="cs-label" for="cs-firstname">名字&nbsp;<span class="req">*</span></label>
                <input id="cs-firstname" class="cs-input" type="text" autocomplete="given-name" />
              </div>

              <div class="cs-field">
                <label class="cs-label" for="cs-phone">电话号码&nbsp;<span class="req">*</span></label>
                <input id="cs-phone" class="cs-input" type="tel" autocomplete="tel" pattern="^[0-9\+\-\(\)\s]+$" />
              </div>

              <div class="cs-field">
                <label class="cs-label" for="cs-need">能否详细介绍你的业务需求和面临的挑战？</label>
                <textarea id="cs-need" class="cs-textarea" placeholder="例如：我们正在构建一个客服自动化系统，预计每天 X 万次调用，需要长上下文与多模态能力……"></textarea>
              </div>

              <button id="submit-btn" type="button" class="cs-btn">提交</button>
              <div id="msg" class="cs-msg"></div>
            </form>

            <p class="cs-help">如有其他问题，请访问我们的<a href="chat/index.html">帮助中心</a>。</p>

            <!-- 申请通过后展示 -->
            <div id="key-section" class="cs-state" style="display:none;margin-top:24px">
              <p style="margin-bottom:14px">你的申请已通过，现在可以在控制台创建 API 密钥。</p>
              <button id="manage-keys-btn" class="cs-btn">前往控制台 · API 密钥</button>
            </div>
