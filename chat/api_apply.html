<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://chat.nexusvai.xyz; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self';" />
  <title>联系销售人员 · NexusV 开放平台</title>
  <meta name="description" content="联系 NexusV 销售团队，申请 API 访问权限。告诉我们你的业务需求与挑战。" />
  <base href="../" />
  <script>
    (() => {
      let theme = 'warm';
      try { theme = localStorage.getItem('theme') || 'warm'; } catch (e) {}
      if (theme === 'light') document.documentElement.classList.add('light-theme');
      if (theme === 'warm') document.documentElement.classList.add('warm-theme');
      if (theme === 'blue') document.documentElement.classList.add('blue-theme');
      if (theme === 'dark') document.documentElement.classList.add('dark-theme');
    })();
  </script>
  <link rel="icon" type="image/png" href="Logo/Cancri.png" />
  <link rel="preconnect" href="https://chat.nexusvai.xyz" crossorigin />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/navbar.css" />
  <link rel="stylesheet" href="css/mobile-menu.css" />
  <link rel="stylesheet" href="css/footer.css" />
  <link rel="stylesheet" href="css/inter-fonts.css" />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/display-fonts.css" />
  <link rel="stylesheet" href="chat/api/oai-home.css" />
</head>
<body>
  <main class="api-home">
    <div class="cs-wrap">
      <div class="cs-head">
        <h1 class="cs-head__title">联系销售人员</h1>
        <p class="cs-head__sub">告诉我们你的业务需求与面临的挑战，NexusV 团队会尽快与你联系并开通 API 访问。</p>
      </div>

      <div id="loading" class="cs-state">正在加载…</div>

      <!-- 未登录 -->
      <div id="login-section" class="cs-state" style="display:none">
        <p data-cs-login-msg style="margin-bottom:16px">请先登录 NexusV 账号后再提交申请。</p>
        <button id="login-redirect-btn" class="cs-btn">前往登录 / 返回聊天</button>
      </div>

      <!-- 已登录：申请区 -->
      <div id="apply-section" style="display:none">
        <div id="existing-status" style="display:none"></div>

        <form id="apply-form" class="cs-card" onsubmit="return false">
          <div class="cs-grid">
            <div class="cs-field">
              <label class="cs-label" for="cs-firstname">名字 <span class="opt">（选填）</span></label>
              <input id="cs-firstname" class="cs-input" type="text" autocomplete="given-name" />
            </div>
            <div class="cs-field">
              <label class="cs-label" for="cs-lastname">姓氏 <span class="opt">（选填）</span></label>
              <input id="cs-lastname" class="cs-input" type="text" autocomplete="family-name" />
            </div>
            <div class="cs-field cs-field--full">
              <label class="cs-label" for="email">电子邮件 <span class="opt">（自动带入登录邮箱）</span></label>
              <input id="email" class="cs-input" type="email" autocomplete="email" disabled />
            </div>
            <div class="cs-field cs-field--full">
              <label class="cs-label" for="cs-company">公司 / 团队 <span class="opt">（选填）</span></label>
              <input id="cs-company" class="cs-input" type="text" autocomplete="organization" />
            </div>
            <div class="cs-field cs-field--full">
              <label class="cs-label" for="cs-need">能否详细介绍你的业务需求和面临的挑战？<span class="req">*</span></label>
              <textarea id="cs-need" class="cs-textarea" required aria-required="true" placeholder="例如：我们正在构建一个客服自动化系统，预计每天 X 万次调用，需要长上下文与多模态能力……"></textarea>
            </div>
          </div>

          <label class="cs-consent">
            <input id="cs-consent" type="checkbox" checked />
            <span>我希望通过电子邮件接收来自 NexusV 的关于其产品、服务和活动的营销信息。如果你不想接收此类营销信息，请取消勾选此框。</span>
          </label>

          <button id="submit-btn" type="button" class="cs-btn">提交</button>
          <div id="msg" class="cs-msg"></div>
        </form>

        <!-- 申请通过后展示 -->
        <div id="key-section" class="cs-state" style="display:none;margin-top:16px">
          <p style="margin-bottom:14px">你的申请已通过，现在可以在控制台创建 API 密钥。</p>
          <button id="manage-keys-btn" class="cs-btn">前往控制台 · API 密钥</button>
        </div>
      </div>
    </div>
  </main>

  <div data-page-footer></div>

  <script src="js/components.js" defer></script>
  <script src="js/i18n.js" defer></script>
  <script src="js/theme.js" defer></script>
  <script src="js/menu.js?v=2026-05-18-active-fix" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.46.1/dist/umd/supabase.js"></script>
  <script src="chat/cancri_config.js?v=2026-05-13e"></script>
  <script src="chat/api/oai-apply.js?v=20260621-oai" defer></script>
  <script>document.addEventListener('DOMContentLoaded', function () { if (window.injectComponents) injectComponents({}); });</script>
</body>
</html>
