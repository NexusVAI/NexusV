        aria-expanded="true"
        aria-controls="cancriPromoBody"
      >
        <span class="cancri-promo-banner__heart" aria-hidden="true">❤</span>
        <span class="cancri-promo-banner__title">站主不易，喜欢就请喝杯咖啡</span>
        <span class="cancri-promo-banner__hint">点击展开/收起</span>
        <svg class="cancri-promo-banner__chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true">
          <path d="m18 15-6-6-6 6"></path>
        </svg>
      </button>
      <div class="cancri-promo-banner__body" id="cancriPromoBody">
        <img src="../Logo/1107.jpg" alt="微信收款码" class="cancri-promo-banner__qr" loading="lazy" />
        <div class="cancri-promo-banner__copy">
          <span class="cancri-promo-banner__lead">所有模型免费，API 也免费申请使用。如果觉得对你有帮助，扫码随手打赏一点。</span>
          <span class="cancri-promo-banner__sub">打赏完全自愿，与申请审核、额度、优先级无任何关联。</span>
        </div>
      </div>
    </div>

    <div class="apply-card">
    <h1 class="page-title">API 申请</h1>
    <p class="subtitle">申请 Cancri API Key，用于调用大模型接口</p>

    <div id="loading" class="loading">加载中...</div>

    <div id="login-section" style="display:none">
      <p style="margin-bottom:12px">请先登录后再申请 API Key。</p>
      <button class="btn-primary full-btn" onclick="location.href='./'">前往登录</button>
    </div>

    <div id="apply-section" style="display:none">
      <div id="existing-status" style="display:none"></div>
      <div id="apply-form">
        <div class="form-group">
          <label>邮箱</label>
          <input type="email" id="email" readonly>
        </div>
        <div class="form-group">
          <label>用途说明</label>
          <textarea id="purpose" placeholder="简要描述你的使用场景，例如：个人项目开发、学术研究、企业集成等"></textarea>
        </div>
        <button id="submit-btn" class="btn-primary full-btn" onclick="submitApplication()">提交申请</button>
        <div class="msg" id="msg"></div>
      </div>
    </div>

    <div id="key-section" style="display:none">
      <p style="margin-bottom:12px; color: var(--ok)">你的申请已通过！可以生成 API Key 了。</p>
      <button class="btn-primary full-btn" onclick="location.href='./api_keys.html'">管理 API Keys</button>

    <button class="btn-secondary secondary-btn" onclick="location.href='./'">返回聊天</button>
    </div>

  <footer class="site-footer">

    </div>

  <script src="./cancri_config.js"></script>
  <!-- 客户端错误回传（2026-05-14 上线）：经用户同意后捕获 JS 异常用于诊断移动端 bug。-->
  <script src="../js/telemetry.js?v=2026-05-14-tel-init" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // IMPORTANT: storageKey must match cancri_chat.js so session is shared with main chat page
    const sb = window.supabase.createClient(window.__SUPABASE_URL__, window.__SUPABASE_ANON_KEY__, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false, storageKey: 'cancri_supabase_auth' } });
    const GW = window.__SUPABASE_URL__ + '/functions/v1/chat-gateway';
    let currentUser = null;

    async function init() {
      const { data: { user } } = await sb.auth.getUser();
      document.getElementById('loading').style.display = 'none';
      if (!user || user.is_anonymous) {
        document.getElementById('login-section').style.display = 'block';
        return;
      }
      currentUser = user;
      document.getElementById('email').value = user.email || '';
      document.getElementById('apply-section').style.display = 'block';
      await checkExisting();
    }

    async function checkExisting() {
      try {
        const { data: { session } } = await sb.auth.getSession();
        const resp = await fetch(GW, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + session.access_token },
          body: JSON.stringify({ endpoint: 'api_my_keys' })
        });
        const data = await resp.json();
        if (data.applications && data.applications.length > 0) {
          const app = data.applications[0];
          const box = document.getElementById('existing-status');
          box.style.display = 'block';
          const badgeClass = 'status-' + app.status;
          const statusText = { pending: '审核中', approved: '已通过', rejected: '已拒绝' }[app.status] || app.status;
          box.innerHTML = '<div class="status-box"><div>申请状态：<span class="status-badge ' + badgeClass + '">' + statusText + '</span></div><div style="color: var(--text-faint); font-size:12px; margin-top:6px">申请时间：' + new Date(app.created_at).toLocaleString('zh-CN') + '</div></div>';
          document.getElementById('apply-form').style.display = 'none';
          if (app.status === 'approved') {
            document.getElementById('key-section').style.display = 'block';
          }
        }
      } catch (e) {
        console.error(e);
      }
    }

    async function submitApplication() {
      const purpose = document.getElementById('purpose').value.trim();
      if (!purpose) { showMsg('请填写用途说明', true); return; }
      const btn = document.getElementById('submit-btn');
      btn.disabled = true; btn.textContent = '提交中...';
      try {
        const { data: { session } } = await sb.auth.getSession();
        const resp = await fetch(GW, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + session.access_token },
          body: JSON.stringify({ endpoint: 'api_apply', purpose })
        });
        const data = await resp.json();
        if (resp.ok) {
          showMsg('申请已提交，请等待审核。', false);
          setTimeout(() => checkExisting(), 1000);
        } else {
          // 优先用后端的友好中文 message，其次再回退到 error / code，
          // 防止用户看到生硬的错误码（如 "invalid_purpose"）。
          showMsg(data.message || data.error || data.code || '提交失败', true);
        }
      } catch (e) {
        showMsg('网络错误', true);
      }
      btn.disabled = false; btn.textContent = '提交申请';
    }

    function showMsg(text, isErr) {
      const el = document.getElementById('msg');
      el.textContent = text;
      el.className = 'msg ' + (isErr ? 'err' : 'ok');
      el.style.display = 'block';
    }

    init();

    // 赞助横幅折叠/展开。localStorage key 与模型广场、主聊天侧边栏共用，
    // 一处收起、全站收起，避免多页反复弹出打扰。
    (function () {
      const banner = document.getElementById('cancriPromoBanner');
      const btn = document.getElementById('cancriPromoToggle');
      if (!banner || !btn) return;
      const KEY = 'nexusv_promo_donation_v2';
      try {
        if (localStorage.getItem(KEY) === 'collapsed') {
          banner.classList.add('is-collapsed');
          btn.setAttribute('aria-expanded', 'false');
        }
      } catch (_) {}
      btn.addEventListener('click', () => {
        const willCollapse = !banner.classList.contains('is-collapsed');
        banner.classList.toggle('is-collapsed', willCollapse);
        btn.setAttribute('aria-expanded', willCollapse ? 'false' : 'true');
        try { localStorage.setItem(KEY, willCollapse ? 'collapsed' : 'expanded'); } catch (_) {}
      });
    })();
  </script>
</body>
