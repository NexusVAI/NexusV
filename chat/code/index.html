<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="./katex/katex.min.css" />
    <link rel="icon" type="image/png" href="./cancri.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cancri Code · Web</title>
    <!--
      v0.16: 加载主站全局配置（注入 window.__SUPABASE_URL__ / window.__SUPABASE_ANON_KEY__）。
      跟主站 chat/api_apply.html、orders.html、api/admin-*.js 等子页面用同一份 cancri_config.js，
      使本页 (chat/code/index.html) 跟主站完全同源、共享同一份 supabase session。
      路径 ../cancri_config.js 是相对部署路径：chat/code/ → 上一级 chat/cancri_config.js。
      dev 模式下无该文件不致命：auth.ts 还有 fallback URL，只是登录态会读不到。
    -->
    <script src="../cancri_config.js"></script>
    <!-- 设备 / 浏览器指纹（2026-05-16）：反多账号信号采集。详见 js/fingerprint.js 顶部注释。 -->
    <script src="../../js/fingerprint.js?v=2026-05-16-fp-init" defer></script>
    <script defer src="./katex/katex.min.js"></script>
    <style>
      /* v0.16 web 端微调：
         1. 浏览器自带 tab 关闭按钮，所以隐藏自定义 titlebar 节省高度
         2. 主站会把这个页面嵌在 chat 子路径下，不需要 IDE 自己的窗口控件 */
      header.titlebar { display: none !important; }
      :root { --titlebar-h: 0px; }
      body[data-state="welcome"] .app-shell { display: none; }
      body[data-state="workspace"] .welcome-stage { display: none; }

      /* web 顶部工具条：登录态 + 上传 + 导出按钮 */
      .web-topbar {
        position: fixed;
        top: 0; left: 0; right: 0;
        height: 36px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 12px;
        background: var(--bg-secondary, #1f2228);
        border-bottom: 1px solid var(--border, #2a2e36);
        z-index: 30;
        font-size: 12px;
      }
      .web-topbar-brand {
        display: flex; align-items: center; gap: 6px;
        font-weight: 500;
        color: var(--text, #d8dde6);
      }
      .web-topbar-brand img { height: 16px; }
      .web-topbar-spacer { flex: 1; }
      .web-topbar-btn {
        height: 24px;
        padding: 0 10px;
        background: transparent;
        color: var(--text-dim, #8a92a3);
        border: 1px solid var(--border, #2a2e36);
        border-radius: 4px;
        cursor: pointer;
        font-size: 12px;
        font-family: inherit;
      }
      .web-topbar-btn:hover {
        color: var(--text, #d8dde6);
        border-color: var(--accent, #6c8eef);
      }
      .web-topbar-btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .web-topbar-status {
        color: var(--text-dim, #8a92a3);
        font-size: 11px;
      }
      .web-topbar-status.ok { color: #4ec9b0; }
      .web-topbar-status.warn { color: #e3a857; }
      .web-topbar-status.err { color: #f0606b; }
      /* 整体下移让出 topbar 高度 */
      body { padding-top: 36px; }
    </style>
    <script type="module" crossorigin src="./assets/index-web-bES6gMjv.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-web-Drlu6-hY.css">
  </head>
  <body data-state="welcome">
    <!-- ==================== Web 顶部工具条 ==================== -->
    <header class="web-topbar">
      <div class="web-topbar-brand">
        <img src="./cancri.png" alt="" />
        <span>Cancri Code · Web</span>
      </div>
      <span class="web-topbar-status" id="web-auth-status">检查登录态…</span>
      <span class="web-topbar-spacer"></span>
      <button class="web-topbar-btn" id="web-upload-btn" type="button" title="选择文件添加到 workspace（支持多选）">📁 添加文件</button>
      <button class="web-topbar-btn" id="web-export-btn" type="button" title="把当前 workspace 打包下载" disabled>⬇ 导出 zip</button>
      <a class="web-topbar-btn" href="/chat/" style="text-decoration:none;display:inline-flex;align-items:center;line-height:24px;">← 返回主站</a>
    </header>

    <!-- ==================== App body（welcome | workspace） ==================== -->
    <div class="app-root" id="app-root">

      <!-- ---------- Welcome stage ---------- -->
      <section class="welcome-stage" id="welcome-stage">
        <div class="welcome-card">
          <img class="welcome-logo" src="./cancri.png" alt="Cancri Code" />
          <h1 class="welcome-title">Cancri Code <span style="opacity:.5;font-size:.6em;font-weight:400;">Web</span></h1>
          <p class="welcome-sub">在浏览器里跟 AI 一起改你的代码</p>

          <div class="welcome-actions">
            <button class="welcome-btn welcome-btn-primary" id="open-folder-btn" type="button">
              <span class="welcome-btn-icon">📁</span>
              <span class="welcome-btn-text">
                <span class="welcome-btn-title">上传项目目录</span>
                <span class="welcome-btn-sub">浏览器选择本地文件夹（不会上传到任何服务器）</span>
              </span>
            </button>
            <button class="welcome-btn" id="new-project-btn" type="button" disabled>
              <span class="welcome-btn-icon">+</span>
              <span class="welcome-btn-text">
                <span class="welcome-btn-title">从 AI 生成新项目</span>
                <span class="welcome-btn-sub">即将推出 · 用一句话起步</span>
              </span>
            </button>
          </div>

          <div class="welcome-recent" id="welcome-recent" style="display:none;">
            <!-- web 模式下不展示 recent（项目存内存关页面就没） -->
          </div>

          <div class="welcome-meta" id="welcome-meta">booting…</div>
        </div>
      </section>

      <!-- ---------- Workspace stage ---------- -->
      <div class="app-shell" id="app-shell">
        <aside class="sidebar" id="sidebar">
          <div class="resize-handle resize-handle-right" id="sidebar-resize" title="拖动调整侧栏宽度"></div>
          <div class="sidebar-projects">
            <div class="sidebar-section-head">
              <span class="sidebar-section-title">项目</span>
              <button class="sidebar-icon-btn" id="add-project-btn" type="button" title="重新上传项目（替换当前）">+</button>
            </div>
            <div class="sidebar-projects-list" id="sidebar-projects-list"></div>
          </div>

          <div class="sidebar-divider"></div>

          <nav class="sidebar-nav">
            <button class="nav-item active" data-mode="chat" type="button">
              <svg class="nav-icon-svg" width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
                <path d="M7 2.5v9 M2.5 7h9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
              </svg>
              <span class="nav-label">新对话</span>
            </button>
            <button class="nav-item" data-mode="files" type="button">
              <svg class="nav-icon-svg" width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
                <path d="M2 3.5h4l1.2 1.5h4.8v6.5a.5.5 0 0 1-.5.5h-9a.5.5 0 0 1-.5-.5z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
              </svg>
              <span class="nav-label">文件</span>
            </button>
          </nav>

          <div class="sidebar-section sidebar-section-files">
            <div class="filetree-header">
              <span class="sidebar-label">文件树</span>
              <div class="filetree-actions">
                <button class="sidebar-icon-btn filetree-action-btn" id="filetree-refresh" type="button" title="刷新文件树">
                  <svg width="13" height="13" viewBox="0 0 13 13" fill="none" aria-hidden="true">
                    <path d="M2 4 A4 4 0 0 1 10 4 M11 6 L10 4 L8 5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M11 9 A4 4 0 0 1 3 9 M2 7 L3 9 L5 8" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                </button>
                <button class="sidebar-icon-btn filetree-action-btn" id="filetree-collapse" type="button" title="全部折叠">
                  <svg width="13" height="13" viewBox="0 0 13 13" fill="none" aria-hidden="true">
                    <path d="M3.5 4.5 L6.5 7.5 L9.5 4.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                    <rect x="2" y="9" width="9" height="1.3" rx="0.4" fill="currentColor"/>
                  </svg>
                </button>
              </div>
            </div>
            <div class="sidebar-placeholder" id="filetree-root">
              <span>（加载中…）</span>
            </div>
          </div>

          <div class="sidebar-footer">
            <button class="nav-item" id="open-settings-btn" data-mode="settings" type="button">
              <svg class="nav-icon-svg" width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
                <circle cx="7" cy="7" r="1.8" stroke="currentColor" stroke-width="1.4"/>
                <path d="M7 1.5v1.5 M7 11v1.5 M1.5 7h1.5 M11 7h1.5 M3.1 3.1l1 1 M9.9 9.9l1 1 M3.1 10.9l1-1 M9.9 4.1l1-1" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
              </svg>
              <span class="nav-label">设置</span>
            </button>
          </div>
        </aside>

        <main class="main-pane">
          <div class="main-stage" id="main-stage">
            <section class="editor-stage" id="editor-stage">
              <div class="tabbar" id="tabbar"></div>
              <div class="editor-root" id="editor-root"></div>
            </section>

            <section class="chat-stage" id="chat-stage">
              <div class="resize-handle resize-handle-left" id="chat-resize" title="拖动调整 chat 宽度"></div>

              <div class="chat-header" id="chat-header">
                <button class="chat-header-btn" id="chat-history-btn" type="button" title="对话历史（本地）" aria-haspopup="true" aria-expanded="false">
                  <svg width="13" height="13" viewBox="0 0 13 13" fill="none" aria-hidden="true">
                    <path d="M2 3h9 M2 6.5h9 M2 10h9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                  </svg>
                  <span>历史</span>
                </button>
                <div class="chat-header-spacer"></div>
                <button class="chat-header-btn" id="chat-new-btn" type="button" title="新对话">
                  <svg width="13" height="13" viewBox="0 0 13 13" fill="none" aria-hidden="true">
                    <path d="M6.5 2v9 M2 6.5h9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                  </svg>
                </button>

                <div class="history-popover" id="history-popover" hidden role="dialog" aria-label="对话历史">
                  <div class="history-popover-head">
                    <span class="history-popover-title">对话历史</span>
                    <span class="history-popover-sub">保存在本地 · 永不上传</span>
                  </div>
                  <div class="history-popover-list" id="history-popover-list"></div>
                  <div class="history-popover-foot" id="history-popover-foot" hidden>
                    <button class="history-popover-clear" id="history-popover-clear" type="button">清空全部归档</button>
                  </div>
                </div>
              </div>

              <div class="chat-stage-inner">
                <h1 class="chat-stage-title" id="chat-stage-title">
                  我们该在 Cancri Code 中做什么？
                </h1>
                <div class="chat-stage-messages" id="chat-body"></div>

                <div class="chat-card">
                  <textarea
                    class="chat-card-textarea"
                    id="chat-composer"
                    placeholder="向 Cancri Code 描述任务，用 @file:相对路径 引用文件  ·  Ctrl + Enter 发送"
                    rows="1"
                  ></textarea>
                  <div class="chat-card-actions">
                    <button class="chat-icon-btn" type="button" title="附件" disabled>+</button>
                    <div class="chat-card-spacer"></div>
                    <button class="chat-model" id="chat-model" type="button" title="切换模型" aria-haspopup="true" aria-expanded="false">
                      <span class="chat-model-name">model · idle</span>
                      <svg class="chat-model-caret" width="9" height="9" viewBox="0 0 9 9" fill="none" aria-hidden="true">
                        <path d="M1.5 3 L4.5 6 L7.5 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
                      </svg>
                    </button>
                    <button class="chat-send-btn" type="button" title="发送 (Ctrl+Enter)" id="chat-send">
                      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
                        <path d="M7 12 V2 M2.5 6.5 L7 2 L11.5 6.5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
                      </svg>
                    </button>
                  </div>
                  <div class="model-popover" id="model-popover" hidden role="dialog" aria-label="选择模型">
                    <div class="model-popover-head">
                      <span class="model-popover-title">选择模型</span>
                      <span class="model-popover-sub">通过 chat-gateway 路由 · 无需配置 key</span>
                    </div>
                    <div class="model-popover-list" id="model-popover-list"></div>
                  </div>
                </div>
              </div>
            </section>
          </div>
        </main>
      </div>
    </div>

    <!-- ==================== 状态栏（隐藏 Tauri-only 终端按钮） ==================== -->
    <footer class="statusbar" id="statusbar">
      <span class="status-item">Cancri Code · Web Beta</span>
      <span class="status-spacer"></span>
      <span class="status-item" id="status-rust">platform: web</span>
      <span class="status-item" id="status-platform">…</span>
    </footer>

    <!-- ==================== Settings 对话框 ==================== -->
    <div class="modal-backdrop" id="settings-modal" hidden>
      <div class="modal-card" role="dialog" aria-label="设置">
        <div class="modal-head">
          <h2 class="modal-title">设置</h2>
          <button class="modal-close" id="settings-close" type="button" title="关闭">×</button>
        </div>
        <div class="modal-body">
          <section class="settings-section">
            <div class="settings-section-title">个性化 · 主题</div>
            <div class="settings-theme-grid">
              <label class="theme-card" data-theme="dark">
                <input type="radio" name="theme" value="dark" />
                <div class="theme-card-preview theme-preview-dark">
                  <div class="tp-row"></div>
                  <div class="tp-row tp-row-2"></div>
                </div>
                <div class="theme-card-name">深色（默认）</div>
              </label>
              <label class="theme-card" data-theme="light">
                <input type="radio" name="theme" value="light" />
                <div class="theme-card-preview theme-preview-light">
                  <div class="tp-row"></div>
                  <div class="tp-row tp-row-2"></div>
                </div>
                <div class="theme-card-name">浅色</div>
              </label>
              <label class="theme-card" data-theme="warm">
                <input type="radio" name="theme" value="warm" />
                <div class="theme-card-preview theme-preview-warm">
                  <div class="tp-row"></div>
                  <div class="tp-row tp-row-2"></div>
                </div>
                <div class="theme-card-name">暖黄色</div>
              </label>
            </div>
          </section>
          <section class="settings-section">
            <div class="settings-section-title">关于</div>
            <div class="settings-about">
              <div>Cancri Code <strong>Web Beta</strong></div>
              <div class="settings-about-muted">浏览器版 · 项目存内存 · 改后导出 zip 下载</div>
            </div>
          </section>
        </div>
      </div>
    </div>

    <!-- web 模式专用 bootstrap：上传 / 导出 / 登录态检查 -->
  </body>
</html>
