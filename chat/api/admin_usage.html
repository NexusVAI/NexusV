<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <!-- 2026-05-13 审查：抽离内联 script 到 admin-usage-app.js，删 'unsafe-inline' script-src。 -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' data:; img-src 'self' data: blob: https:; connect-src 'self' https://diusqgphvybnzazgopor.supabase.co; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self';" />
    <title>管理员 · API 调用日志 · Cancri</title>
    <link rel="icon" type="image/png" href="../../Logo/Cancri.png" />
    <link rel="apple-touch-icon" href="../../Logo/Cancri.png" />
    <script src="./_anti-debug.js"></script>
    <link rel="stylesheet" href="./api-platform.css?v=2026-05-22-docs-single-page" />
    <style>
      .container {
        max-width: 1400px;
      }
      .stat-card .sub {
        font-size: 11px;
        color: var(--text-mute);
        margin-top: 2px;
      }
      .stat-card.calls .value {
        color: var(--accent);
      }
      .stat-card.errors .value {
        color: var(--err);
      }
      .stat-card.tokens .value {
        color: var(--ok);
      }
      .panels {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 12px;
        margin-bottom: 20px;
      }
      .panel {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 14px 16px;
      }
      .panel h3 {
        font-size: 12px;
        color: var(--text-faint);
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-bottom: 10px;
        font-weight: 600;
      }
      .panel-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 6px 0;
        font-size: 12.5px;
        border-bottom: 1px dashed var(--border);
      }
      .panel-row:last-child {
        border-bottom: none;
      }
      .panel-row .key {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-family: ui-monospace, "SF Mono", Consolas, monospace;
        color: var(--text);
      }
      .panel-row .key.click {
        cursor: pointer;
        color: var(--accent);
      }
      .panel-row .key.click:hover {
        text-decoration: underline;
      }
      .panel-row .count {
        color: var(--text-mute);
        font-weight: 600;
        font-size: 12px;
      }
      .filter-chip-bar {
        display: none;
        align-items: center;
        gap: 8px;
        margin-bottom: 12px;
      }
      .filter-chip-bar.show {
        display: flex;
        flex-wrap: wrap;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 5px 10px;
        background: rgba(96, 165, 250, 0.1);
        border: 1px solid rgba(96, 165, 250, 0.3);
        border-radius: 6px;
        font-size: 12px;
        color: var(--text);
      }
      .chip code {
        font-family: ui-monospace, "SF Mono", Consolas, monospace;
        color: var(--accent);
      }
      .chip button {
        background: transparent;
        border: none;
        color: var(--text-mute);
        cursor: pointer;
        font-size: 14px;
        line-height: 1;
        padding: 0 0 0 4px;
      }
      .chip button:hover {
        color: var(--text);
      }
      /* 表格行内紧凑显示 */
      table {
        font-size: 12.5px;
      }
      th,
      td {
        padding: 10px 12px;
      }
      th {
        font-size: 11.5px;
      }
      tr.row-error {
        background: rgba(248, 113, 113, 0.04);
      }
      td.email .uid {
        display: block;
        margin-top: 2px;
        font-size: 10.5px;
        color: var(--text-faint);
      }
      td.model {
        font-family: var(--font-mono);
        color: var(--text);
        font-size: 11.5px;
      }
      td.tokens {
        font-family: var(--font-mono);
        color: var(--text-mute);
        white-space: nowrap;
      }
      td.tokens .in-out {
        font-size: 10.5px;
        color: var(--text-faint);
      }
      td.ip a {
        font-family: var(--font-mono);
        color: var(--text-mute);
        text-decoration: none;
        cursor: pointer;
        border-bottom: 1px dashed transparent;
      }
      td.ip a:hover {
        color: var(--text);
        border-bottom-color: var(--text-faint);
      }
      .status-pill {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 4px;
        font-size: 10.5px;
        font-weight: 600;
        font-family: var(--font-mono);
      }
      .s-2xx {
        background: rgba(74, 222, 128, 0.12);
        color: var(--ok);
      }
      .s-4xx {
        background: rgba(251, 191, 36, 0.15);
        color: var(--warn);
      }
      .s-5xx {
        background: rgba(248, 113, 113, 0.15);
        color: var(--err);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <nav class="nav">
        <a href="./admin_dashboard.html">仪表盘</a>
        <a href="./admin_users.html">用户</a>
        <a href="./admin_orders.html">订单</a>
        <a href="./admin_usage.html" class="active">调用日志</a>
        <a href="./admin_lines.html">线路</a>
        <a href="./admin.html">API 申请</a>
        <a href="./admin_appeals.html">申诉</a>
        <a href="./admin_stories.html">满月故事</a>
        <span class="badge-admin">ADMIN</span>
        <span class="spacer"></span>
        <a href="../" style="color: var(--text-faint)"
          >← 返回聊天</a
        >
      </nav>

      <div id="loading" class="loading">检查权限中…</div>

      <div id="login-gate" class="gate" style="display: none">
        <h2>需要登录</h2>
        <p>请先登录账号，验证你的管理员身份。</p>
        <a class="btn-primary" href="../">前往登录</a>
      </div>

      <div id="deny-gate" class="gate deny" style="display: none">
        <h2>无权访问</h2>
        <p>这个页面仅站点管理员可见。</p>
        <a class="btn-primary" href="../">返回聊天</a>
      </div>

      <div id="main" style="display: none">
        <header>
          <h1>API 调用日志</h1>
          <p>所有通过 cancri_sk_* key 进入 api-gateway 的调用，按时间倒序。</p>
        </header>

        <div class="toolbar">
          <div class="filter-group" id="windowFilter">
            <button class="filter-btn" data-window="3600000">最近 1 小时</button>
            <button class="filter-btn" data-window="86400000">24 小时</button>
            <button class="filter-btn active" data-window="604800000">7 天</button>
            <button class="filter-btn" data-window="2592000000">30 天</button>
          </div>
          <button class="reload-btn" id="reload-btn">↻ 刷新</button>
          <label style="display: flex; align-items: center; gap: 6px; font-size: 12.5px; cursor: pointer; color: var(--text-soft); padding: 6px 12px; background: var(--bg-elev); border: 1px solid var(--border); border-radius: 6px; margin-left: 8px; user-select: none;">
            <input type="checkbox" id="liveToggle" style="cursor: pointer; width: 14px; height: 14px; accent-color: var(--ok);" />
            实时刷新 (Live)
            <span id="liveIndicator" style="display: inline-block; width: 8px; height: 8px; background: #9ca3af; border-radius: 50%; transition: background-color 0.3s, box-shadow 0.3s;"></span>
          </label>
        </div>

        <div class="stats" id="stats" style="display: none">
          <div class="stat-card calls">
            <div class="label">总调用</div>
            <div class="value" id="stat-calls">—</div>
            <div class="sub" id="stat-calls-sub"></div>
          </div>
          <div class="stat-card errors">
            <div class="label">错误调用</div>
            <div class="value" id="stat-errors">—</div>
            <div class="sub" id="stat-errors-sub"></div>
          </div>
          <div class="stat-card tokens">
            <div class="label">输入 Token</div>
            <div class="value" id="stat-tin">—</div>
          </div>
          <div class="stat-card tokens">
            <div class="label">输出 Token</div>
            <div class="value" id="stat-tout">—</div>
          </div>
          <div class="stat-card">
            <div class="label">独立用户</div>
            <div class="value" id="stat-users">—</div>
          </div>
          <div class="stat-card">
            <div class="label">独立 IP</div>
            <div class="value" id="stat-ips">—</div>
          </div>
          <div class="stat-card">
            <div class="label">使用模型</div>
            <div class="value" id="stat-models">—</div>
          </div>
        </div>

        <div class="panels" id="panels" style="display: none">
          <div class="panel">
            <h3>Top 模型</h3>
            <div id="top-models"></div>
          </div>
          <div class="panel">
            <h3>Top 用户</h3>
            <div id="top-users"></div>
          </div>
          <div class="panel">
            <h3>Top IP</h3>
            <div id="top-ips"></div>
          </div>
        </div>

        <div class="toolbar">
          <input
            id="search"
            class="search-box"
            type="search"
            placeholder="搜邮箱 / IP / model / user_id / key prefix…"
            autocomplete="off"
          />
          <span style="flex: 1"></span>
          <span style="font-size: 12px; color: var(--text-faint)" id="row-count"></span>
        </div>

        <div class="filter-chip-bar" id="chipBar"></div>

        <div class="table-wrap" data-sensitive>
          <table>
            <thead>
              <tr>
                <th style="width: 220px">用户</th>
                <th style="width: 70px">付费</th>
                <th style="width: 130px">IP</th>
                <th style="width: 160px">模型</th>
                <th style="width: 110px">Tokens</th>
                <th style="width: 70px">状态</th>
                <th style="width: 130px">Key</th>
                <th style="width: 140px">时间</th>
              </tr>
            </thead>
            <tbody id="rows">
              <tr>
                <td colspan="8" class="empty">加载中…</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <div id="toast" class="toast"></div>
    </div>

    <script src="../cancri_config.js"></script>
    <!-- 设备 / 浏览器指纹（2026-05-16）：反多账号信号采集。详见 js/fingerprint.js 顶部注释。 -->
    <script src="../../js/fingerprint.js?v=2026-05-16-fp-init" defer></script>
    <script
      src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.46.1/dist/umd/supabase.js"
      crossorigin="anonymous"
    ></script>
    <!-- 2026-05-13 审查：原 inline <script> 抽离到 admin-usage-app.js。 -->
    <script src="./admin-usage-app.js?v=2026-05-20-live-refresh"></script>
  </body>
</html>
