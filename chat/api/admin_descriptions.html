<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex,nofollow" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' data:; img-src 'self' data: blob: https:; connect-src 'self' https://chat.nexusvai.xyz; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self';" />
    <title>管理台· 模型描述 · Cancri</title>
    <link rel="icon" type="image/png" href="../../Logo/Cancri.png" />
    <link rel="apple-touch-icon" href="../../Logo/Cancri.png" />
    <link rel="stylesheet" href="./api-platform.css?v=2026-06-07-search-compact" />
    <script src="./api-platform.js?v=20260607-account-fix"></script>
    <style>
      .desc-toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
        margin-bottom: 16px;
      }
      .desc-search {
        flex: 1;
        min-width: 220px;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--bg-input);
        color: var(--text);
        font-size: 14px;
      }
      .desc-search:focus {
        outline: none;
        border-color: var(--accent, #6366f1);
      }
      .desc-stats {
        font-size: 12px;
        color: var(--text-mute);
      }
      .desc-card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 12px;
        margin-bottom: 12px;
        overflow: hidden;
      }
      .desc-card.has-desc {
        border-color: color-mix(in srgb, var(--accent) 35%, var(--border));
      }
      .desc-head {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        padding: 14px 16px 10px;
        border-bottom: 1px solid var(--border);
      }
      .desc-head-text {
        flex: 1;
        min-width: 0;
      }
      .desc-name {
        font-size: 15px;
        font-weight: 600;
      }
      .desc-meta {
        margin-top: 4px;
        font-size: 12px;
        color: var(--text-mute);
      }
      .desc-id {
        font-family: ui-monospace, "SF Mono", Consolas, monospace;
        font-size: 11.5px;
        color: var(--text-faint);
      }
      .desc-pill {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 999px;
        font-size: 10px;
        font-weight: 600;
        background: rgba(99, 102, 241, 0.12);
        color: var(--accent, #818cf8);
      }
      .desc-body {
        padding: 12px 16px 14px;
      }
      .desc-textarea {
        width: 100%;
        min-height: 72px;
        resize: vertical;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--bg-elev);
        color: var(--text);
        font-size: 13px;
        line-height: 1.45;
        font-family: inherit;
      }
      .desc-textarea:focus {
        outline: none;
        border-color: var(--accent, #6366f1);
      }
      .desc-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 10px;
        align-items: center;
      }
      .btn-save {
        padding: 7px 16px;
        font-size: 12.5px;
        font-weight: 600;
        border: 1px solid rgba(99, 102, 241, 0.35);
        background: rgba(99, 102, 241, 0.1);
        color: var(--accent, #818cf8);
        border-radius: 6px;
        cursor: pointer;
      }
      .btn-save:hover {
        background: rgba(99, 102, 241, 0.18);
      }
      .btn-save:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .btn-clear {
        padding: 7px 12px;
        font-size: 12.5px;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--text-mute);
        border-radius: 6px;
        cursor: pointer;
      }
      .btn-clear:hover {
        color: var(--text);
        border-color: var(--border-strong);
      }
      .desc-hint {
        font-size: 11.5px;
        color: var(--text-faint);
        margin-left: auto;
      }
      .desc-empty {
        padding: 40px 16px;
        text-align: center;
        color: var(--text-mute);
        font-size: 14px;
      }
      @media (max-width: 720px) {
        .desc-hint {
          margin-left: 0;
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <nav class="nav">
        <a href="./admin_dashboard.html">仪表盘</a>
        <a href="./admin.html">审核</a>
        <a href="./admin_orders.html">订单</a>
        <a href="./admin_usage.html">调用日志</a>
        <a href="./admin_lines.html">线路</a>
        <a href="./admin_models.html">模型配置</a>
        <a href="./admin_descriptions.html" class="active">模型描述</a>
        <a href="./admin_users.html">用户</a>
        <a href="./admin_appeals.html">申诉</a>
        <a href="./admin_stories.html">满月故事</a>
        <a href="./admin_orbit.html">百万亿审核</a>
        <span class="badge-admin">ADMIN</span>
        <span class="spacer"></span>
        <a href="../api_models.html" style="color: var(--text-faint)">模型广场 ←</a>
        <a href="../" style="color: var(--text-faint)">←返回聊天</a>
      </nav>

      <div id="loading" class="loading">检查权限中</div>

      <div id="login-gate" class="gate" style="display: none">
        <h2>需要登录</h2>
        <p>请先登录账号，验证你的管理员身份</p>
        <a class="btn-primary" href="../">前往登录</a>
      </div>

      <div id="deny-gate" class="gate deny" style="display: none">
        <h2>无权访问</h2>
        <p>这个页面仅站点管理员可见</p>
        <a class="btn-primary" href="../">返回聊天</a>
      </div>

      <div id="main" style="display: none">
        <header>
          <h1>模型广场描述</h1>
          <p>
            为模型卡片配置一行简介（显示在 model ID 下方）。保存后
            <strong>≤5 秒</strong> 在模型广场生效；未配置则不显示　
            建议用 <code>canonical model id</code>（如 <code>grok-4.3</code>）　
          </p>
        </header>

        <div class="desc-toolbar">
          <input
            id="desc-search"
            class="desc-search"
            type="search"
            placeholder="搜索 model id / 名称 / 品牌 / 描述" 
            autocomplete="off"
          />
          <span class="desc-stats" id="desc-stats"></span>
          <button class="reload-btn" id="reload-btn" type="button">重新加载</button>
        </div>

        <div id="desc-list"></div>
      </div>

      <div id="toast" class="toast"></div>
    </div>

    <script src="../cancri_config.js"></script>
    <script src="../../js/fingerprint.js?v=2026-05-16-fp-init" defer></script>
    <script
      src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.46.1/dist/umd/supabase.js"
      crossorigin="anonymous"
    ></script>
    <script src="./admin-descriptions-app.js?v=2026-06-12-desc"></script>
  </body>
</html>
