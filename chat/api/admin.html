<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <!-- 2026-05-13 审查：抽离内联 script 到 admin-app.js，删 'unsafe-inline'。
         style-src 仍保留 'unsafe-inline'因为 row 渲染中用了少量内联 style 属性。 -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' data:; img-src 'self' data: blob: https:; connect-src 'self' https://diusqgphvybnzazgopor.supabase.co; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self';" />
    <title>管理员 · API 审核 · Cancri</title>
    <link rel="icon" type="image/png" href="../../Logo/Cancri.png" />
    <link rel="apple-touch-icon" href="../../Logo/Cancri.png" />
    <script src="./_anti-debug.js"></script>
    <link rel="stylesheet" href="./api-platform.css?v=2026-05-21-claude-official-colors" />
    <style>
      /* 页面专有：IP 标签 / 批量操作条 / 行复选 / 审核按钮 */
      .ip-link {
        color: var(--text-mute);
        cursor: pointer;
        text-decoration: none;
        border-bottom: 1px dashed transparent;
      }
      .ip-link:hover {
        color: var(--text);
        border-bottom-color: var(--text-faint);
      }
      .ip-dup {
        color: var(--err);
        font-weight: 600;
      }
      .ip-dup:hover {
        color: #fca5a5;
      }
      .ip-count {
        margin-left: 4px;
        padding: 1px 6px;
        background: rgba(248, 113, 113, 0.15);
        color: var(--err);
        border-radius: 3px;
        font-size: 10px;
        font-weight: 700;
      }
      .ip-filter-bar {
        display: none;
        align-items: center;
        gap: 10px;
        margin-bottom: 12px;
        padding: 10px 14px;
        background: rgba(248, 113, 113, 0.08);
        border: 1px solid rgba(248, 113, 113, 0.25);
        border-radius: 8px;
        font-size: 12.5px;
        color: var(--text);
      }
      .ip-filter-bar.show {
        display: flex;
      }
      .ip-filter-bar code {
        color: var(--err);
        font-weight: 600;
      }
      .ip-filter-bar button {
        margin-left: auto;
        padding: 4px 10px;
        background: transparent;
        border: 1px solid var(--border-strong);
        color: var(--text-mute);
        border-radius: 6px;
        font-size: 11.5px;
        cursor: pointer;
      }
      .ip-filter-bar button:hover {
        color: var(--text);
      }
      .batch-bar {
        display: none;
        align-items: center;
        gap: 10px;
        margin-bottom: 12px;
        padding: 10px 14px;
        background: rgba(96, 165, 250, 0.08);
        border: 1px solid rgba(96, 165, 250, 0.25);
        border-radius: 8px;
        font-size: 12.5px;
      }
      .batch-bar.show {
        display: flex;
      }
      .batch-bar .count-pill {
        padding: 2px 10px;
        background: rgba(96, 165, 250, 0.18);
        color: var(--accent);
        border-radius: 4px;
        font-weight: 600;
      }
      .batch-bar .btn-batch {
        padding: 6px 14px;
        border: none;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
      }
      .batch-bar .btn-batch.approve {
        background: rgba(74, 222, 128, 0.18);
        color: var(--ok);
      }
      .batch-bar .btn-batch.approve:hover {
        background: rgba(74, 222, 128, 0.28);
      }
      .batch-bar .btn-batch.reject {
        background: rgba(248, 113, 113, 0.15);
        color: var(--err);
      }
      .batch-bar .btn-batch.reject:hover {
        background: rgba(248, 113, 113, 0.25);
      }
      .batch-bar .btn-clear {
        margin-left: auto;
        padding: 4px 10px;
        background: transparent;
        border: 1px solid var(--border-strong);
        color: var(--text-mute);
        border-radius: 6px;
        font-size: 11.5px;
        cursor: pointer;
      }
      .batch-bar .btn-clear:hover {
        color: var(--text);
      }
      input[type="checkbox"].row-check {
        width: 16px;
        height: 16px;
        cursor: pointer;
        accent-color: var(--accent);
      }
      .actions {
        display: flex;
        gap: 6px;
        white-space: nowrap;
      }
      .btn-approve,
      .btn-reject {
        padding: 6px 12px;
        border: none;
        border-radius: 6px;
        font-size: 12px;
        cursor: pointer;
        font-weight: 500;
      }
      .btn-approve {
        background: rgba(74, 222, 128, 0.15);
        color: var(--ok);
      }
      .btn-approve:hover {
        background: rgba(74, 222, 128, 0.25);
      }
      .btn-reject {
        background: rgba(248, 113, 113, 0.12);
        color: var(--err);
      }
      .btn-reject:hover {
        background: rgba(248, 113, 113, 0.22);
      }
      .btn-approve:disabled,
      .btn-reject:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      /* 2026-05-16：审核页 enrichment 视觉 */
      /* 表格本身设最小宽度：邮箱(240) + 用途(140) + IP(210) + 状态(86)
         + 时间(130) + 操作(220) + checkbox(32) + 间距 ≈ 1100px，窄屏
         .table-wrap overflow-x: auto 接管横向滚动，"用途说明"不再被
         挤成竖排单字。 */
      .apply-table {
        min-width: 1100px;
        width: 100%;
      }
      /* 邮箱列内容多行（邮箱 + tier + risk pills + 用户上下文），td 顶
         对齐让所有列从同一基线起 */
      .apply-table tbody td {
        vertical-align: top;
        padding-top: 10px;
        padding-bottom: 10px;
      }
      /* 用途说明：允许中文按词拆行，不再被挤成竖排单字 */
      .apply-table .purpose {
        word-break: break-word;
        line-height: 1.5;
      }
      /* IP 列 + 地理小字 — 允许换行 */
      .apply-table .ip {
        word-break: break-word;
        line-height: 1.5;
      }
      /* 操作列 — 3 个按钮挤一起时允许折行（防止溢出截掉） */
      .actions {
        flex-wrap: wrap;
      }
      .btn-details {
        padding: 6px 10px;
        border: 1px solid var(--border-strong);
        border-radius: 6px;
        background: transparent;
        color: var(--text-mute);
        font-size: 12px;
        cursor: pointer;
      }
      .btn-details:hover {
        color: var(--text);
        border-color: var(--text-faint);
      }
      .email-line {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
      }
      .tier-pill {
        display: inline-block;
        padding: 1px 7px;
        border-radius: 8px;
        font-size: 10px;
        font-weight: 700;
        font-family: var(--font-mono);
        letter-spacing: 0.3px;
      }
      .tier-pill.paid {
        background: rgba(74, 222, 128, 0.18);
        color: var(--ok, #4ade80);
      }
      .tier-pill.free {
        background: var(--hover, rgba(0, 0, 0, 0.05));
        color: var(--text-faint);
        border: 1px solid var(--line, rgba(0, 0, 0, 0.08));
      }
      .risk-row {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin-top: 5px;
      }
      .risk-pill {
        display: inline-block;
        padding: 1px 7px;
        border-radius: 9px;
        font-size: 10.5px;
        font-weight: 600;
        line-height: 1.5;
      }
      .risk-pill.warn {
        background: rgba(245, 158, 11, 0.15);
        color: #f59e0b;
        border: 1px solid rgba(245, 158, 11, 0.35);
      }
      .risk-pill.danger {
        background: rgba(248, 113, 113, 0.16);
        color: #f87171;
        border: 1px solid rgba(248, 113, 113, 0.45);
      }
      .user-ctx {
        margin-top: 4px;
        font-size: 11px;
        color: var(--text-mute);
        line-height: 1.5;
      }
      .ctx-warn { color: #f59e0b; }
      .ip-geo {
        font-size: 10.5px;
        color: var(--text-mute);
        margin-top: 2px;
        line-height: 1.4;
      }
      /* 详情 sub-row */
      .detail-row td {
        padding: 14px 16px !important;
        background: rgba(0, 0, 0, 0.04);
        border-bottom: 1px solid var(--border-mute);
      }
      .detail-row.detail-empty td {
        color: var(--text-faint);
        font-style: italic;
        font-size: 12.5px;
      }
      .detail-grid {
        display: grid;
        gap: 6px;
      }
      .detail-line {
        display: grid;
        grid-template-columns: 130px 1fr;
        gap: 12px;
        font-size: 12px;
        line-height: 1.55;
      }
      .detail-line .detail-k {
        color: var(--text-faint);
        font-weight: 500;
      }
      .detail-line .detail-v {
        color: var(--text-soft);
        word-break: break-all;
      }
      .detail-line .detail-v code {
        font-family: var(--font-mono);
        font-size: 11.5px;
        color: var(--accent);
        user-select: all;
      }
      .detail-line .detail-ua {
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--text-mute);
      }
      .detail-line .detail-sub {
        color: var(--text-mute);
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <!-- admin.html 用 wide container（1400px）容纳 enrichment 后的 1100px 宽表格，
         避免在大屏（>= 1440px）也出现横向滚动。窄屏 (<1440px) 仍由 .table-wrap
         的 overflow-x: auto 兜底滚动。 -->
    <div class="container container--wide">
      <nav class="nav">
        <a href="../api_apply.html">申请 API</a>
        <a href="../api_keys.html">我的 Keys</a>
        <a href="../api_models.html">模型广场</a>
        <a href="../api_docs.html">文档</a>
        <a href="./admin.html" class="active">审核</a>
        <a href="./admin_orders.html">订单</a>
        <a href="./admin_usage.html">调用日志</a>
        <a href="./admin_lines.html">线路</a>
        <a href="./admin_users.html">用户</a>
        <span class="badge-admin">ADMIN</span>
        <span class="spacer"></span>
        <a href="../" style="color: var(--text-faint)"
          >← 返回聊天</a
        >
      </nav>

      <div id="loading" class="loading">检查权限中…</div>

      <div id="login-gate" class="gate" style="display: none">
        <h2>需要登录</h2>
        <p>请先登录账号，验证你的管理员身份。</p>
        <a class="btn-primary" href="../">前往登录</a>
      </div>

      <div id="deny-gate" class="gate deny" style="display: none">
        <h2>无权访问</h2>
        <p>
          这个页面仅站点管理员可见。如果你认为这是误判，请联系
          <code>站主</code>。
        </p>
        <a class="btn-primary" href="../">返回聊天</a>
      </div>

      <div id="main" style="display: none">
        <header>
          <h1>API 申请审核</h1>
          <p>查看待审核的 API Key 申请，一键 approve / reject。</p>
        </header>

        <div class="stats" id="stats">
          <div class="stat-card pending">
            <div class="label">待审核</div>
            <div class="value" id="stat-pending">—</div>
          </div>
          <div class="stat-card approved">
            <div class="label">已通过</div>
            <div class="value" id="stat-approved">—</div>
          </div>
          <div class="stat-card rejected">
            <div class="label">已拒绝</div>
            <div class="value" id="stat-rejected">—</div>
          </div>
          <div class="stat-card">
            <div class="label">总数</div>
            <div class="value" id="stat-total">—</div>
          </div>
        </div>

        <div class="toolbar">
          <div class="filter-group" id="statusFilter">
            <button class="filter-btn active" data-status="">
              全部<span class="count" id="cnt-all">0</span>
            </button>
            <button class="filter-btn" data-status="pending">
              待审核<span class="count" id="cnt-pending">0</span>
            </button>
            <button class="filter-btn" data-status="approved">
              已通过<span class="count" id="cnt-approved">0</span>
            </button>
            <button class="filter-btn" data-status="rejected">
              已拒绝<span class="count" id="cnt-rejected">0</span>
            </button>
          </div>
          <input
            id="search"
            class="search-box"
            type="search"
            placeholder="搜邮箱 / IP / 用途 / user_id…"
            autocomplete="off"
          />
          <button class="reload-btn" id="reload-btn">↻ 刷新</button>
        </div>

        <div class="ip-filter-bar" id="ipFilterBar">
          已锁定 IP <code id="ipFilterValue"></code>，仅显示该 IP 的申请
          <button id="ipFilterClear">取消筛选</button>
        </div>

        <div class="batch-bar" id="batchBar">
          已选 <span class="count-pill" id="batchCount">0</span> 条申请
          <button class="btn-batch approve" id="batchApprove">批量通过</button>
          <button class="btn-batch reject" id="batchReject">批量拒绝</button>
          <button class="btn-clear" id="batchClear">取消选择</button>
        </div>

        <div class="table-wrap" data-sensitive>
          <table class="apply-table">
            <thead>
              <tr>
                <th style="width: 32px">
                  <input type="checkbox" id="checkAll" class="row-check" title="全选当前可见" />
                </th>
                <th style="width: 240px">邮箱</th>
                <th style="min-width: 140px">用途说明</th>
                <th style="width: 210px">IP</th>
                <th style="width: 86px">状态</th>
                <th style="width: 130px">提交时间</th>
                <th style="width: 220px">操作</th>
              </tr>
            </thead>
            <tbody id="rows">
              <tr>
                <td colspan="7" class="empty">加载中…</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <div id="toast" class="toast"></div>
    </div>

    <script src="../cancri_config.js"></script>
    <!-- 设备 / 浏览器指纹（2026-05-16）：反多账号信号采集。详见 js/fingerprint.js 顶部注释。 -->
    <script src="../../js/fingerprint.js?v=2026-05-16-fp-init" defer></script>
    <script
      src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.46.1/dist/umd/supabase.js"
      crossorigin="anonymous"
    ></script>
    <script src="./admin-formatters.js?v=2026-05-19-permission-init"></script>
    <script src="./admin-app.js?v=2026-05-19-permission-init"></script>
    <!-- 2026-05-13 审查：原 inline <script>（296-692 行）抽离到 admin-app.js。 -->
  </body>
</html>
