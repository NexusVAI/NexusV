<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8" />
  <!-- 2026-06-20 安全加固：原旁CSP。含 unsafe-inline 兼容内联脚本；收素object-src/base-uri/connect-src（含本机回调 127.0.0.1）　-->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://chat.nexusvai.xyz https://challenges.cloudflare.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' data: https://fonts.gstatic.com https://cdn.jsdelivr.net; img-src 'self' data: blob: https:; connect-src 'self' https://chat.nexusvai.xyz http://127.0.0.1:* http://localhost:* https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; worker-src 'self' blob:" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>登录 Cancri Code 桌面立</title>
  <meta name="referrer" content="no-referrer" />
  <link rel="icon" type="image/svg+xml" href="../../Logo/NexusV_favicon.svg" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;500;600&display=swap"
  />
  <script src="./cancri_config.js"></script>
  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.46.1/dist/umd/supabase.js"
    integrity="sha384-L+IlvYRlq83Yqv9kTm92qOc1xXxFuPatpFkRtF+Ov87zhKKV6gcx9GvTURw6uviE"
    crossorigin="anonymous"
  ></script>
  <link rel="stylesheet" href="./styles/00-tokens.css" />
  <link rel="stylesheet" href="./styles/01-claude-tokens.css" />
  <link rel="stylesheet" href="./styles/02-themes.css" />
  <link rel="stylesheet" href="./styles/cancri_motion.css?v=2026-06-05-desktop-login" />
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background: hsl(var(--bg-100));
    }
    .auth-overlay {
      position: fixed;
      inset: 0;
      min-height: 100dvh;
    }
    .auth-desktop-note {
      margin: 0 auto;
      max-width: 420px;
      font-size: 13px;
      line-height: 1.5;
      color: hsl(var(--text-300));
    }
    .auth-status-line {
      min-height: 16px;
      font-size: 12px;
      line-height: 1.45;
      text-align: center;
      color: hsl(var(--text-300));
    }
    .auth-status-line.is-error { color: #e57361; }
    .auth-status-line.is-ok { color: hsl(var(--text-200)); }
    .auth-invalid-panel {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 20;
      place-items: center;
      padding: 24px;
      background: hsl(var(--bg-100));
    }
    .auth-overlay.is-invalid .auth-invalid-panel { display: grid; }
    .auth-overlay.is-invalid .auth-stage,
    .auth-overlay.is-invalid .auth-showcase,
    .auth-overlay.is-invalid .auth-brand { display: none !important; }
    .auth-invalid-card {
      width: min(100%, 420px);
      padding: 24px 22px;
      border-radius: 24px;
      border: 1px solid hsl(var(--border-300) / 0.14);
      background: hsl(var(--bg-100));
      text-align: center;
    }
    .auth-invalid-card h1 {
      margin: 0 0 10px;
      font-size: 18px;
      font-weight: 600;
      color: hsl(var(--text-000));
    }
    .auth-invalid-card p {
      margin: 0;
      font-size: 13px;
      line-height: 1.55;
      color: hsl(var(--text-300));
    }
    .auth-back-link {
      margin-top: 4px;
      align-self: center;
    }
    #authPasswordSection[hidden],
    #authVerifyOtpBtn[hidden],
    #authSendOtpBtn[hidden] {
      display: none !important;
    }
  </style>
</head>
<body>
  <!--
    Cancri Code 桌面端登录页（Sprint 2！
    URL: ?cb=<http://127.0.0.1:PORT/cb>&state=<hex>
    已登归←POST session 到本最cb；未登录 ←邮箱 OTP（无 Turnstile / 无安全验证）
    UI 对齐 claude.html auth-overlay
  -->
  <div class="auth-overlay" id="authOverlay">
    <div class="auth-bg" aria-hidden="true"></div>

    <a class="auth-brand" href="/" aria-label="Cancri">
      <img
        src="../../Logo/Cancri1.jpg"
        data-dark-src="../../Logo/Cancri1.jpg"
        data-light-src="../../Logo/Cancri.png"
        alt="Cancri"
        width="22"
        height="22"
        class="auth-brand-mark cancri-logo"
      />
      <span class="auth-brand-name">Cancri</span>
    </a>

    <div class="auth-stage">
      <div class="auth-hero">
        <h1 class="auth-hero-title">思如闪电！br />构建更快</h1>
        <p class="auth-hero-subtitle">登录 Cancri Code 桌面端，凭证将自动回传至本机应用</p>
      </div>

      <div class="auth-card" id="authCard">
        <div class="auth-step" id="authStepEmail">
          <div class="auth-email-divider"><span>邮箱登录</span></div>

          <label class="auth-field-label" for="authEmailInput">邮箱地址</label>
          <input
            type="email"
            id="authEmailInput"
            class="auth-input"
            placeholder="请输入邮箱"
            autocomplete="email"
            required
          />

          <div class="auth-password-section" id="authPasswordSection" hidden>
            <input
              type="text"
              id="authPasswordInput"
              class="auth-input auth-otp-input"
              placeholder="请输入验证码"
              maxlength="8"
              inputmode="numeric"
              autocomplete="one-time-code"
            />
          </div>

          <button class="auth-btn auth-btn-primary" id="authSendOtpBtn" type="button">
            发送验证码
          </button>

          <button class="auth-btn auth-btn-primary" id="authVerifyOtpBtn" type="button" hidden>
            验证登录
          </button>

          <button type="button" class="auth-mode-toggle auth-back-link" id="authBackBtn" hidden>
            返回修改邮箱
          </button>

          <div class="auth-status-line" id="authStatusLine" aria-live="polite"></div>
          <div class="auth-error" id="authEmailError"></div>
        </div>

        <p class="auth-footer-line">
          继续即表示同愈
          <a href="../terms.html" class="auth-footer-link" target="_blank" rel="noopener">服务条款</a>
          一
          <a href="../privacy.html" class="auth-footer-link" target="_blank" rel="noopener">隐私协议</a>　
        </p>
      </div>

      <p class="auth-desktop-note">
        网页端请访问 <a href="/chat/" class="auth-footer-link">nexusvai.xyz/chat</a>
      </p>

      <div class="auth-mobile-poster" aria-hidden="true">
        <img
          class="auth-mobile-poster-img"
          src="../../Logo/CCODE-1.5.16.9.png"
          alt="Cancri Code"
          width="960"
          height="540"
          loading="lazy"
          decoding="async"
        />
      </div>
    </div>

    <aside class="auth-showcase" aria-hidden="true">
      <img
        class="auth-showcase-poster"
        src="../../Logo/CCODE-1.5.16.9.png"
        alt="Cancri Code"
        width="960"
        height="540"
        loading="lazy"
        decoding="async"
      />
    </aside>

    <div class="auth-invalid-panel" id="authInvalidPanel">
      <div class="auth-invalid-card">
        <h1>无法打开登录</h1>
        <p id="authInvalidMsg">无效的回调参数。请回到 Cancri Code 桌面端重新点击登录</p>
      </div>
    </div>
  </div>

  <script>
    (function () {
      "use strict";

      const params = new URLSearchParams(location.search);
      const cb = params.get("cb") || "";
      const state = params.get("state") || "";

      function isValidCb(url) {
        try {
          const u = new URL(url);
          return (
            u.protocol === "http:" &&
            (u.hostname === "127.0.0.1" || u.hostname === "localhost") &&
            u.pathname === "/cb"
          );
        } catch {
          return false;
        }
      }

      const valid = Boolean(cb && state && isValidCb(cb));
      const overlay = document.getElementById("authOverlay");
      const invalidMsg = document.getElementById("authInvalidMsg");

      const emailInput = document.getElementById("authEmailInput");
      const otpInput = document.getElementById("authPasswordInput");
      const sendBtn = document.getElementById("authSendOtpBtn");
      const verifyBtn = document.getElementById("authVerifyOtpBtn");
      const backBtn = document.getElementById("authBackBtn");
      const otpSection = document.getElementById("authPasswordSection");
      const statusLine = document.getElementById("authStatusLine");
      const errorEl = document.getElementById("authEmailError");
      const authCard = document.getElementById("authCard");

      function setStatus(text, kind) {
        statusLine.textContent = text || "";
        statusLine.className = "auth-status-line" + (kind ? " is-" + kind : "");
      }

      function setError(text) {
        errorEl.textContent = text || "";
      }

      function showOtpStep() {
        otpSection.hidden = false;
        sendBtn.hidden = true;
        verifyBtn.hidden = false;
        backBtn.hidden = false;
        otpInput.focus();
      }

      function showEmailStep() {
        otpSection.hidden = true;
        sendBtn.hidden = false;
        verifyBtn.hidden = true;
        backBtn.hidden = true;
        otpInput.value = "";
        setError("");
      }

      function showDone(message) {
        authCard.innerHTML =
          '<div class="auth-step">' +
          '<p class="auth-status-line is-ok" style="min-height:auto;padding:12px 0;font-size:14px;">' +
          (message || "登录成功，正在返回桌面端 ) +
          "</p></div>";
      }

      function failInvalid(message) {
        overlay.classList.add("is-invalid");
        if (invalidMsg) invalidMsg.textContent = message;
      }

      if (!valid) {
        failInvalid("无效的回调参数。请回到 Cancri Code 桌面端重新点击登录　);
        return;
      }

      const SUPABASE_URL = window.__SUPABASE_URL__ || "";
      const SUPABASE_ANON_KEY = window.__SUPABASE_ANON_KEY__ || "";
      if (!SUPABASE_URL || !SUPABASE_ANON_KEY) {
        failInvalid("Supabase 配置未加载，请刷新页面重试　);
        return;
      }
      if (!window.supabase || !window.supabase.createClient) {
        failInvalid("Supabase Auth SDK 加载失败，请检查网络后刷新　);
        return;
      }

      const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
        auth: {
          persistSession: true,
          autoRefreshToken: false,
          detectSessionInUrl: false,
        },
      });

      async function sendSessionToDesktop(session) {
        const body = {
          access_token: session.access_token,
          refresh_token: session.refresh_token,
          expires_in: session.expires_in || 3600,
          user_email: session.user ? session.user.email || "" : "",
          user_id: session.user ? session.user.id || "" : "",
          state: state,
        };
        showDone("登录成功，正在返回桌面端 );
        const response = await fetch(cb, {
          method: "POST",
          body: JSON.stringify(body),
        });
        if (!response.ok) {
          const text = await response.text().catch(function () {
            return "";
          });
          throw new Error(text || "桌面端登录回调被拒绝　);
        }
        setTimeout(function () {
          window.close();
        }, 800);
      }

      function localizeAuthError(err, fallback) {
        const msg = (err && (err.message || err.error_description || err.error)) || "";
        const code = (err && (err.code || err.error)) || "";
        if (code === "over_email_send_rate_limit") return "邮件发送过于频繁，请稍后再试　;
        if (code === "otp_expired") return "验证码已过期，请重新获取　;
        if (code === "invalid_credentials") return "验证码错误，请检查后重试　;
        if (/timeout/i.test(msg)) return "请求超时，请检查网络　;
        return fallback || msg || "未知错误";
      }

      emailInput.disabled = true;
      sendBtn.disabled = true;
      setStatus("正在检查登录状态 );

      (async function bootstrap() {
        let existingSession = null;
        try {
          const { data } = await supabase.auth.getSession();
          existingSession = data && data.session && data.session.access_token ? data.session : null;
        } catch (err) {
          console.warn("[desktop-login] getSession failed:", err);
        }

        if (existingSession) {
          try {
            await sendSessionToDesktop(existingSession);
          } catch (err) {
            console.warn("[desktop-login] callback failed:", err);
            setError(localizeAuthError(err, "桌面端登录回调失败，请回到 Cancri Code 重新发起登录"　));
          }
          return;
        }

        emailInput.disabled = false;
        sendBtn.disabled = false;
        setStatus("");
      })();

      async function sendOtp() {
        const email = emailInput.value.trim();
        if (!email || !email.includes("@")) {
          setError("请输入有效邮箱　);
          return;
        }
        sendBtn.disabled = true;
        sendBtn.textContent = "发送中 ;
        setError("");
        setStatus("");
        try {
          const timeout = new Promise(function (_, rej) {
            setTimeout(function () {
              rej(new Error("发送超时，请检查网络后重试"));
            }, 12000);
          });
          const { error } = await Promise.race([
            supabase.auth.signInWithOtp({ email: email }),
            timeout,
          ]);
          if (error) throw error;
          setStatus("验证码已发到邮箱，请查收　, "ok");
          showOtpStep();
        } catch (err) {
          setError(localizeAuthError(err, "发送失败，请重试　));
        } finally {
          sendBtn.disabled = false;
          sendBtn.textContent = "发送验证码";
        }
      }

      async function verifyOtp() {
        const email = emailInput.value.trim();
        const code = otpInput.value.trim();
        if (!code || code.length < 6) {
          setError("请输入完整的验证码　);
          return;
        }
        verifyBtn.disabled = true;
        verifyBtn.textContent = "验证中 ;
        setError("");
        try {
          const { data, error } = await supabase.auth.verifyOtp({
            email: email,
            token: code,
            type: "email",
          });
          if (error) throw error;
          if (!data || !data.session || !data.session.access_token) {
            throw new Error("验证返回旁session，请重试　);
          }
          await sendSessionToDesktop(data.session);
        } catch (err) {
          setError(localizeAuthError(err, "验证失败，请重试　));
        } finally {
          verifyBtn.disabled = false;
          verifyBtn.textContent = "验证登录";
        }
      }

      sendBtn.addEventListener("click", sendOtp);
      verifyBtn.addEventListener("click", verifyOtp);
      backBtn.addEventListener("click", function () {
        showEmailStep();
        setStatus("");
      });
      emailInput.addEventListener("keydown", function (e) {
        if (e.key === "Enter" && !sendBtn.hidden) sendOtp();
      });
      otpInput.addEventListener("keydown", function (e) {
        if (e.key === "Enter" && !verifyBtn.hidden) verifyOtp();
      });
    })();
  </script>
<script src="../assets/p2m-loader.js" defer></script>
</body>
</html>
