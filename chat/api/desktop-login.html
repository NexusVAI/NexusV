<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>正在跳转 · NexusVAI</title>
<!--
  2026-08-16 审计 SP-1 修复。

  本文件原先是 chat/desktop-login.html 的一份**陈旧副本**，且已经被编码事故毁掉：
  17 处字符串右引号被 U+3000 全角空格替换（例如 failInvalid("…重新登录。) ），
  内联 <script> 必然抛 SyntaxError；它引用的 ./cancri_config.js、./styles/00-tokens.css
  在 chat/api/ 下也不存在。于是按 /chat/api/desktop-login.html 访问只能得到一个死登录页。

  真身是 chat/desktop-login.html（带 cancri_turnstile_bridge.js 人机验证桥）。

  为什么不直接删文件：旧版桌面客户端可能把本路径硬编码进了登录入口（无法确认存量版本），
  删掉会把那部分用户的登录直接变成 404。改成携带原 query 跳到真身，前向且零破坏。
  ⚠️ ?cb= 回调参数必须透传 —— 桌面端靠它把会话 POST 回本机 127.0.0.1，丢了就登录不完。
-->
<style>
  html, body {
    margin: 0;
    min-height: 100%;
    background: #0b0d12;
    color: #e6e8ee;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
    line-height: 1.7;
  }
  a { color: #7aa2ff; }
</style>
</head>
<body>
<div class="wrap">
  <p>
    正在跳转到登录页…<br />
    若没有自动跳转，请点击 <a id="fallback" href="../desktop-login.html">这里继续登录</a>。
  </p>
</div>
<script>
  (function () {
    var target = "../desktop-login.html" + (window.location.search || "") + (window.location.hash || "");
    var link = document.getElementById("fallback");
    if (link) link.setAttribute("href", target);
    window.location.replace(target);
  })();
</script>
</body>
</html>
