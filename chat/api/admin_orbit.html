<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />

    <title>管理台· 百万亿审核· Cancri</title>
    <link rel="icon" type="image/png" href="../../Logo/Cancri.png" />
    <link rel="apple-touch-icon" href="../../Logo/Cancri.png" />
    <link rel="stylesheet" href="./api-platform.css?v=2026-06-07-search-compact" />
    <script src="./api-platform.js?v=20260607-account-fix"></script>
    <style>
      .orbit-card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-left: 3px solid var(--accent, #4ade80);
        border-radius: 12px;
        margin-bottom: 14px;
        padding: 16px 18px;
        display: grid;
        gap: 12px;
      }
      .orbit-card.approved { border-left-color: #d4a04d; }
      .orbit-card.granted { border-left-color: #22c55e; opacity: 0.92; }
      .orbit-card.rejected { border-left-color: var(--err); opacity: 0.78; }

      .oc-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
      .oc-id { font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 11px; color: var(--text-mute); }
      .oc-time { font-size: 12px; color: var(--text-mute); font-variant-numeric: tabular-nums; }
      .pill { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 11px; font-weight: 600; }
      .pill.pending { background: rgba(74, 222, 128, 0.16); color: #4ade80; }
      .pill.approved { background: rgba(212, 160, 77, 0.18); color: #d4a04d; }
      .pill.granted { background: rgba(34, 197, 94, 0.18); color: #22c55e; }
      .pill.rejected { background: rgba(232, 90, 90, 0.16); color: var(--err); }
      .pill.warn { background: rgba(232, 90, 90, 0.16); color: var(--err); border: 1px solid rgba(232,90,90,0.35); }
      .pill.ok2 { background: rgba(34, 197, 94, 0.14); color: #22c55e; }

      .oc-email { font-weight: 600; font-size: 14px; }
      .oc-meta-row {
        display: flex; gap: 14px; flex-wrap: wrap;
        font-size: 11px; color: var(--text-mute);
        padding: 6px 10px; background: var(--bg-elev); border-radius: 6px;
      }
      .oc-meta-row code { color: var(--text); font-size: 11px; padding: 0 4px; background: rgba(255,255,255,0.04); border-radius: 3px; }

      .oc-fields { display: grid; gap: 8px; }
      .oc-field { font-size: 13px; line-height: 1.6; }
      .oc-field b { color: var(--text-mute); font-weight: 600; margin-right: 6px; }
      .oc-project {
        background: var(--bg-elev); border: 1px solid var(--border); border-radius: 8px;
        padding: 10px 12px; font-size: 13.5px; line-height: 1.7; white-space: pre-wrap; word-wrap: break-word; color: var(--text);
      }
      .oc-grant-info { font-size: 12px; color: var(--text-mute); }

      .oc-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
      .tier-select {
        background: var(--bg-elev); border: 1px solid var(--border); color: var(--text);
        border-radius: 6px; padding: 6px 10px; font-size: 13px;
      }
      .btn-approve, .btn-reject {
        padding: 6px 14px; border-radius: 6px; font-size: 13px; font-weight: 500; border: 1px solid; cursor: pointer; transition: opacity 0.15s;
      }
      .btn-approve { background: rgba(34, 197, 94, 0.18); color: #22c55e; border-color: rgba(34, 197, 94, 0.3); }
      .btn-reject { background: rgba(232, 90, 90, 0.18); color: var(--err); border-color: rgba(232, 90, 90, 0.3); }
      .btn-approve:hover, .btn-reject:hover { opacity: 0.85; }
      button:disabled { opacity: 0.5; cursor: not-allowed; }

      .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
      .filter-group { display: flex; gap: 6px; flex-wrap: wrap; }
      .filter-btn {
        background: transparent; border: 1px solid var(--border); color: var(--text-mute);
        padding: 7px 14px; border-radius: 8px; cursor: pointer; font-size: 13px;
      }
      .filter-btn.active { color: var(--text); border-color: var(--accent, #4ade80); background: rgba(74,222,128,0.08); }
      .count-badge {
        display: inline-block; min-width: 18px; padding: 1px 6px; margin-left: 4px;
        font-size: 11px; font-variant-numeric: tabular-nums; border-radius: 999px;
        background: rgba(255, 255, 255, 0.08); color: var(--text-mute); line-height: 1.3;
      }
      .reload-btn { margin-left: auto; background: transparent; border: 1px solid var(--border); color: var(--text-mute); padding: 7px 14px; border-radius: 8px; cursor: pointer; font-size: 13px; }

      .empty { text-align: center; padding: 40px; color: var(--text-mute); background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; }
      .empty.err { color: var(--err); }
      .toast {
        position: fixed; right: 24px; bottom: 24px;
        background: var(--bg-card); color: var(--text);
        border: 1px solid var(--border); border-radius: 8px;
        padding: 10px 16px; font-size: 13px;
        opacity: 0; transform: translateY(8px);
        transition: opacity 0.2s, transform 0.2s;
        pointer-events: none; z-index: 1000;
      }
      .toast.show { opacity: 1; transform: translateY(0); }
      .toast.ok { border-color: rgba(34, 197, 94, 0.4); }
      .toast.err { border-color: rgba(232, 90, 90, 0.4); }

      .legend {
        font-size: 12.5px; color: var(--text-mute); line-height: 1.7;
        background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; margin-bottom: 16px;
      }
      .legend code { color: var(--text); }
    </style>
  </head>
  <body>
    <div class="container">
      <nav class="nav">
        <a href="./admin_dashboard.html">仪表盘</a>
        <a href="./admin.html">审核</a>
        <a href="./admin_orders.html">订单</a>
        <a href="./admin_usage.html">调用日志</a>
        <a href="./admin_lines.html">线路</a>
        <a href="./admin_users.html">用户</a>
        <a href="./admin_appeals.html">申诉</a>
        <a href="./admin_stories.html">满月故事</a>
        <a href="./admin_orbit.html" class="active">百万亿审核</a>
        <span class="badge-admin">ADMIN</span>
        <span class="spacer"></span>
        <a href="../" style="color: var(--text-faint)">←返回聊天</a>
      </nav>

      <div id="loading" class="loading">检查权限中</div>

      <div id="login-gate" class="gate" style="display: none">
        <h2>需要登录</h2>
        <p>请先登录账号，验证你的管理员身份</p>
        <a class="btn-primary" href="../">前往登录</a>
      </div>

      <div id="deny-gate" class="gate deny" style="display: none">
        <h2>无权访问</h2>
        <p>这个页面仅站点管理员可见</p>
        <a class="btn-primary" href="../">返回聊天</a>
      </div>

      <div id="main" style="display: none">
        <header>
          <h1>百万Token 创造者激· 审核</h1>
        </header>

        <div class="legend">
          通过即按档位发放<strong>会过期的高档订阅</strong>（到期掉回免费档，制造落差逼转化）
          <code>A → Pro+ 14 天</code> · <code>B → Pro 7 天</code> · <code>C → Pro 3 天</code>
          目标邮箱已注册账号 → 立即发放 + 邮件；未注册 → 标记 <code>待领取</code>，用户用该邮箱登录后自动到账。
          发放走既有不变式：不降档0 天上限、跨周期不重置已用量；每个账号终身仅一次
        </div>

        <div class="toolbar">
          <div class="filter-group" id="statusFilter">
            <button class="filter-btn active" data-filter="pending">待审<span class="count-badge" data-count-for="pending">·</span></button>
            <button class="filter-btn" data-filter="approved">待领<span class="count-badge" data-count-for="approved">·</span></button>
            <button class="filter-btn" data-filter="granted">已发<span class="count-badge" data-count-for="granted">·</span></button>
            <button class="filter-btn" data-filter="rejected">已驳<span class="count-badge" data-count-for="rejected">·</span></button>
            <button class="filter-btn" data-filter="all">全部</button>
          </div>
          <button class="reload-btn" id="reloadBtn">刷新</button>
        </div>

        <div id="list"></div>
      </div>

      <div id="toast" class="toast"></div>
    </div>

    <script src="../cancri_config.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.46.1/dist/umd/supabase.js"
      crossorigin="anonymous"
    ></script>
    <script src="./admin-orbit-app.js?v=2026-06-02-orbit"></script>
  </body>
</html>
