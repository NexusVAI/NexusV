<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://chat.nexusvai.xyz; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self';" />
  <title>结账 · NexusV 开放平台</title>
  <meta name="description" content="NexusV 订单结账：扫码支付并提交订单信息。" />
  <base href="../../" />
  <script>
    (() => {
      let theme = 'warm';
      try { theme = localStorage.getItem('theme') || 'warm'; } catch (e) {}
      if (theme === 'light') document.documentElement.classList.add('light-theme');
      if (theme === 'warm') document.documentElement.classList.add('warm-theme');
      if (theme === 'blue') document.documentElement.classList.add('blue-theme');
      if (theme === 'dark') document.documentElement.classList.add('dark-theme');
    })();
  </script>
  <link rel="icon" type="image/png" href="Logo/Cancri.png" />
  <link rel="preconnect" href="https://chat.nexusvai.xyz" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/navbar.css" />
  <link rel="stylesheet" href="css/mobile-menu.css" />
  <link rel="stylesheet" href="css/footer.css" />
  <link rel="stylesheet" href="css/inter-fonts.css" />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/display-fonts.css" />
  <style>
    /* ═══ Stripe Checkout 1:1 像素复刻 ═══
       源文件：Stripe Checkout (2026_6_22 23：00：18).html
       所有数值来自源文件 :root 变量 + 实际 CSS 规则（parse_stripe4/5.js 提取）
       颜色解析：--checkout-text-dark-l:10% → gray = hsla(0,0%,10%,alpha)
         gray400 = rgba(26,26,26,0.6)  gray500 = rgba(26,26,26,0.65)
         gray800 = rgba(26,26,26,0.9)   gray50  = rgba(26,26,26,0.1) (border) */
    :root {
      --ck-app-width: 920px;
      --ck-tablet: 380px;
      --ck-gutter: 16px;          /* --space-4 */
      --ck-vpad: 48px;
      --ck-bg-shadow: 15px 0 30px 0 rgba(0,0,0,0.18);
      --ck-white: #ffffff;
      --ck-blue: #0074d4;
      --ck-blue-dark: #0066ba;
      --ck-red: #dc2727;
      --ck-green: #24b47e;
      --ck-gray50: rgba(26,26,26,0.1);
      --ck-gray100: rgba(26,26,26,0.2);
      --ck-gray400: rgba(26,26,26,0.6);
      --ck-gray500: rgba(26,26,26,0.65);
      --ck-gray800: rgba(26,26,26,0.9);
      --ck-border: 1px solid var(--ck-gray50);
      --ck-input-h: 44px;
      --ck-input-bg: #fff;
      --ck-input-ph: var(--ck-gray400);
      --ck-radius: 18px;          /* --very-rounded */
      --ck-radius-sm: 6px;        /* --rounded */
      --ck-li-img: 42px;
      --ck-li-img-radius: 12px;
      --ck-biz-icon: 28px;
      --ck-biz-shadow: 0 2px 5px 0 rgba(50,50,93,0.1), 0 1px 1px 0 rgba(0,0,0,0.07);
      --ck-focus-shadow: 0 0 0 1px rgba(50,151,211,0.7), 0 1px 1px 0 rgba(0,0,0,0.07), 0 0 0 4px rgba(50,151,211,0.5);
      --ck-font: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", "Helvetica Neue", "Ubuntu", "PingFang SC", "Hiragino Sans GB", "Heiti SC", "Microsoft YaHei", "Microsoft JhengHei", sans-serif;
    }
    .checkout-page {
      background: var(--ck-white); min-height: 100dvh;
      font-family: var(--ck-font); color: var(--ck-gray800);
      font-size: 16px; line-height: 1.5;
    }

    /* App-Container：右半屏固定白底 + 阴影 */
    .ck-container {
      position: relative; min-height: calc(100dvh - var(--ck-vpad));
      display: flex; justify-content: center;
    }
    .ck-container::before {
      content: " "; position: fixed; right: 0; top: 0; height: 100%; width: 50%;
      background: var(--ck-white); box-shadow: var(--ck-bg-shadow);
      transform-origin: right; z-index: -1;
    }
    @media (max-width: 991.98px) { .ck-container::before { display: none; } }

    /* App：桌面 flex-row 两栏 920px，移动 flex-column */
    .ck-app {
      display: flex; flex-direction: column; width: 100%;
      max-width: var(--ck-app-width); margin: 0 auto;
    }
    @media (min-width: 992px) {
      .ck-app {
        flex-direction: row; justify-content: space-between;
        align-items: flex-start;
      }
    }

    /* 左栏 App-Overview */
    .ck-overview { width: 100%; background: var(--ck-white); }
    @media (min-width: 992px) {
      .ck-overview { width: var(--ck-tablet); padding-bottom: calc(16px + 12px * 2); }
    }

    /* Header：商家图标 + 名（padding 16px, margin-bottom 16px）*/
    .ck-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: var(--ck-gutter); margin-bottom: var(--ck-gutter);
      width: 100%; box-sizing: border-box;
    }
    .ck-header__inner {
      display: flex; align-items: center; margin: 0 auto;
      max-width: var(--ck-tablet);
    }
    .ck-business-icon {
      width: var(--ck-biz-icon); height: var(--ck-biz-icon); border-radius: 100%;
      margin-right: 8px; box-shadow: var(--ck-biz-shadow);
      background: var(--ck-white); object-fit: contain; flex-shrink: 0;
    }
    .ck-business-name {
      font-size: 14px; font-weight: 500; color: var(--ck-gray800);
      margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    /* OrderSummaryColumn：gap 12px */
    .ck-summary-col {
      display: flex; flex-direction: column; gap: 12px;
      padding: 0 var(--ck-gutter);
    }
    @media (min-width: 992px) {
      .ck-summary-col { padding: 0; }
    }

    /* ProductSummary：订阅名 16px/500 gray500 + 大号金额 36px/600 gray800 + 周期 14px/500 gray500 */
    .ck-ps { display: flex; flex-direction: column; }
    .ck-ps__name {
      font-size: 16px; font-weight: 500; color: var(--ck-gray500);
      margin: 0 0 3px; word-break: break-word;
    }
    .ck-ps__total {
      display: flex; align-items: baseline; flex-wrap: wrap;
    }
    .ck-ps__amount {
      font-size: 36px; font-weight: 600; color: var(--ck-gray800);
      font-variant-numeric: tabular-nums; letter-spacing: -0.03rem;
      margin-right: 8px; line-height: 1.1;
    }
    .ck-ps__interval {
      font-size: 14px; font-weight: 500; color: var(--ck-gray500);
      display: inline-block;
    }

    /* OrderDetails：margin-top 24px (my6) */
    .ck-order-details { margin-top: 24px; }
    .ck-od-items { list-style: none; margin: 0; padding: 0; }
    .ck-od-item { display: block; margin-bottom: 16px; }

    /* LineItem：42px 圆角图 + 名/描述/周期 + 金额 */
    .ck-line-item {
      display: flex; align-items: flex-start;
    }
    .ck-li__img-wrap {
      width: var(--ck-li-img); height: var(--ck-li-img);
      display: flex; align-items: center; justify-content: center;
      margin-right: 16px; flex-shrink: 0;
    }
    .ck-li__img {
      max-width: 100%; max-height: 100%;
      border-radius: var(--ck-li-img-radius); object-fit: cover;
    }
    .ck-li__body { flex: 1; min-width: 0; }
    .ck-li__name {
      font-size: 14px; font-weight: 500; color: var(--ck-gray800);
      margin: 0 0 2px; line-height: 24px;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden; word-break: break-word;
    }
    .ck-li__desc {
      font-size: 12px; font-weight: 400; color: var(--ck-gray400);
      margin: 0 0 2px;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .ck-li__billing {
      font-size: 12px; font-weight: 400; color: var(--ck-gray400); margin: 0;
    }
    .ck-li__amount {
      font-size: 14px; font-weight: 500; color: var(--ck-gray800);
      font-variant-numeric: tabular-nums; margin-left: auto; flex-shrink: 0;
    }

    /* OrderDetails-footer：padding-bottom 16px，is-indented margin-left = 42+16=58px */
    .ck-od-footer { padding-bottom: 16px; }
    @media (min-width: 992px) {
      .ck-od-footer { margin-left: 58px; }
    }

    /* 小计行 */
    .ck-subtotal {
      display: flex; justify-content: space-between; align-items: baseline;
    }
    .ck-subtotal__label {
      font-size: 14px; font-weight: 500; color: var(--ck-gray800);
    }
    .ck-subtotal__value {
      font-size: 14px; font-weight: 600; color: var(--ck-gray800);
      font-variant-numeric: tabular-nums;
    }

    /* 促销码入口（Stripe：蓝标签 #0074d4 + input + 应用按钮，disabled 态）*/
    .ck-promo {
      position: relative; margin-top: 12px; margin-bottom: 16px;
    }
    .ck-promo__label {
      font-size: 14px; font-weight: 500; color: var(--ck-blue);
      display: block; margin-bottom: 4px;
    }
    .ck-promo__input {
      width: 100%; height: 36px; padding: 0 12px;
      border: 1px solid var(--ck-gray50); border-radius: var(--ck-radius);
      background: var(--ck-input-bg); font-size: 14px; font-family: var(--ck-font);
      color: var(--ck-gray800); box-sizing: border-box;
    }
    .ck-promo__input::placeholder { color: var(--ck-input-ph); }

    /* 今日应付合计：border-top 1px gray50 + padding-top 16px */
    .ck-total {
      display: flex; justify-content: space-between; align-items: baseline;
      border-top: var(--ck-border); padding-top: 16px;
    }
    .ck-total__label {
      font-size: 14px; font-weight: 500; color: var(--ck-gray800);
    }
    .ck-total__value {
      font-size: 16px; font-weight: 600; color: var(--ck-gray800);
      font-variant-numeric: tabular-nums;
    }

    /* 右栏 App-Payment */
    .ck-payment {
      width: 100%; background: var(--ck-white); position: relative;
      padding: 0 var(--ck-gutter);
    }
    @media (min-width: 992px) {
      .ck-payment { width: var(--ck-tablet); padding: 0; height: 100%; }
    }
    @media (max-width: 991.98px) {
      .ck-payment { padding-top: 24px; }
    }

    /* PaymentForm：gap 24px, padding-bottom 48px */
    .ck-pay-form {
      display: flex; flex-direction: column; gap: 24px;
      padding-bottom: 48px;
    }

    /* 扫码区（在左栏今日应付合计下方，胶囊 + 图片居中对齐）*/
    .ck-qr-section {
      display: flex; flex-direction: column; align-items: center;
      margin-top: 24px; padding: 0 var(--ck-gutter);
    }
    @media (min-width: 992px) {
      .ck-qr-section { padding: 0; }
    }
    .ck-pay-tabs {
      display: inline-flex; gap: 4px; padding: 4px; margin-bottom: 16px;
      border: 1px solid var(--ck-gray50); border-radius: 500px; background: #f7f7f7;
    }
    .ck-pay-tabs button {
      padding: 7px 18px; border: none; border-radius: 500px;
      background: transparent; color: var(--ck-gray500); font-size: 13px;
      font-family: var(--ck-font); cursor: pointer;
      transition: background 0.18s, color 0.18s; white-space: nowrap;
    }
    .ck-pay-tabs button.is-active {
      background: var(--ck-blue); color: #fff; font-weight: 600;
    }
    .ck-qr-wrap {
      display: flex; justify-content: center; margin-bottom: 12px; min-height: 220px;
    }
    .ck-qr-wrap img {
      max-width: 220px; width: 100%; height: auto; border-radius: 10px;
      background: #fff; padding: 8px; display: block;
      transition: opacity 0.22s ease;
    }
    .ck-qr-wrap img.is-leaving { opacity: 0; }
    .ck-qr-note {
      font-size: 12px; color: var(--ck-gray400); text-align: center;
      line-height: 1.6; margin: 0;
    }
    .ck-qr-note code { color: var(--ck-blue); font-family: var(--ck-font); }

    /* 表单字段（Stripe CheckoutInput：44px 高，16px 字号，18px 圆角，focus 蓝色 box-shadow）*/
    .ck-form { display: flex; flex-direction: column; gap: 12px; }
    .ck-field { display: flex; flex-direction: column; }
    .ck-field > label {
      font-size: 14px; font-weight: 500; color: var(--ck-gray800);
      margin-bottom: 6px;
    }
    .ck-field > label .req { color: var(--ck-blue); }
    .ck-field input, .ck-field select {
      width: 100%; height: var(--ck-input-h);
      padding: 8px 12px; border: none; border-radius: var(--ck-radius);
      background: var(--ck-input-bg); color: var(--ck-gray800);
      font-size: 16px; font-family: var(--ck-font); box-sizing: border-box;
      box-shadow: 0 0 0 1px #e0e0e0, 0 1px 1.5px 0 rgba(0,0,0,0.05);
      transition: box-shadow 0.08s ease-in, color 0.08s ease-in;
      -webkit-appearance: none; appearance: none;
    }
    .ck-field input::placeholder { color: var(--ck-input-ph); }
    .ck-field input:focus, .ck-field select:focus {
      outline: none; box-shadow: var(--ck-focus-shadow);
    }
    .ck-field input:disabled {
      background: #f7f7f7; color: var(--ck-gray400); box-shadow: 0 0 0 1px #e0e0e0;
    }
    .ck-field__hint {
      font-size: 12px; color: var(--ck-gray400); margin-top: 6px;
    }
    .ck-field__hint.err { color: var(--ck-red); }
    .ck-field-row {
      display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
    }
    @media (max-width: 480px) { .ck-field-row { grid-template-columns: 1fr; } }

    /* 提交按钮（Stripe Button--primary：蓝底白字，hover 深蓝，active 缩放 0.98）*/
    .ck-submit {
      width: 100%; height: var(--ck-input-h); margin-top: 12px;
      border: none; border-radius: var(--ck-radius);
      background: var(--ck-blue); color: #fff; font-size: 16px;
      font-weight: 600; font-family: var(--ck-font); cursor: pointer;
      transition: background 0.15s;
    }
    .ck-submit:hover:not(:disabled) { background: var(--ck-blue-dark); }
    .ck-submit:active:not(:disabled) { transform: scale(0.98); }
    .ck-submit:disabled { background: var(--ck-blue-dark); opacity: 0.7; cursor: default; }
    .ck-secondary {
      display: block; margin-top: 12px; text-align: center;
      font-size: 14px; color: var(--ck-blue); text-decoration: none;
    }
    .ck-secondary:hover { text-decoration: underline; }

    /* Footer：Powered by + 条款 + 隐私（12px/400 gray400，flex-wrap center，gap 8px 12px）*/
    .ck-footer {
      display: flex; align-items: center; flex-wrap: wrap;
      justify-content: center; font-size: 12px;
      gap: 8px 12px; padding: 16px 0;
    }
    .ck-footer__powered {
      margin-top: 1px; padding-right: 16px; text-align: center;
      position: relative; color: var(--ck-gray400);
    }
    .ck-footer__powered::after {
      content: ""; position: absolute; right: 0; top: 10%; height: 80%;
      border-right: 1px solid var(--ck-gray100);
    }
    .ck-footer__powered a, .ck-footer__link {
      font-size: 12px; font-weight: 400; color: var(--ck-gray400);
      text-decoration: none;
    }
    .ck-footer__powered a:hover, .ck-footer__link:hover {
      color: var(--ck-blue); text-decoration: underline dotted var(--ck-gray400);
    }

    /* 骨架屏（加载态）*/
    .ck-skeleton {
      background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 37%, #f0f0f0 63%);
      background-size: 400% 100%;
      animation: ck-shimmer 1.4s ease infinite;
      border-radius: 4px;
    }
    @keyframes ck-shimmer {
      0% { background-position: 100% 50%; }
      100% { background-position: 0 50%; }
    }
    .ck-skel-line { height: 14px; margin-bottom: 8px; }
    .ck-skel-line--sm { width: 40%; }
    .ck-skel-line--md { width: 65%; }
    .ck-skel-line--lg { width: 90%; }
    .ck-skel-amount { height: 36px; width: 50%; margin: 4px 0 12px; }
    .ck-skel-img { width: 42px; height: 42px; border-radius: 12px; }
    .ck-skel-input { height: 44px; border-radius: 18px; }
    .ck-skel-qr { width: 220px; height: 220px; border-radius: 10px; margin: 0 auto; }
    .ck-skel-btn { height: 44px; border-radius: 18px; }

    #ck-msg { margin-top: 12px; }
    #ck-login {
      padding: 60px 20px; text-align: center; color: var(--ck-gray500); font-size: 14px;
    }
    .ck-alert {
      padding: 10px 14px; border-radius: var(--ck-radius-sm);
      font-size: 13px; line-height: 1.6;
    }
    .ck-alert--info { background: #f7f7f7; color: var(--ck-gray800); }
    .ck-alert--warn { background: #fef0f0; color: var(--ck-red); }
    .ck-alert--ok { background: #f0f9f4; color: var(--ck-green); }
    .ck-alert code { font-family: var(--ck-font); font-weight: 600; }
    .ck-alert a { color: var(--ck-blue); }
  </style>
</head>
<body>
  <main class="checkout-page">
    <div class="ck-container">
      <div class="ck-app">
        <!-- ══ 左栏 App-Overview ══ -->
        <div class="ck-overview">
          <div class="ck-header">
            <div class="ck-header__inner">
              <img class="ck-business-icon" src="Logo/Cancri.png" alt="NexusV" />
              <h1 class="ck-business-name">NexusV / Cancri</h1>
            </div>
          </div>

          <div class="ck-summary-col">
            <!-- 骨架屏（加载时显示，JS 填充后隐藏）-->
            <div id="skel-ps" class="ck-ps">
              <div class="ck-skel-line ck-skel-line--md ck-skeleton"></div>
              <div class="ck-skel-amount ck-skeleton"></div>
            </div>
            <div class="ck-ps" id="real-ps" style="display:none">
              <h2 class="ck-ps__name" id="ps-name">—</h2>
              <div class="ck-ps__total">
                <span class="ck-ps__amount" id="ps-amount">¥—</span>
                <span class="ck-ps__interval" id="ps-interval"></span>
              </div>
            </div>

            <section class="ck-order-details">
              <ul class="ck-od-items">
                <li class="ck-od-item">
                  <div class="ck-line-item">
                    <div class="ck-li__img-wrap">
                      <img class="ck-li__img" id="li-img" src="Logo/Cancri.png" alt="" />
                    </div>
                    <div class="ck-li__body">
                      <p class="ck-li__name" id="li-name">—</p>
                      <p class="ck-li__desc" id="li-desc"></p>
                      <p class="ck-li__billing" id="li-billing"></p>
                    </div>
                    <span class="ck-li__amount" id="li-amount">¥—</span>
                  </div>
                </li>
              </ul>

              <div class="ck-od-footer">
                <div class="ck-subtotal">
                  <span class="ck-subtotal__label">小计</span>
                  <span class="ck-subtotal__value" id="subtotal-value">¥—</span>
                </div>

                <div class="ck-promo">
                  <span class="ck-promo__label">添加促销码</span>
                  <input class="ck-promo__input" type="text" placeholder="添加促销码" disabled />
                </div>

                <div class="ck-total">
                  <span class="ck-total__label">今日应付合计</span>
                  <span class="ck-total__value" id="total-value">¥—</span>
                </div>
              </div>
            </section>

            <!-- 扫码付款区（在今日应付合计下方，胶囊 + 图片居中对齐）-->
            <div class="ck-qr-section" id="ck-qr-section" style="display:none">
              <div class="ck-pay-tabs" id="pay-method-tabs">
                <button type="button" data-pay-method="wechat" class="is-active">微信支付</button>
                <button type="button" data-pay-method="alipay">支付宝</button>
              </div>
              <div class="ck-qr-wrap">
                <img id="qr-img" src="Logo/1107.jpg" alt="微信收款码" loading="lazy" />
              </div>
              <p class="ck-qr-note">
                <span id="qr-recommend">推荐使用微信支付</span>，应付 <code id="qr-amount">¥—</code><br />
                付款备注请填 <code>邮箱 + QQ/微信</code>
              </p>
            </div>
          </div>
        </div>

        <!-- ══ 右栏 App-Payment ══ -->
        <div class="ck-payment">
          <!-- 骨架屏（加载/登录检查时显示）-->
          <div id="skel-payment" class="ck-pay-form">
            <div class="ck-field">
              <div class="ck-skel-line ck-skel-line--sm ck-skeleton" style="margin-bottom:6px"></div>
              <div class="ck-skel-input ck-skeleton"></div>
            </div>
            <div class="ck-field-row">
              <div class="ck-field">
                <div class="ck-skel-line ck-skel-line--sm ck-skeleton" style="margin-bottom:6px"></div>
                <div class="ck-skel-input ck-skeleton"></div>
              </div>
              <div class="ck-field">
                <div class="ck-skel-line ck-skel-line--sm ck-skeleton" style="margin-bottom:6px"></div>
                <div class="ck-skel-input ck-skeleton"></div>
              </div>
            </div>
            <div class="ck-field">
              <div class="ck-skel-line ck-skel-line--sm ck-skeleton" style="margin-bottom:6px"></div>
