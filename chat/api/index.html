<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://chat.nexusvai.xyz; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self';" />
  <title>NexusV 开放平台</title>
  <meta name="description" content="在 NexusV 平台上开发领先的 AI 产品。一个端点，多种协议，一把密钥——把 OpenAI、Anthropic 与 Codex 原生协议归一到同一个 API 网关。" />
  <!-- 本页位于 chat/api/，用 <base> 把相对路径锚定到站点根，
       这样可直接复用主站的 components.js / menu.js / navbar.css（它们的链接都以站点根为基准）。 -->
  <base href="../../" />
  <script>
    (() => {
      let theme = 'warm';
      try { theme = localStorage.getItem('theme') || 'warm'; } catch (e) {}
      if (theme === 'light') document.documentElement.classList.add('light-theme');
      if (theme === 'warm') document.documentElement.classList.add('warm-theme');
      if (theme === 'blue') document.documentElement.classList.add('blue-theme');
      if (theme === 'dark') document.documentElement.classList.add('dark-theme');
    })();
  </script>
  <link rel="icon" type="image/png" href="Logo/Cancri.png" />
  <link rel="apple-touch-icon" href="Logo/Cancri.png" />
  <link rel="preconnect" href="https://chat.nexusvai.xyz" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/navbar.css" />
  <link rel="stylesheet" href="css/mobile-menu.css" />
  <link rel="stylesheet" href="css/footer.css" />
  <link rel="stylesheet" href="css/inter-fonts.css" />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/display-fonts.css" />
  <link rel="stylesheet" href="chat/api/oai-home.css" />
</head>
<body>
  <!-- 主站导航 / 页脚由 components.js 注入（见页底 injectComponents） -->

  <main class="api-home">
    <section class="api-hero">
      <h1 class="api-hero__title">在 NexusV 平台上开发领先的 AI 产品</h1>
      <div class="api-hero__actions">
        <a class="api-btn api-btn--solid" href="chat/api_apply.html">联系销售人员</a>
        <a class="api-btn api-btn--ghost" href="chat/api_models.html">开始构建
          <svg class="api-btn__chevron" xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 10 16" fill="none" aria-hidden="true"><path fill="currentColor" d="M.21 5.352a.714.714 0 0 1 1.01 0L5 9.132l3.78-3.78a.714.714 0 0 1 1.01 1.01l-4.285 4.286a.714.714 0 0 1-1.01 0L.209 6.362a.714.714 0 0 1 0-1.01"></path></svg>
        </a>
      </div>
    </section>

    <!-- 生态 logo 动画条（chat/*.svg，灰度滚动） -->
    <div class="logo-strip" aria-label="生态模型品牌">
      <div class="logo-strip__track" id="logo-strip-track"></div>
    </div>

    <section class="models-section">
      <div class="models-section__head">
        <h2 class="models-section__title">由前沿模型驱动</h2>
        <p class="models-section__sub">我们实力强劲的模型专为真实场景而设计，提供先进的智能与多模态能力。一个端点接入全部模型。</p>
      </div>
      <div id="home-models-loading" class="models-row__loading">正在加载模型…</div>
      <div id="home-models-error" class="models-row__error" data-home-hidden></div>
      <div class="models-row" id="home-models-row"></div>
    </section>
  </main>

  <div data-page-footer></div>

  <!-- 主站共享组件（导航/页脚/菜单/翻译/主题切换），与主站一致 -->
  <script src="js/components.js" defer></script>
  <script src="js/i18n.js" defer></script>
  <script src="js/theme.js" defer></script>
  <script src="js/menu.js?v=2026-05-18-active-fix" defer></script>
  <!-- 站点配置（__SUPABASE_URL__ 等），供模型卡片拉取公开目录 -->
  <script src="chat/cancri_config.js?v=2026-05-13e"></script>
  <script src="chat/api/oai-home.js?v=20260621-oai" defer></script>
  <script>document.addEventListener('DOMContentLoaded', function () { if (window.injectComponents) injectComponents({}); });</script>
</body>
</html>
