    <style>
      /* 页面专有：模型线路分组 / 状态 pill / 重启按钮 / 危险 stat */
      .stat-card.danger {
        border-color: rgba(248, 113, 113, 0.4);
        background: rgba(248, 113, 113, 0.05);
      }
      .stat-card.danger .value {
        color: var(--err);
      }
      .stat-card .value {
        font-variant-numeric: tabular-nums;
      }
      .group {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 12px;
        margin-bottom: 14px;
        overflow: hidden;
      }
      .group.has-dead {
        border-color: rgba(248, 113, 113, 0.35);
      }
      .group-head {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 18px;
        background: var(--bg-elev);
        border-bottom: 1px solid var(--border);
      }
      .group-name {
        font-weight: 600;
        font-size: 14px;
        flex: 1;
      }
      .group-name .canonical {
        font-family: ui-monospace, "SF Mono", Consolas, monospace;
        font-size: 12px;
        color: var(--text-faint);
        font-weight: 400;
        margin-left: 8px;
      }
      .group-meta {
        font-size: 12px;
        color: var(--text-mute);
      }
      .group-meta .dead-count {
        color: var(--err);
        font-weight: 600;
        margin-left: 6px;
      }
      .lines {
        display: flex;
        flex-direction: column;
      }
      .line {
        display: grid;
        grid-template-columns: 1fr 110px 110px 200px 130px;
        gap: 14px;
        align-items: center;
        padding: 12px 18px;
        border-bottom: 1px solid var(--border);
        font-size: 13px;
      }
      .line:last-child {
        border-bottom: none;
      }
      .line.disabled {
        background: rgba(248, 113, 113, 0.04);
      }
      .line-id {
        font-family: ui-monospace, "SF Mono", Consolas, monospace;
        font-size: 12px;
        color: var(--text);
      }
      .line-id .label {
        margin-left: 8px;
        font-size: 10px;
        color: var(--text-faint);
        font-weight: 400;
      }
      .line.disabled .line-id {
        color: var(--err);
      }
      .pill {
        display: inline-block;
        padding: 3px 9px;
        font-size: 11px;
        font-weight: 600;
        border-radius: 999px;
        text-align: center;
      }
      .pill.live {
        background: rgba(74, 222, 128, 0.12);
        color: var(--ok);
      }
      .pill.dead {
        background: rgba(248, 113, 113, 0.15);
        color: var(--err);
      }
      .pill.hidden {
        background: rgba(154, 154, 154, 0.12);
        color: var(--text-mute);
      }
      .reason {
        font-size: 11.5px;
        color: var(--text-mute);
        font-family: ui-monospace, "SF Mono", Consolas, monospace;
      }
      .caps {
        margin-top: 4px;
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }
      .cap {
        display: inline-flex;
        align-items: center;
        font-size: 10px;
        font-weight: 600;
        padding: 1px 6px;
        border-radius: 4px;
        border: 1px solid var(--border);
        background: var(--bg-elev);
        color: var(--text-mute);
        line-height: 1.5;
        letter-spacing: 0.02em;
      }
      .cap.on {
        color: var(--ok);
        border-color: rgba(74, 222, 128, 0.3);
        background: rgba(74, 222, 128, 0.08);
      }
      .cap.off {
        color: var(--err);
        border-color: rgba(248, 113, 113, 0.3);
        background: rgba(248, 113, 113, 0.06);
      }
      .cap.tier {
        color: var(--text-mute);
        font-family: ui-monospace, "SF Mono", Consolas, monospace;
      }
      .cap.tokens {
        color: var(--text-faint);
        font-family: ui-monospace, "SF Mono", Consolas, monospace;
      }
      .reason .when {
        display: block;
        color: var(--text-faint);
        font-size: 10.5px;
        margin-top: 2px;
      }
      .actions {
        display: flex;
        gap: 6px;
        justify-content: flex-end;
      }
      .btn-restore,
      .btn-disable {
        padding: 5px 12px;
        font-size: 11.5px;
        font-weight: 600;
        border: 1px solid var(--border);
        background: var(--bg-elev);
        color: var(--text-mute);
        border-radius: 6px;
        cursor: pointer;
      }
      .btn-restore {
        border-color: rgba(74, 222, 128, 0.3);
        color: var(--ok);
      }
      .btn-restore:hover {
        background: rgba(74, 222, 128, 0.12);
      }
      .btn-disable:hover {
        color: var(--err);
        border-color: rgba(248, 113, 113, 0.3);
      }
      .btn-restore:disabled,
      .btn-disable:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      /* 本页 toast 在底部居中而非右下 */
      .toast {
        right: auto;
        left: 50%;
        transform: translateX(-50%) translateY(8px);
      }
      .toast.show {
        transform: translateX(-50%) translateY(0);
      }
      @media (max-width: 720px) {
        .line {
          grid-template-columns: 1fr 80px;
          grid-template-rows: auto auto auto;
        }
        .line .reason,
        .line .pill,
        .line .actions {
          grid-column: 1 / -1;
        }
        .line .actions {
          justify-content: flex-start;
        }
      }
    </style>
  </head>
  <body>

      <div id="loading" class="loading">检查权限中…</div>

      <div id="login-gate" class="gate" style="display: none">
        <h2>需要登录</h2>
        <p>请先登录账号，验证你的管理员身份。</p>
        <a class="btn-primary" href="../">前往登录</a>
      </div>

      <div id="deny-gate" class="gate deny" style="display: none">
        <h2>无权访问</h2>
        <p>
          这个页面仅站点管理员可见。如果你认为这是误判，请联系
          <code>站主</code>。
        </p>
        <a class="btn-primary" href="../">返回聊天</a>
      </div>

      <div id="main" style="display: none">
        <header>
          <h1>模型线路</h1>
          <p>
            上游密钥失效（401/402/quota）时会被自动写入禁用表，路由器在 60s
            内绕开。轮换密钥后点"恢复"重新启用。
          </p>
        </header>

        <div class="stats">
          <div class="stat-card">
            <div class="label">总线路数</div>
            <div class="value" id="stat-total">—</div>
          </div>
          <div class="stat-card">
            <div class="label">canonical 模型</div>
            <div class="value" id="stat-groups">—</div>
          </div>
          <div class="stat-card danger">
            <div class="label">已禁用线路</div>
            <div class="value" id="stat-disabled">—</div>
          </div>
          <div class="stat-card">
            <div class="label">健康线路</div>
            <div class="value" id="stat-healthy">—</div>
          </div>
        </div>

        <div class="toolbar">
          <div class="filter-group" id="statusFilter">
            <button class="filter-btn active" data-filter="all">
              全部<span class="count" id="cnt-all">0</span>
            </button>
            <button class="filter-btn" data-filter="dead">
              已禁用<span class="count" id="cnt-dead">0</span>
            </button>
            <button class="filter-btn" data-filter="live">
              健康<span class="count" id="cnt-live">0</span>
            </button>
          </div>
          <input
            id="search"
            class="search-box"
            type="search"
            placeholder="搜模型 ID / canonical / 品牌…"
            autocomplete="off"
          />
          <button class="reload-btn" id="reload-btn">↻ 刷新</button>
        </div>

        <div id="groups"></div>
      </div>

      <div id="toast" class="toast"></div>
    </div>
