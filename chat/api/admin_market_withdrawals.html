<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex,nofollow" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' data:; img-src 'self' data: blob: https:; connect-src 'self' https://chat.nexusvai.xyz; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self';" />
    <title>管理台 · 蟹市提现审批 · Cancri</title>
    <link rel="icon" type="image/png" href="../../Logo/Cancri.png" />
    <link rel="apple-touch-icon" href="../../Logo/Cancri.png" />
    <link rel="stylesheet" href="./api-platform.css?v=2026-06-07-search-compact" />
    <script src="./api-platform.js?v=20260607-account-fix"></script>
    <style>
      .status-pill { display:inline-block; padding:2px 10px; border-radius:12px; font-size:11px; font-weight:600; font-family:var(--font-mono); }
      .status-pill.pending { background:rgba(245,158,11,.18); color:#f59e0b; }
      .status-pill.approved { background:rgba(74,222,128,.18); color:#4ade80; }
      .status-pill.rejected { background:rgba(248,113,113,.18); color:#f87171; }
      .page-shell { max-width:1100px; margin:0 auto; padding:24px 16px 64px; }
      .tx-table { width:100%; border-collapse:collapse; font-size:13px; }
      .tx-table th, .tx-table td { padding:10px 12px; text-align:left; border-bottom:1px solid var(--border-mute); }
      .tx-table th { color:var(--text-mute); font-weight:600; background:var(--bg-mute, rgba(127,127,127,.06)); }
      .tx-table td.num { text-align:right; font-variant-numeric:tabular-nums; }
      .btn { padding:6px 14px; border-radius:8px; font-size:13px; cursor:pointer; border:1px solid var(--border-mute); background:var(--bg-surface, transparent); color:var(--text-default, currentColor); }
      .btn.primary { background:#0080f7; color:#fff; border-color:#0080f7; }
      .btn.danger { color:#f87171; border-color:rgba(248,113,113,.4); }
      .btn:disabled { opacity:.5; cursor:not-allowed; }
      .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); padding:10px 18px; border-radius:8px; background:#0080f7; color:#fff; font-size:14px; opacity:0; transition:opacity .25s; z-index:100; pointer-events:none; }
      .toast.show { opacity:1; }
      .toast.error { background:#f87171; }
    </style>
  </head>
  <body>
    <div class="page-shell">
      <nav id="admin-nav" data-active="market_wd"></nav>
      <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin:20px 0;">
        <div>
          <h1 style="font-size:22px;font-weight:600;margin:0;">蟹市提现审批</h1>
          <div style="font-size:13px;color:var(--text-mute);margin-top:4px;">卖家微信提现工单审批 · 通过后出账 / 驳回后解冻</div>
        </div>
        <div style="display:flex;gap:8px;">
          <a href="./admin_dashboard.html" class="btn">返回仪表盘</a>
          <button type="button" id="btn-refresh" class="btn">刷新</button>
        </div>
      </div>

      <div id="loading" style="padding:40px;text-align:center;color:var(--text-mute);">正在加载待审批工单…</div>
      <div id="login-hint" style="display:none;padding:40px;text-align:center;">
        <div style="margin-bottom:12px;">请先登录管理员账号。</div>
        <a href="../" class="btn primary">去登录</a>
      </div>
      <div id="forbidden" style="display:none;padding:40px;text-align:center;color:#f87171;">无管理员权限。</div>

      <div id="main" style="display:none;">
        <div style="font-size:13px;color:var(--text-mute);margin-bottom:10px;">待审批工单 <span id="count">—</span> 条</div>
        <div style="overflow-x:auto;border:1px solid var(--border-mute);border-radius:10px;">
          <table class="tx-table">
            <thead>
              <tr>
                <th>申请时间</th>
                <th>申请人邮箱</th>
                <th>金额</th>
                <th>微信/QQ</th>
                <th>状态</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
        <div id="empty" style="display:none;padding:40px;text-align:center;color:var(--text-mute);">暂无待审批工单。</div>
      </div>
    </div>
    <div id="toast" class="toast"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.46.1/dist/umd/supabase.js" crossorigin="anonymous"></script>
    <script src="../cancri_config.js?v=20260625-console"></script>
    <script src="./admin-nav.js?v=20260628-market"></script>
    <script src="./admin-market-withdrawals.js?v=20260628-market"></script>
  </body>
</html>
