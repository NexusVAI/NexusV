<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>概览 · NexusV 控制台</title>
  <meta name="description" content="NexusV 开放平台控制台 — API 用量概览。" />
  <link rel="icon" type="image/png" href="../../Logo/Cancri.png" />
  <script>
    (() => {
      let theme = "warm";
      try { theme = localStorage.getItem("theme") || "warm"; } catch (e) {}
      if (theme === "light") document.documentElement.classList.add("light-theme");
      if (theme === "warm") document.documentElement.classList.add("warm-theme");
      if (theme === "blue") document.documentElement.classList.add("blue-theme");
      if (theme === "dark") document.documentElement.classList.add("dark-theme");
    })();
  </script>
  <link rel="stylesheet" href="../../css/variables.css" />
  <link rel="stylesheet" href="console.css?v=20260625-console-ui" />
</head>
<body data-console-page="overview" data-login-url="../index.html">
  <div id="console-root" class="cs-console cs-console--boot" aria-busy="true">
    <div id="console-boot-skeleton" class="cs-console-skeleton" aria-hidden="true">
      <aside class="cs-console-skeleton__sidebar"></aside>
      <div class="cs-console-skeleton__main">
        <div class="cs-console-skeleton__top"></div>
        <div class="cs-console-skeleton__cards"><span></span><span></span><span></span><span></span></div>
        <span class="cs-console-skeleton__chart"></span>
        <span class="cs-console-skeleton__table"></span>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.46.1/dist/umd/supabase.js" crossorigin="anonymous"></script>
  <script src="../cancri_config.js?v=2026-05-13e"></script>
  <script src="platform-auth.js?v=20260625-auth"></script>
  <script src="console.js?v=20260625-console-ui"></script>
</body>
</html>
