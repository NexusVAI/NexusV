<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex,nofollow" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' data:; img-src 'self' data: blob: https:; connect-src 'self' https://chat.nexusvai.xyz; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self';" />
    <title>管理台· 申诉审核 · Cancri</title>
    <link rel="icon" type="image/svg+xml" href="../assets/nexusvai-N-logo-tight.svg" />
    <link rel="apple-touch-icon" href="../../Logo/Cancri1.jpg" />
    <link rel="stylesheet" href="./api-platform.css?v=2026-06-07-search-compact" />
    <link rel="stylesheet" href="./admin-console.css?v=20260706-sk" />
    <script src="./api-platform.js?v=20260607-account-fix"></script>
    <style>
      .appeal-card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 12px;
        margin-bottom: 14px;
        overflow: hidden;
      }
      .appeal-card.pending { border-left: 3px solid var(--accent); }
      .appeal-card.approved { border-left: 3px solid #22c55e; opacity: 0.85; }
      .appeal-card.rejected { border-left: 3px solid var(--err); opacity: 0.85; }
      .ac-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 14px 18px;
        background: var(--bg-elev);
        border-bottom: 1px solid var(--border);
      }
      .ac-id { display: flex; align-items: center; gap: 10px; }
      .ac-email { font-weight: 600; font-size: 14px; }
      .ac-time { font-size: 12px; color: var(--text-mute); font-variant-numeric: tabular-nums; }
      .pill {
        display: inline-block;
        padding: 2px 10px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 600;
        background: rgba(150, 150, 150, 0.18);
        color: var(--text-mute);
      }
      .pill.pending { background: rgba(212, 160, 77, 0.16); color: #d4a04d; }
      .pill.ok { background: rgba(34, 197, 94, 0.16); color: #22c55e; }
      .pill.err { background: rgba(232, 90, 90, 0.16); color: var(--err); }
      .ac-body { padding: 14px 18px; display: grid; gap: 12px; }
      .ac-meta {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 10px 18px;
        font-size: 12px;
      }
      .ac-meta .lab {
        display: block;
        color: var(--text-faint);
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 2px;
      }
      .ac-meta code {
        font-family: ui-monospace, "SF Mono", Consolas, monospace;
        font-size: 11px;
        word-break: break-all;
      }
      .ac-reason .lab,
      .ac-note .lab {
        display: block;
        color: var(--text-faint);
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 4px;
      }
      .ac-reason pre,
      .ac-note pre {
        background: var(--bg-elev);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px 12px;
        margin: 0;
        font-family: inherit;
        font-size: 13px;
        line-height: 1.5;
        white-space: pre-wrap;
        word-break: break-word;
        max-height: 200px;
        overflow-y: auto;
      }
      .ac-image a {
        display: inline-block;
        padding: 6px 12px;
        background: rgba(217, 119, 87, 0.1);
        color: var(--accent);
        border-radius: 6px;
        font-size: 12px;
        text-decoration: none;
      }
      .ac-image a:hover { background: rgba(217, 119, 87, 0.2); }
      .ac-actions {
        display: flex;
        gap: 8px;
        padding: 12px 18px;
        background: var(--bg-elev);
        border-top: 1px solid var(--border);
        align-items: center;
      }
      .ac-note-input {
        flex: 1;
        padding: 8px 12px;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 8px;
        font-size: 13px;
        color: var(--text);
      }
      .btn-approve, .btn-reject {
        padding: 8px 16px;
        border: none;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }
      .btn-approve { background: #22c55e; color: #fff; }
      .btn-approve:hover { background: #16a34a; }
      .btn-approve:disabled { opacity: 0.5; cursor: not-allowed; }
      .btn-reject { background: rgba(232, 90, 90, 0.18); color: var(--err); }
      .btn-reject:hover { background: rgba(232, 90, 90, 0.3); }
      .btn-reject:disabled { opacity: 0.5; cursor: not-allowed; }
      .empty {
        text-align: center;
        padding: 40px;
        color: var(--text-mute);
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 12px;
      }
      .empty.err { color: var(--err); }
      .toast {
        position: fixed;
        right: 24px;
        bottom: 24px;
        background: var(--bg-card);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px 16px;
        font-size: 13px;
        opacity: 0;
        transform: translateY(8px);
        transition: opacity .2s, transform .2s;
        pointer-events: none;
        z-index: 1000;
      }
      .toast.show { opacity: 1; transform: translateY(0); }
      .toast.ok { border-color: rgba(34, 197, 94, 0.4); }
      .toast.err { border-color: rgba(232, 90, 90, 0.4); }
    </style>
  </head>
  <body class="admin-console">
    <div class="container">
      <nav id="admin-nav" data-active="appeals"></nav>

      <div id="loading" class="loading"><div class="admin-skeleton"><div class="sk-block sk-title"></div><div class="sk-block sk-sub"></div><div class="sk-block sk-line"></div><div class="sk-block sk-line"></div><div class="sk-block sk-line"></div></div></div>

      <div id="login-gate" class="gate" style="display: none">
        <h2>需要登录</h2>
        <p>请先登录账号，验证你的管理员身份</p>
        <a class="btn-primary" href="../">前往登录</a>
      </div>

      <div id="deny-gate" class="gate deny" style="display: none">
        <h2>无权访问</h2>
        <p>这个页面仅站点管理员可见。如果你认为这是误判，请联系 <code>站主</code></p>
        <a class="btn-primary" href="../">返回聊天</a>
      </div>

      <div id="main" style="display: none">
        <header>
          <h1>用户申诉审核</h1>
          <p>
            用户被自动 / 手动封禁后通过 <code>./appeal.html</code>
            提交申诉。通过会自unban 并发邮件通知；驳回也会发邮件并随附备注         </p>
        </header>

        <div class="stats">
          <div class="stat-card">
            <div class="label">总数</div>
            <div class="value" id="stat-total"></div>
          </div>
          <div class="stat-card">
            <div class="label">待处理</div>
            <div class="value" id="stat-pending"></div>
          </div>
          <div class="stat-card">
            <div class="label">已通过</div>
            <div class="value" id="stat-approved"></div>
          </div>
          <div class="stat-card">
            <div class="label">已驳回</div>
            <div class="value" id="stat-rejected"></div>
          </div>
        </div>

        <div class="toolbar">
          <div class="filter-group" id="statusFilter">
            <button class="filter-btn active" data-filter="pending">待处理</button>
            <button class="filter-btn" data-filter="approved">已通过</button>
            <button class="filter-btn" data-filter="rejected">已驳回</button>
            <button class="filter-btn" data-filter="all">全部</button>
          </div>
          <button class="reload-btn" id="reload-btn">刷新</button>
        </div>

        <div id="list"></div>
      </div>

      <div id="toast" class="toast"></div>
    </div>

    <script src="../cancri_config.js"></script>
    <script src="../../js/fingerprint.js?v=2026-05-16-fp-init" defer></script>
    <script
      src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.46.1/dist/umd/supabase.js"
      crossorigin="anonymous"
    ></script>
    <script src="./admin-nav.js?v=20260804-tickets"></script>
    <script src="./admin-appeals-app.js?v=2026-05-24"></script>
  </body>
</html>
