<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cancri-Code Model Menu Preview</title>
    <meta name="robots" content="noindex,nofollow">
    <link rel="icon" type="image/svg+xml" href="assets/nexusvai-N-logo-tight.svg" />
<style>
  :root {
    --bg: #0d0d0d;
    --card: #18181b;
    --line: rgba(255,255,255,0.08);
    --text: #fff;
    --text-soft: rgba(255,255,255,0.65);
    --text-dim: rgba(255,255,255,0.45);
    --accent: #19c59f;
    --accent-soft: rgba(25,197,159,0.16);
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0;
    padding: 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
    min-height: 100vh;
  }
  .preview-title {
    font-size: 18px;
    font-weight: 600;
    color: var(--text-soft);
  }
  .chat-model-anchor {
    position: relative;
    display: inline-block;
  }
  .chat-model {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 8px;
    color: #fff;
    font-size: 13px;
    font-weight: 500;
    padding: 5px 9px;
    gap: 6px;
    display: inline-flex;
    align-items: center;
    cursor: pointer;
  }
  .chat-model-caret { width: 9px; height: 9px; }
  .model-popover {
    position: absolute;
    bottom: calc(100% + 6px);
    left: 0;
    width: 320px;
    max-height: 360px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    box-shadow: 0 12px 32px rgba(0,0,0,0.35), 0 2px 6px rgba(0,0,0,0.2);
    z-index: 80;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .model-popover-head {
    padding: 10px 14px 8px;
    border-bottom: 1px solid var(--line);
    flex-shrink: 0;
  }
  .model-popover-title {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text);
  }
  .model-popover-list {
    flex: 1;
    overflow-y: auto;
    padding: 4px 0;
    min-height: 60px;
  }
  .model-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    cursor: pointer;
    border-left: 2px solid transparent;
    transition: background 0.12s, border-color 0.12s;
  }
  .model-item:hover {
    background: rgba(255,255,255,0.05);
    border-left-color: var(--accent);
  }
  .model-item.active {
    background: var(--accent-soft);
    border-left-color: var(--accent);
  }
  .model-item.is-disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }
  .model-item-icon svg, .model-item-icon img {
    width: 16px; height: 16px; display: block; border-radius: 3px; object-fit: cover;
  }
  .model-item-body {
    flex: 1; min-width: 0;
    display: flex; flex-direction: column; gap: 2px;
  }
  .model-item-row1 {
    display: flex; align-items: center; gap: 6px;
  }
  .model-item-name {
    font-size: 12.5px; font-weight: 600; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .model-item-badge {
    flex-shrink: 0;
    font-size: 9.5px; font-weight: 700; letter-spacing: 0.4px;
    padding: 1px 6px; border-radius: 4px;
    background: var(--accent-soft); color: var(--accent);
    text-transform: none;
  }
  .model-item-badge.free { background: hsla(145, 60%, 45%, 0.16); color: hsl(145, 55%, 45%); }
  .model-item-badge.new { background: var(--accent); color: #fff; border-radius: 999px; }
  .model-item-brand {
    font-size: 10.5px; color: var(--text-dim);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .model-item-check {
    flex-shrink: 0; width: 14px; height: 14px; color: var(--accent); opacity: 0;
  }
  .model-item.active .model-item-check { opacity: 1; }
  .model-item-lock {
    flex-shrink: 0; display: inline-flex; color: var(--text-dim);
  }
  .model-cost-pop {
    position: fixed;
    z-index: 4000;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    box-shadow: 0 12px 32px rgba(0,0,0,0.35);
    padding: 10px 12px;
    min-width: 180px;
    color: var(--text);
    font-size: 12px;
  }
  .model-cost-pop.hidden { display: none; }
  .cost-pop-title { font-weight: 600; margin-bottom: 6px; }
  .cost-pop-row { display: flex; justify-content: space-between; color: var(--text-soft); margin: 2px 0; }
  .cost-pop-row span:last-child { color: var(--text); }
</style>
</head>
<body>
<link rel="stylesheet" type="text/css" href="assets/p2m-loader.css" />
<div id="p2m-loader" aria-hidden="true">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="-80 -80 1184 1184" width="180" height="180" role="img" aria-label="N logo" overflow="visible" id="p2m-logo">
    <g id="mark" fill="#111111" fill-rule="evenodd">
      <path id="part-main" d="M760 252 L760 645 L372 330 L371 613 L262 722 L262 222 L422 222 L535 324 L695 460 L696 325 Z"/>
      <path id="part-tr" d="M562 318 L562 222 L760 222 L672 313 L672 413 Z"/>
      <path id="part-diag" d="M395 378 L758 671 L760 735 L641 735 L397 551 L394 548 Z"/>
      <path id="part-bl" d="M395 578 L472 638 L472 735 L287 736 L395 627 Z"/>
    </g>
  </svg>
</div>
<script src="assets/p2m-loader.js" defer></script>

  <div class="preview-title">Cancri-Code 风格模型菜单预览</div>
  <div class="chat-model-anchor">
    <button class="chat-model" id="chat-model" type="button">
      <span class="chat-model-name">GPT 5.5</span>
      <svg class="chat-model-caret" viewBox="0 0 9 9" fill="none" aria-hidden="true">
        <path d="M1.5 3 L4.5 6 L7.5 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <div class="model-popover" id="model-popover">
      <div class="model-popover-head">
        <span class="model-popover-title">选择模型</span>
      </div>
      <div class="model-popover-list" id="model-popover-list"></div>
    </div>
  </div>
  <div class="model-cost-pop hidden" id="model-cost-pop">
    <div class="cost-pop-title" id="cost-pop-title"></div>
    <div class="cost-pop-body" id="cost-pop-body"></div>
  </div>

<script>
const MOCK_MODELS = [
  { id: "gpt-5.5", displayName: "GPT 5.5", brand: "OpenAI", inputPricePerM: 1.5, outputPricePerM: 4.5, active: true },
  { id: "claude-opus-4-8", displayName: "Claude Opus 4.8", brand: "Anthropic", inputPricePerM: 6, outputPricePerM: 27 },
  { id: "claude-opus-4-6", displayName: "Claude Opus 4.6", brand: "Anthropic", inputPricePerM: 3, outputPricePerM: 14 },
  { id: "kimi-k2.7", displayName: "Kimi K2.7", brand: "Moonshot", inputPricePerM: 0.4, outputPricePerM: 2, isNew: true },
  { id: "deepseek-v4", displayName: "DeepSeek V4", brand: "DeepSeek", inputPricePerM: 0.5, outputPricePerM: 2 },
  { id: "glm-5.1", displayName: "GLM 5.1", brand: "Zhipu", inputPricePerM: 0.5, outputPricePerM: 2 },
  { id: "baichuan-m2-welfare", displayName: "Baichuan M2", brand: "Baichuan", inputPricePerM: 0, outputPricePerM: 0, isFree: true },
  { id: "future-ppo", displayName: "Future Pro (Pro Max)", brand: "Future", inputPricePerM: 300, outputPricePerM: 300, proMaxOnly: true, isDisabled: true },
];

function brandIconSvg(brand) {
  const initials = (brand || "?").slice(0, 2).toUpperCase();
  return `<svg width="16" height="16" viewBox="0 0 16 16"><rect width="16" height="16" rx="3" fill="rgba(255,255,255,0.1)"/><text x="8" y="12" text-anchor="middle" font-size="9" fill="#fff">${initials}</text></svg>`;
}

function formatPriceYuanPerM(p) {
  if (p === 0) return "0";
  if (Number.isInteger(p)) return String(p);
  return p.toFixed(2).replace(/0+$/, "").replace(/\.$/, "");
}

function renderModelRow(model) {
  const item = document.createElement("div");
  item.className = `model-item${model.active ? " active" : ""}${model.isDisabled ? " is-disabled" : ""}`;
  item.dataset.model = model.id;
  item.innerHTML = `
    <span class="model-item-icon">${brandIconSvg(model.brand)}</span>
    <span class="model-item-body">
      <span class="model-item-row1">
        <span class="model-item-name">${model.displayName}</span>
        ${model.isNew ? `<span class="model-item-badge new">New</span>` : ""}
        ${model.isFree ? `<span class="model-item-badge free">Free</span>` : ""}
      </span>
      <span class="model-item-brand">${model.brand}</span>
    </span>
    ${model.isDisabled ? `<span class="model-item-lock"><svg viewBox="0 0 14 14" width="11" height="11" fill="none"><rect x="3" y="6" width="8" height="6" rx="1.4" stroke="currentColor" stroke-width="1.2"/><path d="M4.6 6V4.6a2.4 2.4 0 0 1 4.8 0V6" stroke="currentColor" stroke-width="1.2"/></svg></span>` : ""}
    <svg class="model-item-check" viewBox="0 0 14 14" aria-hidden="true">
      <path d="M2.5 7.5 L6 11 L11.5 4" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  `;
  return item;
}

function renderList() {
  const list = document.getElementById("model-popover-list");
  list.innerHTML = "";
  MOCK_MODELS.forEach(m => list.appendChild(renderModelRow(m)));
}

function showCostPop(model, anchor) {
  const pop = document.getElementById("model-cost-pop");
  const title = document.getElementById("cost-pop-title");
  const body = document.getElementById("cost-pop-body");
  title.textContent = model.displayName;
  const rows = [];
  if (model.inputPricePerM != null) rows.push(`<div class="cost-pop-row"><span>输入</span><span>¥${formatPriceYuanPerM(model.inputPricePerM)} / M</span></div>`);
  if (model.outputPricePerM != null) rows.push(`<div class="cost-pop-row"><span>输出</span><span>¥${formatPriceYuanPerM(model.outputPricePerM)} / M</span></div>`);
  if (model.perCallPrice != null) rows.push(`<div class="cost-pop-row"><span>每次</span><span>¥${model.perCallPrice}</span></div>`);
  body.innerHTML = rows.join("");
  const rect = anchor.getBoundingClientRect();
  pop.style.left = rect.right + 8 + "px";
  pop.style.top = rect.top + "px";
  pop.classList.remove("hidden");
}

function hideCostPop() {
  document.getElementById("model-cost-pop").classList.add("hidden");
}

const trigger = document.getElementById("chat-model");
const popover = document.getElementById("model-popover");
const list = document.getElementById("model-popover-list");
let timer = null;

trigger.addEventListener("click", () => {
  popover.hidden = !popover.hidden;
});

list.addEventListener("click", (e) => {
  const item = e.target.closest(".model-item");
  if (!item || item.classList.contains("is-disabled")) return;
  document.querySelectorAll(".model-item").forEach(el => el.classList.remove("active"));
  item.classList.add("active");
  trigger.querySelector(".chat-model-name").textContent = item.querySelector(".model-item-name").textContent;
  popover.hidden = true;
});

list.addEventListener("mouseenter", (e) => {
  const item = e.target.closest(".model-item");
  if (!item) return;
  clearTimeout(timer);
  const m = MOCK_MODELS.find(x => x.id === item.dataset.model);
  if (m) showCostPop(m, item);
}, true);

list.addEventListener("mouseleave", () => {
  clearTimeout(timer);
  timer = setTimeout(hideCostPop, 200);
}, true);

document.addEventListener("click", (e) => {
  if (!popover.hidden && !popover.contains(e.target) && !trigger.contains(e.target)) popover.hidden = true;
});

renderList();
</script>
</body>
</html>
