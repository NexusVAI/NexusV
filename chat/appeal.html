<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https:; connect-src 'self' https://diusqgphvybnzazgopor.supabase.co; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self';" />
    <title>账户申诉 · Cancri</title>
    <link rel="icon" type="image/png" href="../Logo/Cancri.png" />
    <link rel="apple-touch-icon" href="../Logo/Cancri.png" />
    <link rel="stylesheet" href="./api/api-platform.css?v=2026-05-24-appeal" />
    <style>
      .appeal-shell {
        max-width: 640px;
        margin: 60px auto;
        padding: 0 16px;
      }
      .appeal-card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 32px 28px;
      }
      .appeal-card h1 {
        margin: 0 0 8px;
        font-size: 22px;
        font-weight: 600;
      }
      .appeal-card .desc {
        font-size: 13px;
        color: var(--text-mute);
        line-height: 1.6;
        margin-bottom: 24px;
      }
      .reason-banner {
        background: rgba(232, 90, 90, 0.08);
        border: 1px solid rgba(232, 90, 90, 0.3);
        border-radius: 10px;
        padding: 14px 16px;
        margin-bottom: 20px;
        font-size: 13px;
        color: var(--err);
        line-height: 1.5;
      }
      .field { margin-bottom: 16px; }
      .field label {
        display: block;
        font-size: 12px;
        font-weight: 600;
        color: var(--text-faint);
        margin-bottom: 6px;
        text-transform: uppercase;
        letter-spacing: 0.4px;
      }
      .field input[type="email"],
      .field input[type="text"],
      .field textarea {
        width: 100%;
        padding: 10px 14px;
        background: var(--bg-elev);
        border: 1px solid var(--border);
        border-radius: 8px;
        font-size: 14px;
        color: var(--text);
        font-family: inherit;
        box-sizing: border-box;
      }
      .field textarea {
        resize: vertical;
        min-height: 140px;
        line-height: 1.6;
      }
      .field input:focus,
      .field textarea:focus {
        outline: none;
        border-color: var(--accent);
      }
      .field .hint {
        font-size: 11px;
        color: var(--text-faint);
        margin-top: 4px;
      }
      .field .counter { float: right; }
      .actions {
        display: flex;
        gap: 10px;
        margin-top: 20px;
      }
      .actions .btn-primary,
      .actions .btn-ghost {
        padding: 10px 20px;
        border: none;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .actions .btn-primary {
        background: var(--accent);
        color: #fff;
        flex: 1;
      }
      .actions .btn-primary:hover { background: var(--accent-hover, #c66744); }
      .actions .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
      .actions .btn-ghost {
        background: transparent;
        color: var(--text-mute);
        border: 1px solid var(--border);
      }
      .success-banner {
        background: rgba(34, 197, 94, 0.08);
        border: 1px solid rgba(34, 197, 94, 0.4);
        border-radius: 10px;
        padding: 18px;
        font-size: 14px;
        color: #22c55e;
        line-height: 1.6;
      }
      .error-banner {
        background: rgba(232, 90, 90, 0.08);
        border: 1px solid rgba(232, 90, 90, 0.4);
        border-radius: 10px;
        padding: 14px 16px;
        font-size: 13px;
        color: var(--err);
        margin-bottom: 16px;
      }
      .gate {
        text-align: center;
        padding: 40px 28px;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 16px;
      }
      .gate h2 { margin: 0 0 8px; font-size: 18px; }
      .gate p { color: var(--text-mute); font-size: 13px; line-height: 1.6; margin: 0 0 16px; }
    </style>
  </head>
  <body>
    <div class="appeal-shell">
      <div id="loading" class="loading" style="text-align:center;padding:40px;">检查登录状态…</div>

      <div id="login-gate" class="gate" style="display:none;">
        <h2>请先登录</h2>
        <p>申诉前需要先登录原账户，让我们能够定位到你被封禁的记录。</p>
        <a class="btn-primary" href="./">返回首页登录</a>
      </div>

      <div id="success" class="appeal-card" style="display:none;">
        <h1>申诉已提交</h1>
        <div class="success-banner" id="success-msg">
          您的申诉已成功提交，管理员会在 1-3 个工作日内审核。审核结果将通过邮件通知您。
        </div>
        <div class="actions" style="margin-top:24px;">
          <a class="btn-primary" href="./">返回首页</a>
        </div>
      </div>

      <div id="form-card" class="appeal-card" style="display:none;">
        <h1>账户解封申诉</h1>
        <p class="desc">
          如果您认为账户被自动封禁有误，请填写以下内容。我们会人工审核每一条申诉。
          24 小时内最多可提交 3 次申诉。
        </p>

        <div id="reason-banner" class="reason-banner" style="display:none;"></div>
        <div id="error-banner" class="error-banner" style="display:none;"></div>

        <form id="appeal-form">
          <div class="field">
            <label for="email">联系邮箱</label>
            <input type="email" id="email" required autocomplete="email" />
            <div class="hint">默认填入你登录的邮箱；可改为其他可联系到你的邮箱。审核结果通过此邮箱通知。</div>
          </div>

          <div class="field">
            <label for="reason">申诉理由
              <span class="counter"><span id="reason-count">0</span> / 2000</span>
            </label>
            <textarea id="reason" required minlength="10" maxlength="2000"
              placeholder="请描述您当时的使用场景、为什么会触发频率检测，以及您是真人而非脚本的证据..."></textarea>
            <div class="hint">至少 10 字。请如实说明，虚假申诉会延长封禁时间。</div>
          </div>

          <div class="field">
            <label for="image_url">证据图片链接（可选）</label>
            <input type="text" id="image_url" placeholder="https://imgur.com/... 或其他公开图床链接" />
            <div class="hint">如有截图等证据，请上传到 imgur / 阿里云 OSS / 七牛云 等图床后粘贴链接。</div>
          </div>

          <div class="actions">
            <a class="btn-ghost" href="./">取消</a>
            <button type="submit" class="btn-primary" id="submit-btn">提交申诉</button>
          </div>
        </form>
      </div>
    </div>

    <script src="./cancri_config.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.46.1/dist/umd/supabase.js"
      crossorigin="anonymous"
    ></script>
    <script src="./appeal-app.js?v=2026-05-24"></script>
  </body>
</html>
