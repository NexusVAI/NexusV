  <script>
    (function () {
      try {
        var raw = localStorage.getItem("cancri_ui_prefs");
        if (!raw) return;
        var prefs = JSON.parse(raw);
        var mode = String(prefs.themeMode || prefs.theme || "system");
        var theme;
        if (mode === "light" || mode === "dark" || mode === "black") theme = mode;
        else if (mode === "system") {
          theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        } else theme = "light";
        document.documentElement.setAttribute("data-theme", theme);
      } catch (_e) {}
    })();
  </script>

  <!--
    Cancri Code 桌面端登录页（Sprint 2！
    URL: ?cb=<http://127.0.0.1:PORT/cb>&state=<hex>
    已登归←POST session 到本最cb；未登录 ←邮箱 OTP（无 Turnstile / 无安全验证）
    UI 对齐 claude.html auth-overlay
  -->
  <div class="auth-overlay visible" id="authOverlay">
<iframe id="authLoginFrame" src="./claude-login-island.html?v=20260927-legal" title="登录"></iframe>
<div class="auth-invalid-panel" id="authInvalidPanel">
      <div class="auth-invalid-card">
        <h1>无法打开登录</h1>
        <p id="authInvalidMsg">无效的回调参数。请回到 Cancri Code 桌面端重新点击登录</p>
      </div>
    </div>
</div>

  <script defer src="./cancri_logo_theme.js?v=2026-06-25-openai-text"></script>
  <script defer src="./js/auth-login-chrome.js?v=20261001-discord"></script>
  <script>
    (function () {
      "use strict";

      const params = new URLSearchParams(location.search);
      const cb = params.get("cb") || "";
      const state = params.get("state") || "";
      // 2026-10-10：新版桌面端额外带 exp（本机监听截止时间）与 form=1（接受整页表单回传）。
      // 旧版桌面端不带这两个参数，下面的诊断/兜底会自动退化成原行为。
      const loginExpiresAt = Number(params.get("exp")) || 0;
      const formCallbackSupported = params.get("form") === "1";

      function isValidCb(url) {
        try {
          const u = new URL(url);
          return (
            u.protocol === "http:" &&
            (u.hostname === "127.0.0.1" || u.hostname === "localhost") &&
            u.pathname === "/cb"
          );
        } catch {
          return false;
        }
      }

      const valid = Boolean(cb && state && isValidCb(cb));
      const overlay = document.getElementById("authOverlay");
      const invalidMsg = document.getElementById("authInvalidMsg");

      // 2026-08-16 修复：auth-platform-login.css 的
      // `html.auth-platform-page #authOverlay:not(.visible)` 默认把整个遮罩
      // 收起（height:0 + visibility:hidden + z-index:-1），要靠 JS 加上
      // .visible 才会显示——这个动作原来只有 chat/src/main.js 的
      // showAuthOverlay() 会做（该文件不加载 main.js，走自己这段独立脚本）。
      // 之前这里从没加过这个 class，导致整页无论 valid/invalid 都是一片空白
      // 背景色，看不到任何内容（真实用户反馈：桌面端登录页"一片黄"）。
      if (overlay) overlay.classList.add("visible");
      if (!valid) {
        overlay.classList.add("is-invalid");
        if (invalidMsg) invalidMsg.textContent = "无效的回调参数。请回到 Cancri Code 桌面端重新点击登录　";
        return;
      }

      function authDoc() {
        var f = document.getElementById("authLoginFrame");
        try {
          if (f && f.contentDocument && f.contentDocument.getElementById("authEmailInput")) {
            return f.contentDocument;
          }
        } catch (_e) {}
        return document;
      }
      function authEl(id) {
        return authDoc().getElementById(id);
      }

      var authBooted = false;
      var authFlow = null;
      function bootAuthForms() {
      if (authBooted || !window.CancriAuthFlow?.create) return;
      const emailInput = authEl("authEmailInput");
      const sendBtn = authEl("authSendOtpBtn");
      if (!emailInput || !sendBtn) return;
      const statusLine = authEl("authStatusLine");

      function setStatus(text, kind) {
        if (!statusLine) return;
        statusLine.textContent = text || "";
        statusLine.className = "auth-status-line" + (kind ? " is-" + kind : "");
      }

      function showDone(message) {
        const continueStep = authEl("authStepContinue");
        const emailStep = authEl("authStepEmail");
        const otpStep = authEl("authStepOtp");
        if (emailStep) emailStep.hidden = true;
        if (otpStep) otpStep.hidden = true;
        if (continueStep) continueStep.hidden = false;
        const status = authEl("authContinueStatus");
        if (status) status.textContent = message || "";
        const btn = authEl("authContinueBtn");
        if (btn) btn.hidden = true;
        const sw = authEl("authSwitchAccountBtn");
        if (sw) sw.hidden = true;
      }

      function failInvalid(message) {
        overlay.classList.add("is-invalid");
        if (invalidMsg) invalidMsg.textContent = message;
      }

      const SUPABASE_URL = window.__SUPABASE_URL__ || "";
      const SUPABASE_ANON_KEY = window.__SUPABASE_ANON_KEY__ || "";
      if (!SUPABASE_URL || !SUPABASE_ANON_KEY) {
        failInvalid("Supabase 配置未加载，请刷新页面重试　");
        return;
      }
      if (!window.supabase || !window.supabase.createClient) {
        failInvalid("Supabase Auth SDK 加载失败，请检查网络后刷新　");
        return;
      }

      const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
        auth: {
          persistSession: true,
          autoRefreshToken: false,
          detectSessionInUrl: false,
        },
      });

      const stepContinue = authEl("authStepContinue");
      const stepEmail = authEl("authStepEmail");
      const continueEmailEl = authEl("authContinueEmail");
      const continueBtn = authEl("authContinueBtn");
      const switchAccountBtn = authEl("authSwitchAccountBtn");
      const continueStatus = authEl("authContinueStatus");
      const continueError = authEl("authContinueError");
      let cachedSession = null;

      async function sendSessionToDesktop(session) {
        const email = session.user ? session.user.email || "" : "";
        const otpStep = authEl("authStepOtp");
        const fromOtp = Boolean(otpStep && !otpStep.hidden);
        const body = {
          access_token: session.access_token,
          refresh_token: session.refresh_token,
          expires_in: session.expires_in || 3600,
          user_email: email,
          user_id: session.user ? session.user.id || "" : "",
          state: state,
        };
        showDone(
          (email ? "已确认 " + email + "，" : "") + "正在返回桌面端…",
        );
        let response;
        try {
          if (loginExpiresAt && Date.now() > loginExpiresAt) {
            throw new Error("登录等待已超时（超过 5 分钟）。请回到 Cancri Code 重新点击登录，再在新打开的页面里完成登录。");
          }
          if (formCallbackSupported) {
            // 新版桌面端：直接整页表单回传。新版 Chrome/Edge 会拦截（或弹权限框挂起）网页对
            // 127.0.0.1 的 fetch —— 实测 Edge 153 未授权时 fetch 直接 Failed to fetch、本机一个
            // 请求都收不到；整页跳转不受这条限制。结果页（成功/失效/超时）由桌面端直接返回。
            submitSessionByForm(body);
            return;
          }
          try {
            response = await fetch(cb, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(body),
            });
          } catch (networkError) {
            // 旧版桌面端（不支持表单回传）：请求根本没送到桌面端，最常见是浏览器拦截了
            // 网页访问本机应用（Chrome/Edge「本地网络访问」权限、安全软件），或桌面端已关闭。
            throw new Error(
              "浏览器没能把登录结果交给本机的 Cancri Code。通常是浏览器拦截了网页访问本机应用：" +
                "请点击地址栏左侧的网站设置，允许「本地网络访问」（或「访问此设备上的其他应用」）后重试；" +
                "也可以换一个浏览器、暂时关闭拦截本机连接的安全软件，或把 Cancri Code 升级到最新版（新版不受此限制）。",
            );
          }
          if (!response.ok) {
            const text = await response.text().catch(function () {
              return "";
            });
            throw new Error(describeCallbackRejection(response.status, text));
          }
        } catch (error) {
          if (fromOtp) {
            if (stepContinue) stepContinue.hidden = true;
            authFlow.showOtpStep(email);
          } else {
            showContinueStep(session);
          }
          throw error;
        }
        setTimeout(function () {
          window.close();
        }, 800);
      }

      // 桌面端回调拒绝时只回英文短语；这里翻成用户能照做的话（否则全被兜底成同一句）。
      function describeCallbackRejection(status, text) {
        const raw = String(text || "").trim();
        if (raw === "state mismatch") {
          return "这个登录页已失效（桌面端已经重新发起过登录）。请回到 Cancri Code，使用最新打开的登录页。";
        }
        if (status === 403) {
          return "登录页来源校验失败。请回到 Cancri Code 桌面端重新点击登录，并使用自动打开的页面。";
        }
        if (raw === "missing tokens") {
          return "登录信息不完整，请点击「切换账号」重新登录一次。";
        }
        if (status >= 500) {
          return "桌面端保存登录信息失败，请回到 Cancri Code 查看错误提示后重试。";
        }
        return "桌面端拒绝了这次登录回传（HTTP " + status + (raw ? "：" + raw : "") + "）。请回到 Cancri Code 重新点击登录。";
      }

      function submitSessionByForm(body) {
        // 表单 POST 的 Origin 头受文档 referrer 策略约束：本页的 no-referrer 会让浏览器发
        // `Origin: null`（桌面端据此拒绝）。跳转前把策略放宽到 origin —— 只暴露站点源，
        // 不含带 state 的路径与查询串。
        const meta = document.querySelector('meta[name="referrer"]');
        if (meta) meta.setAttribute("content", "origin");
        const form = document.createElement("form");
        form.method = "POST";
        form.action = cb;
        form.enctype = "application/x-www-form-urlencoded";
        form.style.display = "none";
        Object.keys(body).forEach(function (key) {
          const input = document.createElement("input");
          input.type = "hidden";
          input.name = key;
          input.value = String(body[key]);
          form.appendChild(input);
        });
        document.body.appendChild(form);
        form.submit();
      }

      authFlow = window.CancriAuthFlow.create({
        getDocument: authDoc,
        client: supabase,
        onSession: sendSessionToDesktop,
      });
      if (!authFlow.bind()) return;
      authBooted = true;

      function showContinueStep(session) {
        cachedSession = session;
        const email =
          (session.user && session.user.email) || "(未知邮箱)";
        if (continueEmailEl) continueEmailEl.textContent = email;
        if (stepContinue) stepContinue.hidden = false;
        if (stepEmail) stepEmail.hidden = true;
        const otpStep = authEl("authStepOtp");
        if (otpStep) otpStep.hidden = true;
        if (emailInput) emailInput.disabled = true;
        if (sendBtn) sendBtn.disabled = true;
        if (continueStatus) {
          continueStatus.textContent = "";
          continueStatus.className = "auth-status-line";
        }
        if (continueError) continueError.textContent = "";
      }

      function showEmailForm() {
        cachedSession = null;
        if (stepContinue) stepContinue.hidden = true;
        if (emailInput) emailInput.disabled = false;
        if (sendBtn) sendBtn.disabled = false;
        authFlow.reset();
        setStatus("");
      }

      emailInput.disabled = true;
      sendBtn.disabled = true;
      setStatus("正在检查登录状态…");

      (async function bootstrap() {
        let existingSession = null;
        try {
          const { data } = await supabase.auth.getSession();
          existingSession =
            data && data.session && data.session.access_token
              ? data.session
              : null;
        } catch (err) {
          console.warn("[desktop-login] getSession failed:", err);
        }

        // 禁止静默回传：浏览器缓存的常是上一个账号（如 357…），用户在站点上已换成别的号时会被坑
        if (existingSession) {
          setStatus("");
          showContinueStep(existingSession);
          return;
        }

        showEmailForm();
      })();

      continueBtn?.addEventListener("click", function () {
        if (!cachedSession) return;
        continueBtn.disabled = true;
        if (continueError) continueError.textContent = "";
        if (continueStatus) {
          continueStatus.textContent = "正在回传桌面端…";
          continueStatus.className = "auth-status-line is-ok";
        }
        void sendSessionToDesktop(cachedSession).catch(function (err) {
          console.warn("[desktop-login] callback failed:", err);
          continueBtn.disabled = false;
          if (continueStatus) {
            continueStatus.textContent = "";
            continueStatus.className = "auth-status-line";
          }
          if (continueError) {
            continueError.textContent = window.CancriAuthFlow.localizeError(
              err,
              "桌面端登录回调失败，请回到 Cancri Code 重新发起登录",
            );
          }
        });
      });

      switchAccountBtn?.addEventListener("click", function () {
        switchAccountBtn.disabled = true;
        void supabase.auth
          .signOut({ scope: "local" })
          .catch(function (err) {
            console.warn("[desktop-login] signOut failed:", err);
          })
          .finally(function () {
            switchAccountBtn.disabled = false;
            showEmailForm();
            emailInput.value = "";
            emailInput.focus();
          });
      });

      }

      var frame = document.getElementById("authLoginFrame");
      if (frame) frame.addEventListener("load", bootAuthForms);
      window.addEventListener("cancri:auth-flow-ready", bootAuthForms, { once: true });
      bootAuthForms();
    })();
  </script>
</body>
