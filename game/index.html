  <body>
    <canvas id="game-canvas"></canvas>

    <!-- file:// protocol guard -->
    <div id="file-guard" class="screen hidden">
      <div class="panel">
        <h1>需要通过本地服务器运行</h1>
        <p>浏览器禁止网页直接从 <code>file://</code> 读取模型/贴图等资源。</p>

      </div>
    </div>

    <!-- loading -->
    <div id="loading" class="screen">
      <div class="brand">
        <div class="brand-mark">ASK</div>
        <div class="brand-sub">FRONTLINE <span>// 前线</span></div>
      </div>
      <div class="load-box">
        <div class="load-bar"><div id="load-fill" class="load-fill"></div></div>

        <div id="load-tip" class="load-tip"></div>
      </div>
      <div id="load-warning" class="load-warning hidden"></div>
    </div>

    <!-- landscape-only guard for phones -->
    <div id="rotate-hint">
      <div class="rot-icon"></div>
      <b>请横屏游玩</b>
      <p>将设备旋转为横向以获得完整的操作布局</p>
