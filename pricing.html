<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, follow" />
<link rel="canonical" href="https://www.nexusvai.xyz/chat/pricing.html" />
<title>正在跳转到定价页 · NexusVAI</title>
<!--
  2026-08-16 审计 SP-2 修复。

  本文件原先是 chat/pricing.html 的一份**陈旧副本**，而且是从 chat/ 复制到站点根时没有改
  相对路径的那种坏副本 —— 它引用的每一个资源都指不到东西：
    ./api/_anti-debug.js · ./api/api-platform.js · ./api/pricing-app.js  → 根下没有 api/ 目录
    ./cancri_config.js                                                   → 根下不存在
    ../js/telemetry.js · ../js/fingerprint.js                            → 指到了站点根之上
  CSP 的 connect-src 还钉在早已退役的 Supabase 域（diusqgphvybnzazgopor.supabase.co）。
  于是按 /pricing.html 直达（terms.html 里就有这条站内链接）只会拿到一个空壳页面。

  现役定价页是 chat/pricing.html（110KB，与网关同源鉴权）。

  为什么不直接删文件：/pricing.html 是站内链接与外部收录都在用的稳定入口，删掉即 404。
  改成 301 语义的客户端跳转（<meta refresh> + location.replace 双保险），前向且零破坏。
  noindex+follow 与 canonical 让搜索引擎把权重归到真身页面，不产生重复内容。
-->
<meta http-equiv="refresh" content="0; url=./chat/pricing.html" />
<style>
  html, body {
    margin: 0;
    min-height: 100%;
    background: #0b0d12;
    color: #e6e8ee;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
    line-height: 1.7;
  }
  a { color: #7aa2ff; }
</style>
</head>
<body>
<div class="wrap">
  <p>
    正在跳转到定价页…<br />
    若没有自动跳转，请点击 <a href="./chat/pricing.html">查看 NexusVAI 定价</a>。
  </p>
</div>
<script>
  (function () {
    window.location.replace("./chat/pricing.html" + (window.location.search || "") + (window.location.hash || ""));
  })();
</script>
</body>
</html>
