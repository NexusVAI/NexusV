name: Deploy Supabase Edge Functions

# 2026-05-16：后端代码（chat-gateway.ts + migrations）从公开仓库移除后，
# 这个 workflow 不再有源文件可部署。push 触发器已禁用，避免每次 main
# push 都红灯。仅保留 workflow_dispatch（手动触发）供未来恢复时使用。
#
# 当前后端代码源在站长本机 c:\Users\HP\Desktop\GitHub\css\后端\，部署
# 通过 Supabase Management API 直接走（参见 css/后端/supabase/docs/
# supabase-management-api-guide.md，文件本身也是 gitignored）。
#
# 如果以后决定把后端代码恢复到仓库：
#   1. 把 css/后端/supabase/functions/** 和 migrations/** 重新推上来
#   2. 把下面的 push: 段落取消注释
#   3. 把 secrets / deploy 步骤改回原来的逻辑（git history 里有）
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: diusqgphvybnzazgopor
    defaults:
      run:
        working-directory: css/后端

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy secrets
        env:
          ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
          CHAT_AUTH_SECRET: ${{ secrets.CHAT_AUTH_SECRET }}
          BANNED_USER_IDS: ${{ secrets.BANNED_USER_IDS }}
          BLOCKED_USER_IDS: ${{ secrets.BLOCKED_USER_IDS }}
          MODELSCOPE_API_KEY: ${{ secrets.MODELSCOPE_API_KEY }}
          MODELSCOPE_API_KEY_1: ${{ secrets.MODELSCOPE_API_KEY_1 }}
          MODELSCOPE_API_KEY_2: ${{ secrets.MODELSCOPE_API_KEY_2 }}
          OPENAI_COMPATIBLE_BASE_URL: ${{ secrets.OPENAI_COMPATIBLE_BASE_URL }}
          OPENAI_COMPATIBLE_API_KEY: ${{ secrets.OPENAI_COMPATIBLE_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          DASHSCOPE_API_KEY_1: ${{ secrets.DASHSCOPE_API_KEY_1 }}
          DASHSCOPE_API_KEY_2: ${{ secrets.DASHSCOPE_API_KEY_2 }}
          DASHSCOPE_API_KEY_NEW: ${{ secrets.DASHSCOPE_API_KEY_NEW }}
          # 统一的 DashScope 媒体生成密钥（HappyHorse 1.0 i2v/t2v/r2v +
          # Wan 2.7 t2v + Wan 2.7 image-pro）。2026-05-10: HappyHorse 和
          # Wan 2.7 已合并到同一个阿里云百炼账号，所有视频/图像生成线路都用
          # 这一个 key。空值时回退到 DASHSCOPE_API_KEY 池。
          DASHSCOPE_VIDEO_API_KEY: ${{ secrets.DASHSCOPE_VIDEO_API_KEY }}
          # 旧版 Wan 专用密钥（向后兼容）。新部署留空即可，proxy 会优先用
          # DASHSCOPE_VIDEO_API_KEY；如果两个都设了，DASHSCOPE_VIDEO_API_KEY 胜出。
          DASHSCOPE_WAN_API_KEY: ${{ secrets.DASHSCOPE_WAN_API_KEY }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          MOONSHOT_API_KEY_LINE3: ${{ secrets.MOONSHOT_API_KEY_LINE3 }}
          OPENROUTER_API_KEY_1: ${{ secrets.OPENROUTER_API_KEY_1 }}
          OPENROUTER_API_KEY_2: ${{ secrets.OPENROUTER_API_KEY_2 }}
          OPENROUTER_API_KEY_3: ${{ secrets.OPENROUTER_API_KEY_3 }}
          SPARK_API_KEY: ${{ secrets.SPARK_API_KEY }}
          MIMO_API_KEY: ${{ secrets.MIMO_API_KEY }}
          NEWAPI_BASE_URL: ${{ secrets.NEWAPI_BASE_URL }}
          NEWAPI_API_KEY: ${{ secrets.NEWAPI_API_KEY }}
          NEWAPI_API_KEY_2: ${{ secrets.NEWAPI_API_KEY_2 }}
          XEM8K5_BASE_URL: ${{ secrets.XEM8K5_BASE_URL }}
          XEM8K5_API_KEY: ${{ secrets.XEM8K5_API_KEY }}
          XEM8K5_API_KEY_2: ${{ secrets.XEM8K5_API_KEY_2 }}
          FUTUREPPO_BASE_URL: ${{ secrets.FUTUREPPO_BASE_URL }}
          FUTUREPPO_API_KEY: ${{ secrets.FUTUREPPO_API_KEY }}
          FUTUREPPO_GEMMA_API_KEY: ${{ secrets.FUTUREPPO_GEMMA_API_KEY }}
          SENSENOVA_BASE_URL: ${{ secrets.SENSENOVA_BASE_URL }}
          SENSENOVA_API_KEY: ${{ secrets.SENSENOVA_API_KEY }}
          ALTCHA_HMAC_KEY: ${{ secrets.ALTCHA_HMAC_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
        run: |
          set -euo pipefail

          require_secret() {
            local name="$1"
            local value="${!name:-}"
            if [ -z "$value" ]; then
              echo "::error::GitHub Secret $name is missing"
              exit 1
            fi
          }

          set_secret_if_present() {
            local name="$1"
            local value="${!name:-}"
            if [ -n "$value" ]; then
              supabase secrets set --project-ref "$PROJECT_ID" "$name=$value"
            fi
          }

          require_secret ALLOWED_ORIGINS

          # NOTE: SUPABASE_URL, SUPABASE_ANON_KEY and SUPABASE_SERVICE_ROLE_KEY
          # are auto-injected by the Supabase platform. The CLI rejects secrets
          # with the SUPABASE_ prefix, and including them here causes the entire
          # command to fail.
          supabase secrets set --project-ref "$PROJECT_ID" \
            "ALLOWED_ORIGINS=$ALLOWED_ORIGINS"

          set_secret_if_present CHAT_AUTH_SECRET
          set_secret_if_present BANNED_USER_IDS
          set_secret_if_present BLOCKED_USER_IDS

          set_secret_if_present MODELSCOPE_API_KEY
          set_secret_if_present MODELSCOPE_API_KEY_1
          set_secret_if_present MODELSCOPE_API_KEY_2
          set_secret_if_present OPENAI_COMPATIBLE_BASE_URL
          set_secret_if_present OPENAI_COMPATIBLE_API_KEY
          set_secret_if_present DASHSCOPE_API_KEY
          set_secret_if_present DASHSCOPE_API_KEY_1
          set_secret_if_present DASHSCOPE_API_KEY_2
          set_secret_if_present DASHSCOPE_API_KEY_NEW
          set_secret_if_present DASHSCOPE_VIDEO_API_KEY
          set_secret_if_present DASHSCOPE_WAN_API_KEY
          set_secret_if_present SILICONFLOW_API_KEY
          set_secret_if_present MOONSHOT_API_KEY
          set_secret_if_present MOONSHOT_API_KEY_LINE3
          set_secret_if_present OPENROUTER_API_KEY_1
          set_secret_if_present OPENROUTER_API_KEY_2
          set_secret_if_present OPENROUTER_API_KEY_3
          set_secret_if_present SPARK_API_KEY
          set_secret_if_present MIMO_API_KEY
          set_secret_if_present NEWAPI_BASE_URL
          set_secret_if_present NEWAPI_API_KEY
          set_secret_if_present NEWAPI_API_KEY_2
          set_secret_if_present XEM8K5_BASE_URL
          set_secret_if_present XEM8K5_API_KEY
          set_secret_if_present XEM8K5_API_KEY_2
          set_secret_if_present FUTUREPPO_BASE_URL
          set_secret_if_present FUTUREPPO_API_KEY
          set_secret_if_present FUTUREPPO_GEMMA_API_KEY
          set_secret_if_present SENSENOVA_BASE_URL
          set_secret_if_present SENSENOVA_API_KEY
          set_secret_if_present ALTCHA_HMAC_KEY
          set_secret_if_present LOG_HASH_SECRET
          set_secret_if_present TURNSTILE_SECRET_KEY
          set_secret_if_present TURNSTILE_SITE_KEY

      - name: Push database migrations
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DB_PASSWORD:-}" ]; then
            echo "::error::GitHub Secret SUPABASE_DB_PASSWORD is missing"
            exit 1
          fi
          supabase db push --project-ref "$PROJECT_ID"

      - name: Guard deploy flags
        run: |
          python - <<'PY'
          from pathlib import Path
          workflow = Path("../../.github/workflows/deploy-supabase-functions.yml")
          needle = "--" + "no-verify-jwt"
          for line_number, line in enumerate(workflow.read_text(encoding="utf-8").splitlines(), 1):
              stripped = line.strip()
              if stripped.startswith("supabase functions deploy") and needle in stripped:
                  print(f"::error file=.github/workflows/deploy-supabase-functions.yml,line={line_number}::Do not deploy edge functions with {needle}")
                  raise SystemExit(1)
          PY

      - name: Deploy edge functions
        run: |
          supabase functions deploy modelscope-proxy --project-ref $PROJECT_ID
          supabase functions deploy chat-history --project-ref $PROJECT_ID
          supabase functions deploy web-search --project-ref $PROJECT_ID
          supabase functions deploy chat-gateway --project-ref $PROJECT_ID
          # Public API gateway for cancri_sk_* keys. config.toml sets verify_jwt = false
          # so external developer requests are not rejected by Supabase's JWT validator.
          supabase functions deploy api-gateway --project-ref $PROJECT_ID
