<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API 申请 - Cancri</title>
  <link rel="icon" type="image/png" href="../Logo/Cancri.png">
  <link rel="apple-touch-icon" href="../Logo/Cancri.png">
  <link rel="stylesheet" href="./api/api-platform.css">
  <style>
    /* 页面专有：申请页是单卡居中布局 */
    body { display: flex; align-items: center; justify-content: center; padding-top: 76px; padding-bottom: 32px; }
    .nav-bar { position: fixed; top: 0; left: 0; right: 0; padding: 10px 20px; margin: 0; border-bottom: 1px solid var(--border); }
    .nav-bar.nav-bar--sticky { background: rgba(10, 10, 10, 0.85); }
    .apply-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 32px; max-width: 480px; width: 90%; }
    .apply-card .full-btn { width: 100%; padding: 12px; margin-top: 8px; font-size: 14px; }
    .apply-card .secondary-btn { width: 100%; padding: 10px; margin-top: 16px; font-size: 13px; }
    .login-hint { text-align: center; margin-top: 16px; }
  </style>
</head>
<body>
  <nav class="nav-bar nav-bar--sticky">
    <a href="./api_apply.html" class="active">申请 API</a>
    <a href="./api_keys.html">我的 Keys</a>
    <a href="./api_models.html">模型广场</a>
    <a href="./api_docs.html">文档</a>
    <span class="spacer"></span>
    <a href="./cancri_chat_ui_v_3.html" style="color: var(--text-faint)">← 返回聊天</a>
  </nav>
  <div class="apply-card">
    <h1 class="page-title">API 申请</h1>
    <p class="subtitle">申请 Cancri API Key，用于调用大模型接口</p>

    <div id="loading" class="loading">加载中...</div>

    <div id="login-section" style="display:none">
      <p style="margin-bottom:12px">请先登录后再申请 API Key。</p>
      <button class="btn-primary full-btn" onclick="location.href='./cancri_chat_ui_v_3.html'">前往登录</button>
    </div>

    <div id="apply-section" style="display:none">
      <div id="existing-status" style="display:none"></div>
      <div id="apply-form">
        <div class="form-group">
          <label>邮箱</label>
          <input type="email" id="email" readonly>
        </div>
        <div class="form-group">
          <label>用途说明</label>
          <textarea id="purpose" placeholder="简要描述你的使用场景，例如：个人项目开发、学术研究、企业集成等"></textarea>
        </div>
        <button id="submit-btn" class="btn-primary full-btn" onclick="submitApplication()">提交申请</button>
        <div class="msg" id="msg"></div>
      </div>
    </div>

    <div id="key-section" style="display:none">
      <p style="margin-bottom:12px; color: var(--ok)">你的申请已通过！可以生成 API Key 了。</p>
      <button class="btn-primary full-btn" onclick="location.href='./api_keys.html'">管理 API Keys</button>
    </div>

    <button class="btn-secondary secondary-btn" onclick="location.href='./cancri_chat_ui_v_3.html'">返回聊天</button>
  </div>

  <script src="./cancri_config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // IMPORTANT: storageKey must match cancri_chat.js so session is shared with main chat page
    const sb = window.supabase.createClient(window.__SUPABASE_URL__, window.__SUPABASE_ANON_KEY__, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false, storageKey: 'cancri_supabase_auth' } });
    const GW = window.__SUPABASE_URL__ + '/functions/v1/chat-gateway';
    let currentUser = null;

    async function init() {
      const { data: { user } } = await sb.auth.getUser();
      document.getElementById('loading').style.display = 'none';
      if (!user || user.is_anonymous) {
        document.getElementById('login-section').style.display = 'block';
        return;
      }
      currentUser = user;
      document.getElementById('email').value = user.email || '';
      document.getElementById('apply-section').style.display = 'block';
      await checkExisting();
    }

    async function checkExisting() {
      try {
        const { data: { session } } = await sb.auth.getSession();
        const resp = await fetch(GW, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + session.access_token },
          body: JSON.stringify({ endpoint: 'api_my_keys' })
        });
        const data = await resp.json();
        if (data.applications && data.applications.length > 0) {
          const app = data.applications[0];
          const box = document.getElementById('existing-status');
          box.style.display = 'block';
          const badgeClass = 'status-' + app.status;
          const statusText = { pending: '审核中', approved: '已通过', rejected: '已拒绝' }[app.status] || app.status;
          box.innerHTML = '<div class="status-box"><div>申请状态：<span class="status-badge ' + badgeClass + '">' + statusText + '</span></div><div style="color: var(--text-faint); font-size:12px; margin-top:6px">申请时间：' + new Date(app.created_at).toLocaleString('zh-CN') + '</div></div>';
          document.getElementById('apply-form').style.display = 'none';
          if (app.status === 'approved') {
            document.getElementById('key-section').style.display = 'block';
          }
        }
      } catch (e) {
        console.error(e);
      }
    }

    async function submitApplication() {
      const purpose = document.getElementById('purpose').value.trim();
      if (!purpose) { showMsg('请填写用途说明', true); return; }
      const btn = document.getElementById('submit-btn');
      btn.disabled = true; btn.textContent = '提交中...';
      try {
        const { data: { session } } = await sb.auth.getSession();
        const resp = await fetch(GW, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + session.access_token },
          body: JSON.stringify({ endpoint: 'api_apply', purpose })
        });
        const data = await resp.json();
        if (resp.ok) {
          showMsg('申请已提交，请等待审核。', false);
          setTimeout(() => checkExisting(), 1000);
        } else {
          showMsg(data.error || '提交失败', true);
        }
      } catch (e) {
        showMsg('网络错误', true);
      }
      btn.disabled = false; btn.textContent = '提交申请';
    }

    function showMsg(text, isErr) {
      const el = document.getElementById('msg');
      el.textContent = text;
      el.className = 'msg ' + (isErr ? 'err' : 'ok');
      el.style.display = 'block';
    }

    init();
  </script>
</body>
</html>
