<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <title>管理员 · 模型线路 · Cancri</title>
    <script src="./_anti-debug.js"></script>
    <link rel="stylesheet" href="./api-platform.css" />
    <style>
      /* 页面专有：模型线路分组 / 状态 pill / 重启按钮 / 危险 stat */
      .stat-card.danger {
        border-color: rgba(248, 113, 113, 0.4);
        background: rgba(248, 113, 113, 0.05);
      }
      .stat-card.danger .value {
        color: var(--err);
      }
      .stat-card .value {
        font-variant-numeric: tabular-nums;
      }
      .group {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 12px;
        margin-bottom: 14px;
        overflow: hidden;
      }
      .group.has-dead {
        border-color: rgba(248, 113, 113, 0.35);
      }
      .group-head {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 18px;
        background: var(--bg-elev);
        border-bottom: 1px solid var(--border);
      }
      .group-name {
        font-weight: 600;
        font-size: 14px;
        flex: 1;
      }
      .group-name .canonical {
        font-family: ui-monospace, "SF Mono", Consolas, monospace;
        font-size: 12px;
        color: var(--text-faint);
        font-weight: 400;
        margin-left: 8px;
      }
      .group-meta {
        font-size: 12px;
        color: var(--text-mute);
      }
      .group-meta .dead-count {
        color: var(--err);
        font-weight: 600;
        margin-left: 6px;
      }
      .lines {
        display: flex;
        flex-direction: column;
      }
      .line {
        display: grid;
        grid-template-columns: 1fr 110px 110px 200px 130px;
        gap: 14px;
        align-items: center;
        padding: 12px 18px;
        border-bottom: 1px solid var(--border);
        font-size: 13px;
      }
      .line:last-child {
        border-bottom: none;
      }
      .line.disabled {
        background: rgba(248, 113, 113, 0.04);
      }
      .line-id {
        font-family: ui-monospace, "SF Mono", Consolas, monospace;
        font-size: 12px;
        color: var(--text);
      }
      .line-id .label {
        margin-left: 8px;
        font-size: 10px;
        color: var(--text-faint);
        font-weight: 400;
      }
      .line.disabled .line-id {
        color: var(--err);
      }
      .pill {
        display: inline-block;
        padding: 3px 9px;
        font-size: 11px;
        font-weight: 600;
        border-radius: 999px;
        text-align: center;
      }
      .pill.live {
        background: rgba(74, 222, 128, 0.12);
        color: var(--ok);
      }
      .pill.dead {
        background: rgba(248, 113, 113, 0.15);
        color: var(--err);
      }
      .pill.hidden {
        background: rgba(154, 154, 154, 0.12);
        color: var(--text-mute);
      }
      .reason {
        font-size: 11.5px;
        color: var(--text-mute);
        font-family: ui-monospace, "SF Mono", Consolas, monospace;
      }
      .reason .when {
        display: block;
        color: var(--text-faint);
        font-size: 10.5px;
        margin-top: 2px;
      }
      .actions {
        display: flex;
        gap: 6px;
        justify-content: flex-end;
      }
      .btn-restore,
      .btn-disable {
        padding: 5px 12px;
        font-size: 11.5px;
        font-weight: 600;
        border: 1px solid var(--border);
        background: var(--bg-elev);
        color: var(--text-mute);
        border-radius: 6px;
        cursor: pointer;
      }
      .btn-restore {
        border-color: rgba(74, 222, 128, 0.3);
        color: var(--ok);
      }
      .btn-restore:hover {
        background: rgba(74, 222, 128, 0.12);
      }
      .btn-disable:hover {
        color: var(--err);
        border-color: rgba(248, 113, 113, 0.3);
      }
      .btn-restore:disabled,
      .btn-disable:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      /* 本页 toast 在底部居中而非右下 */
      .toast {
        right: auto;
        left: 50%;
        transform: translateX(-50%) translateY(8px);
      }
      .toast.show {
        transform: translateX(-50%) translateY(0);
      }
      @media (max-width: 720px) {
        .line {
          grid-template-columns: 1fr 80px;
          grid-template-rows: auto auto auto;
        }
        .line .reason,
        .line .pill,
        .line .actions {
          grid-column: 1 / -1;
        }
        .line .actions {
          justify-content: flex-start;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <nav class="nav">
        <a href="../api_apply.html">申请 API</a>
        <a href="../api_keys.html">我的 Keys</a>
        <a href="../api_models.html">模型广场</a>
        <a href="../api_docs.html">文档</a>
        <a href="./admin.html">审核</a>
        <a href="./admin_usage.html">调用日志</a>
        <a href="./admin_lines.html" class="active">线路</a>
        <span class="badge-admin">ADMIN</span>
        <span class="spacer"></span>
        <a href="../cancri_chat_ui_v_3.html" style="color: var(--text-faint)"
          >← 返回聊天</a
        >
      </nav>

      <div id="loading" class="loading">检查权限中…</div>

      <div id="login-gate" class="gate" style="display: none">
        <h2>需要登录</h2>
        <p>请先登录账号，验证你的管理员身份。</p>
        <a class="btn-primary" href="../cancri_chat_ui_v_3.html">前往登录</a>
      </div>

      <div id="deny-gate" class="gate deny" style="display: none">
        <h2>无权访问</h2>
        <p>
          这个页面仅站点管理员可见。如果你认为这是误判，请联系
          <code>站主</code>。
        </p>
        <a class="btn-primary" href="../cancri_chat_ui_v_3.html">返回聊天</a>
      </div>

      <div id="main" style="display: none">
        <header>
          <h1>模型线路</h1>
          <p>
            上游密钥失效（401/402/quota）时会被自动写入禁用表，路由器在 60s
            内绕开。轮换密钥后点"恢复"重新启用。
          </p>
        </header>

        <div class="stats">
          <div class="stat-card">
            <div class="label">总线路数</div>
            <div class="value" id="stat-total">—</div>
          </div>
          <div class="stat-card">
            <div class="label">canonical 模型</div>
            <div class="value" id="stat-groups">—</div>
          </div>
          <div class="stat-card danger">
            <div class="label">已禁用线路</div>
            <div class="value" id="stat-disabled">—</div>
          </div>
          <div class="stat-card">
            <div class="label">健康线路</div>
            <div class="value" id="stat-healthy">—</div>
          </div>
        </div>

        <div class="toolbar">
          <div class="filter-group" id="statusFilter">
            <button class="filter-btn active" data-filter="all">
              全部<span class="count" id="cnt-all">0</span>
            </button>
            <button class="filter-btn" data-filter="dead">
              已禁用<span class="count" id="cnt-dead">0</span>
            </button>
            <button class="filter-btn" data-filter="live">
              健康<span class="count" id="cnt-live">0</span>
            </button>
          </div>
          <input
            id="search"
            class="search-box"
            type="search"
            placeholder="搜模型 ID / canonical / 品牌…"
            autocomplete="off"
          />
          <button class="reload-btn" id="reload-btn">↻ 刷新</button>
        </div>

        <div id="groups"></div>
      </div>

      <div id="toast" class="toast"></div>
    </div>

    <script src="../cancri_config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      const sb = window.supabase.createClient(
        window.__SUPABASE_URL__,
        window.__SUPABASE_ANON_KEY__,
        {
          auth: {
            persistSession: true,
            autoRefreshToken: true,
            detectSessionInUrl: false,
            storageKey: "cancri_supabase_auth",
          },
        },
      );
      const GW = window.__SUPABASE_URL__ + "/functions/v1/chat-gateway";
      let GROUPS = [];
      let TOTALS = { total_lines: 0, total_disabled: 0 };
      let activeFilter = "all";
      let activeSearch = "";

      const $ = (id) => document.getElementById(id);
      const esc = (s) => {
        const d = document.createElement("div");
        d.textContent = String(s == null ? "" : s);
        return d.innerHTML;
      };

      function showToast(msg, kind) {
        const t = $("toast");
        t.textContent = msg;
        t.className = "toast " + (kind || "");
        requestAnimationFrame(() => t.classList.add("show"));
        setTimeout(() => t.classList.remove("show"), 2400);
      }

      async function getSession() {
        const {
          data: { session },
        } = await sb.auth.getSession();
        return session;
      }

      async function callGW(payload, session) {
        const resp = await fetch(GW, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: "Bearer " + session.access_token,
          },
          body: JSON.stringify(payload),
        });
        const data = await resp.json().catch(() => ({}));
        return { ok: resp.ok, status: resp.status, data };
      }

      async function init() {
        const session = await getSession();
        $("loading").style.display = "none";
        if (!session || !session.user || session.user.is_anonymous) {
          $("login-gate").style.display = "block";
          return;
        }
        // Pre-flight admin_check so non-admins see the deny gate immediately
        // instead of an empty page.
        const check = await callGW({ endpoint: "admin_check" }, session);
        if (!check.ok || !check.data?.is_admin) {
          $("deny-gate").style.display = "block";
          return;
        }
        await loadLines();
      }

      async function loadLines() {
        const session = await getSession();
        const r = await callGW({ endpoint: "admin_list_lines" }, session);
        if (r.status === 403) {
          $("deny-gate").style.display = "block";
          return;
        }
        if (!r.ok) {
          showToast("加载失败：HTTP " + r.status, "err");
          return;
        }
        GROUPS = Array.isArray(r.data?.groups) ? r.data.groups : [];
        TOTALS = {
          total_lines: r.data?.total_lines || 0,
          total_disabled: r.data?.total_disabled || 0,
        };
        $("main").style.display = "block";
        updateStats();
        render();
      }

      function updateStats() {
        const total = TOTALS.total_lines;
        const dead = TOTALS.total_disabled;
        const healthy = total - dead;
        $("stat-total").textContent = total;
        $("stat-groups").textContent = GROUPS.length;
        $("stat-disabled").textContent = dead;
        $("stat-healthy").textContent = healthy;

        let liveLines = 0;
        let deadLines = 0;
        GROUPS.forEach((g) => {
          g.lines.forEach((l) => {
            if (l.disabled) deadLines++;
            else liveLines++;
          });
        });
        $("cnt-all").textContent = liveLines + deadLines;
        $("cnt-dead").textContent = deadLines;
        $("cnt-live").textContent = liveLines;
      }

      function shortTime(iso) {
        if (!iso) return "";
        const d = new Date(iso);
        if (isNaN(d.getTime())) return iso;
        const now = Date.now();
        const diff = now - d.getTime();
        if (diff < 60_000) return Math.round(diff / 1000) + "s 前";
        if (diff < 3600_000) return Math.round(diff / 60000) + "m 前";
        if (diff < 86400_000) return Math.round(diff / 3600000) + "h 前";
        return d.toLocaleString("zh-CN", { hour12: false });
      }

      function passFilter(line) {
        if (activeFilter === "dead" && !line.disabled) return false;
        if (activeFilter === "live" && line.disabled) return false;
        if (activeSearch) {
          const q = activeSearch.toLowerCase();
          const hay = (
            line.id +
            " " +
            (line.canonicalId || "") +
            " " +
            (line.brand || "") +
            " " +
            (line.displayName || "")
          ).toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      }

      function render() {
        const root = $("groups");
        const visibleGroups = GROUPS.map((g) => ({
          ...g,
          lines: g.lines.filter(passFilter),
        })).filter((g) => g.lines.length > 0);

        if (visibleGroups.length === 0) {
          root.innerHTML = '<div class="empty">没有匹配的线路。</div>';
          return;
        }

        root.innerHTML = visibleGroups
          .map((g) => {
            const dead = g.lines.filter((l) => l.disabled).length;
            const headClass = dead > 0 ? "group has-dead" : "group";
            const lines = g.lines
              .map((l) => {
                const disabled = !!l.disabled;
                const pill = disabled
                  ? '<span class="pill dead">已禁用</span>'
                  : !l.visible
                    ? '<span class="pill hidden">隐藏</span>'
                    : '<span class="pill live">健康</span>';
                const reason = disabled
                  ? `<div class="reason">${esc(l.reason || "—")}${l.status_code ? " · " + l.status_code : ""}<span class="when">${esc(shortTime(l.disabled_at))} · ${esc(l.disabled_by || "")}</span></div>`
                  : '<div class="reason"></div>';
                const action = disabled
                  ? `<button class="btn-restore" data-act="enable" data-id="${esc(l.id)}">恢复</button>`
                  : `<button class="btn-disable" data-act="disable" data-id="${esc(l.id)}">禁用</button>`;
                return `<div class="line${disabled ? " disabled" : ""}">
                  <div class="line-id">${esc(l.id)}<span class="label">${esc(l.lineLabel || "")}</span></div>
                  ${pill}
                  <div class="reason-cell">${reason}</div>
                  <div class="meta">${esc(l.brand || "")}</div>
                  <div class="actions">${action}</div>
                </div>`;
              })
              .join("");
            return `<div class="${headClass}">
              <div class="group-head">
                <div class="group-name">${esc(g.displayName)}<span class="canonical">${esc(g.canonicalId)}</span></div>
                <div class="group-meta">
                  ${g.total} 条线路${dead > 0 ? `<span class="dead-count">· ${dead} 已禁用</span>` : ""}
                </div>
              </div>
              <div class="lines">${lines}</div>
            </div>`;
          })
          .join("");

        root.querySelectorAll("button[data-act]").forEach((btn) => {
          btn.addEventListener("click", () => {
            const act = btn.getAttribute("data-act");
            const id = btn.getAttribute("data-id");
            if (act === "enable") doEnable(id, btn);
            else if (act === "disable") doDisable(id, btn);
          });
        });
      }

      async function doEnable(modelId, btn) {
        const session = await getSession();
        btn.disabled = true;
        btn.textContent = "恢复中…";
        const r = await callGW(
          { endpoint: "admin_enable_line", model_id: modelId },
          session,
        );
        if (!r.ok) {
          showToast("恢复失败：" + (r.data?.message || r.status), "err");
          btn.disabled = false;
          btn.textContent = "恢复";
          return;
        }
        showToast("已恢复 " + modelId, "ok");
        await loadLines();
      }

      async function doDisable(modelId, btn) {
        if (
          !confirm(
            "手动禁用线路 " +
              modelId +
              "？\n它会立刻从路由中移除，需要在本页点恢复才能再次启用。",
          )
        )
          return;
        const session = await getSession();
        btn.disabled = true;
        btn.textContent = "禁用中…";
        const r = await callGW(
          {
            endpoint: "admin_disable_line",
            model_id: modelId,
            reason: "manual",
          },
          session,
        );
        if (!r.ok) {
          showToast("禁用失败：" + (r.data?.message || r.status), "err");
          btn.disabled = false;
          btn.textContent = "禁用";
          return;
        }
        showToast("已禁用 " + modelId, "ok");
        await loadLines();
      }

      // Filter buttons
      document.querySelectorAll("#statusFilter .filter-btn").forEach((b) => {
        b.addEventListener("click", () => {
          document
            .querySelectorAll("#statusFilter .filter-btn")
            .forEach((x) => x.classList.remove("active"));
          b.classList.add("active");
          activeFilter = b.getAttribute("data-filter");
          render();
        });
      });

      // Search box (debounced)
      let searchTimer = null;
      $("search").addEventListener("input", (e) => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => {
          activeSearch = e.target.value.trim();
          render();
        }, 150);
      });

      $("reload-btn").addEventListener("click", () => loadLines());

      init();
    </script>
  </body>
</html>
