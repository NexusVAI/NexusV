<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <title>管理员 · API 审核 · Cancri</title>
    <script src="./_anti-debug.js"></script>
    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      :root {
        --bg: #0a0a0a;
        --bg-elev: #131313;
        --bg-card: #1a1a1a;
        --border: #2a2a2a;
        --border-strong: #383838;
        --text: #e8e8e8;
        --text-mute: #9a9a9a;
        --text-faint: #666;
        --accent: #60a5fa;
        --ok: #4ade80;
        --warn: #fbbf24;
        --err: #f87171;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue",
          "PingFang SC", "Microsoft YaHei", sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        line-height: 1.5;
      }
      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px 20px 48px;
      }
      .nav {
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
        margin-bottom: 20px;
        padding-bottom: 14px;
        border-bottom: 1px solid var(--border);
        align-items: center;
      }
      .nav a {
        padding: 8px 14px;
        color: var(--text-mute);
        text-decoration: none;
        font-size: 13px;
        border-radius: 8px;
        transition: all 0.15s;
      }
      .nav a:hover {
        background: var(--bg-elev);
        color: var(--text);
      }
      .nav a.active {
        color: var(--text);
        background: var(--bg-card);
      }
      .nav .spacer {
        flex: 1;
      }
      .nav .badge-admin {
        font-size: 10px;
        font-weight: 700;
        background: rgba(248, 113, 113, 0.15);
        color: var(--err);
        padding: 3px 8px;
        border-radius: 4px;
        letter-spacing: 0.05em;
      }
      header h1 {
        font-size: 24px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      header p {
        color: var(--text-mute);
        font-size: 13px;
        margin-top: 4px;
        margin-bottom: 20px;
      }
      .gate {
        max-width: 520px;
        margin: 80px auto 0;
        padding: 32px;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 12px;
        text-align: center;
      }
      .gate h2 {
        font-size: 18px;
        margin-bottom: 8px;
      }
      .gate p {
        color: var(--text-mute);
        font-size: 14px;
        margin-bottom: 16px;
      }
      .gate.deny {
        border-color: rgba(248, 113, 113, 0.3);
      }
      .gate.deny h2 {
        color: var(--err);
      }
      .btn-primary {
        display: inline-block;
        padding: 9px 18px;
        background: var(--accent);
        color: #fff;
        border: none;
        border-radius: 8px;
        font-size: 13px;
        cursor: pointer;
        text-decoration: none;
      }
      .btn-primary:hover {
        background: #2563eb;
      }
      .toolbar {
        display: flex;
        gap: 8px;
        margin-bottom: 16px;
        flex-wrap: wrap;
        align-items: center;
      }
      .filter-group {
        display: flex;
        gap: 4px;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 3px;
      }
      .filter-btn {
        padding: 6px 14px;
        background: transparent;
        border: none;
        color: var(--text-mute);
        font-size: 12px;
        cursor: pointer;
        border-radius: 6px;
        transition: all 0.15s;
      }
      .filter-btn:hover {
        color: var(--text);
      }
      .filter-btn.active {
        background: var(--bg-elev);
        color: var(--text);
      }
      .filter-btn .count {
        margin-left: 6px;
        font-weight: 600;
      }
      .reload-btn {
        padding: 7px 14px;
        background: var(--bg-card);
        border: 1px solid var(--border);
        color: var(--text-mute);
        font-size: 12px;
        border-radius: 8px;
        cursor: pointer;
      }
      .reload-btn:hover {
        color: var(--text);
        border-color: var(--border-strong);
      }
      table {
        width: 100%;
        border-collapse: collapse;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 12px;
        overflow: hidden;
        font-size: 13px;
      }
      th,
      td {
        text-align: left;
        padding: 12px 14px;
        border-bottom: 1px solid var(--border);
        vertical-align: top;
      }
      th {
        background: var(--bg-elev);
        color: var(--text);
        font-weight: 600;
        font-size: 12px;
        position: sticky;
        top: 0;
      }
      tr:last-child td {
        border-bottom: none;
      }
      td.email {
        font-family: ui-monospace, "SF Mono", Consolas, monospace;
        font-size: 12.5px;
        color: var(--accent);
        white-space: nowrap;
      }
      td.purpose {
        max-width: 380px;
        white-space: pre-wrap;
        word-break: break-word;
        color: var(--text-mute);
      }
      td.created {
        color: var(--text-faint);
        font-size: 12px;
        white-space: nowrap;
      }
      td.user-id {
        font-family: ui-monospace, "SF Mono", Consolas, monospace;
        font-size: 11px;
        color: var(--text-faint);
      }
      td.ip {
        font-family: ui-monospace, "SF Mono", Consolas, monospace;
        font-size: 11.5px;
        white-space: nowrap;
      }
      .ip-link {
        color: var(--text-mute);
        cursor: pointer;
        text-decoration: none;
        border-bottom: 1px dashed transparent;
      }
      .ip-link:hover {
        color: var(--text);
        border-bottom-color: var(--text-faint);
      }
      .ip-dup {
        color: var(--err);
        font-weight: 600;
      }
      .ip-dup:hover {
        color: #fca5a5;
      }
      .ip-count {
        margin-left: 4px;
        padding: 1px 6px;
        background: rgba(248, 113, 113, 0.15);
        color: var(--err);
        border-radius: 3px;
        font-size: 10px;
        font-weight: 700;
      }
      .search-box {
        flex: 1;
        min-width: 200px;
        max-width: 360px;
        padding: 7px 12px;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text);
        font-size: 13px;
        outline: none;
      }
      .search-box:focus {
        border-color: var(--accent);
      }
      .search-box::placeholder {
        color: var(--text-faint);
      }
      .ip-filter-bar {
        display: none;
        align-items: center;
        gap: 10px;
        margin-bottom: 12px;
        padding: 10px 14px;
        background: rgba(248, 113, 113, 0.08);
        border: 1px solid rgba(248, 113, 113, 0.25);
        border-radius: 8px;
        font-size: 12.5px;
        color: var(--text);
      }
      .ip-filter-bar.show {
        display: flex;
      }
      .ip-filter-bar code {
        font-family: ui-monospace, "SF Mono", Consolas, monospace;
        color: var(--err);
        font-weight: 600;
      }
      .ip-filter-bar button {
        margin-left: auto;
        padding: 4px 10px;
        background: transparent;
        border: 1px solid var(--border-strong);
        color: var(--text-mute);
        border-radius: 6px;
        font-size: 11.5px;
        cursor: pointer;
      }
      .ip-filter-bar button:hover {
        color: var(--text);
      }
      .batch-bar {
        display: none;
        align-items: center;
        gap: 10px;
        margin-bottom: 12px;
        padding: 10px 14px;
        background: rgba(96, 165, 250, 0.08);
        border: 1px solid rgba(96, 165, 250, 0.25);
        border-radius: 8px;
        font-size: 12.5px;
      }
      .batch-bar.show {
        display: flex;
      }
      .batch-bar .count-pill {
        padding: 2px 10px;
        background: rgba(96, 165, 250, 0.18);
        color: var(--accent);
        border-radius: 4px;
        font-weight: 600;
      }
      .batch-bar .btn-batch {
        padding: 6px 14px;
        border: none;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
      }
      .batch-bar .btn-batch.approve {
        background: rgba(74, 222, 128, 0.18);
        color: var(--ok);
      }
      .batch-bar .btn-batch.approve:hover {
        background: rgba(74, 222, 128, 0.28);
      }
      .batch-bar .btn-batch.reject {
        background: rgba(248, 113, 113, 0.15);
        color: var(--err);
      }
      .batch-bar .btn-batch.reject:hover {
        background: rgba(248, 113, 113, 0.25);
      }
      .batch-bar .btn-clear {
        margin-left: auto;
        padding: 4px 10px;
        background: transparent;
        border: 1px solid var(--border-strong);
        color: var(--text-mute);
        border-radius: 6px;
        font-size: 11.5px;
        cursor: pointer;
      }
      .batch-bar .btn-clear:hover {
        color: var(--text);
      }
      input[type="checkbox"].row-check {
        width: 16px;
        height: 16px;
        cursor: pointer;
        accent-color: var(--accent);
      }
      .status {
        display: inline-block;
        padding: 3px 10px;
        border-radius: 4px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      .status-pending {
        background: rgba(251, 191, 36, 0.12);
        color: var(--warn);
      }
      .status-approved {
        background: rgba(74, 222, 128, 0.12);
        color: var(--ok);
      }
      .status-rejected {
        background: rgba(248, 113, 113, 0.12);
        color: var(--err);
      }
      .actions {
        display: flex;
        gap: 6px;
        white-space: nowrap;
      }
      .btn-approve,
      .btn-reject {
        padding: 6px 12px;
        border: none;
        border-radius: 6px;
        font-size: 12px;
        cursor: pointer;
        font-weight: 500;
      }
      .btn-approve {
        background: rgba(74, 222, 128, 0.15);
        color: var(--ok);
      }
      .btn-approve:hover {
        background: rgba(74, 222, 128, 0.25);
      }
      .btn-reject {
        background: rgba(248, 113, 113, 0.12);
        color: var(--err);
      }
      .btn-reject:hover {
        background: rgba(248, 113, 113, 0.22);
      }
      .btn-approve:disabled,
      .btn-reject:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .empty,
      .loading {
        padding: 40px 20px;
        text-align: center;
        color: var(--text-mute);
        font-size: 13px;
      }
      .toast {
        position: fixed;
        bottom: 24px;
        right: 24px;
        padding: 12px 18px;
        background: var(--bg-card);
        border: 1px solid var(--border-strong);
        border-radius: 10px;
        font-size: 13px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        z-index: 1000;
        opacity: 0;
        transform: translateY(8px);
        transition: all 0.18s;
      }
      .toast.show {
        opacity: 1;
        transform: translateY(0);
      }
      .toast.ok {
        border-color: rgba(74, 222, 128, 0.4);
        color: var(--ok);
      }
      .toast.err {
        border-color: rgba(248, 113, 113, 0.4);
        color: var(--err);
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 12px;
        margin-bottom: 20px;
      }
      .stat-card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 14px 16px;
      }
      .stat-card .label {
        font-size: 11px;
        color: var(--text-faint);
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .stat-card .value {
        font-size: 22px;
        font-weight: 600;
        margin-top: 4px;
      }
      .stat-card.pending .value {
        color: var(--warn);
      }
      .stat-card.approved .value {
        color: var(--ok);
      }
      .stat-card.rejected .value {
        color: var(--err);
      }
      .table-wrap {
        overflow-x: auto;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <nav class="nav">
        <a href="../api_apply.html">申请 API</a>
        <a href="../api_keys.html">我的 Keys</a>
        <a href="../api_models.html">模型广场</a>
        <a href="../api_docs.html">文档</a>
        <a href="./admin.html" class="active">审核</a>
        <a href="./admin_usage.html">调用日志</a>
        <span class="badge-admin">ADMIN</span>
        <span class="spacer"></span>
        <a href="../cancri_chat_ui_v_3.html" style="color: var(--text-faint)"
          >← 返回聊天</a
        >
      </nav>

      <div id="loading" class="loading">检查权限中…</div>

      <div id="login-gate" class="gate" style="display: none">
        <h2>需要登录</h2>
        <p>请先登录账号，验证你的管理员身份。</p>
        <a class="btn-primary" href="../cancri_chat_ui_v_3.html">前往登录</a>

      <div id="deny-gate" class="gate deny" style="display: none">
        <h2>无权访问</h2>
        <p>
          这个页面仅站点管理员可见。如果你认为这是误判，请联系
          <code>站主</code>。
        </p>
        <a class="btn-primary" href="../cancri_chat_ui_v_3.html">返回聊天</a>
      </div>

      <div id="main" style="display: none">
        <header>
          <h1>API 申请审核</h1>
          <p>查看待审核的 API Key 申请，一键 approve / reject。</p>
        </header>

        <div class="stats" id="stats">
          <div class="stat-card pending">
            <div class="label">待审核</div>
            <div class="value" id="stat-pending">—</div>
          </div>
          <div class="stat-card approved">
            <div class="label">已通过</div>
            <div class="value" id="stat-approved">—</div>
          </div>
          <div class="stat-card rejected">
            <div class="label">已拒绝</div>
            <div class="value" id="stat-rejected">—</div>
          </div>
          <div class="stat-card">
            <div class="label">总数</div>
            <div class="value" id="stat-total">—</div>
          </div>
        </div>

        <div class="toolbar">
          <div class="filter-group" id="statusFilter">
            <button class="filter-btn active" data-status="">
              全部<span class="count" id="cnt-all">0</span>
            </button>
            <button class="filter-btn" data-status="pending">
              待审核<span class="count" id="cnt-pending">0</span>
            </button>
            <button class="filter-btn" data-status="approved">
              已通过<span class="count" id="cnt-approved">0</span>
            </button>
            <button class="filter-btn" data-status="rejected">
              已拒绝<span class="count" id="cnt-rejected">0</span>
            </button>
          </div>
          <input
            id="search"
            class="search-box"
            type="search"
            placeholder="搜邮箱 / IP / 用途 / user_id…"
            autocomplete="off"
          />
          <button class="reload-btn" id="reload-btn">↻ 刷新</button>
        </div>

        <div class="ip-filter-bar" id="ipFilterBar">
          已锁定 IP <code id="ipFilterValue"></code>，仅显示该 IP 的申请
          <button id="ipFilterClear">取消筛选</button>
        </div>

        <div class="batch-bar" id="batchBar">
          已选 <span class="count-pill" id="batchCount">0</span> 条申请
          <button class="btn-batch approve" id="batchApprove">批量通过</button>
          <button class="btn-batch reject" id="batchReject">批量拒绝</button>
          <button class="btn-clear" id="batchClear">取消选择</button>
        </div>

        <div class="table-wrap" data-sensitive>
          <table>
            <thead>
              <tr>
                <th style="width: 32px">
                  <input type="checkbox" id="checkAll" class="row-check" title="全选当前可见" />
                </th>
                <th style="width: 200px">邮箱</th>
                <th>用途说明</th>
                <th style="width: 130px">IP</th>
                <th style="width: 92px">状态</th>
                <th style="width: 138px">提交时间</th>
                <th style="width: 180px">操作</th>
              </tr>
            </thead>
            <tbody id="rows">
              <tr>
                <td colspan="7" class="empty">加载中…</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <div id="toast" class="toast"></div>
    </div>

    <script src="../cancri_config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      // IMPORTANT: storageKey must match cancri_chat.js so the admin's login
      // session from the main chat page is visible here.
      const sb = window.supabase.createClient(
        window.__SUPABASE_URL__,
        window.__SUPABASE_ANON_KEY__,
        {
          auth: {
            persistSession: true,
            autoRefreshToken: true,
            detectSessionInUrl: false,
            storageKey: "cancri_supabase_auth",
          },
        },
      );
      const GW = window.__SUPABASE_URL__ + "/functions/v1/chat-gateway";
      let APPS = [];
      let activeStatus = "";
      let activeSearch = "";
      let activeIpFilter = "";
      // IP -> count (across all APPS, regardless of current filter). Used to
      // flag duplicates so the admin can mass-reject same-egress abuse.
      let IP_COUNTS = new Map();
      // Set of selected application ids for batch operations.
      const SELECTED = new Set();

      const $ = (id) => document.getElementById(id);
      const esc = (s) => {
        const d = document.createElement("div");
        d.textContent = String(s == null ? "" : s);
        return d.innerHTML;
      };

      function showToast(msg, kind) {
        const t = $("toast");
        t.textContent = msg;
        t.className = "toast " + (kind || "");
        requestAnimationFrame(() => t.classList.add("show"));
        setTimeout(() => t.classList.remove("show"), 2400);
      }

      async function getSession() {
        const {
          data: { session },
        } = await sb.auth.getSession();
        return session;
      }

      async function init() {
        const session = await getSession();
        $("loading").style.display = "none";
        if (!session || !session.user || session.user.is_anonymous) {
          $("login-gate").style.display = "block";
          return;
        }
        // We can't tell from the client whether this user is in ADMIN_USER_IDS
        // — only the backend can. Just attempt to load applications; backend
        // returns 403 for non-admins.
        await loadApps();
      }

      async function loadApps() {
        const session = await getSession();
        try {
          const resp = await fetch(GW, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: "Bearer " + session.access_token,
            },
            body: JSON.stringify({
              endpoint: "admin_list_api_applications",
            }),
          });
          if (resp.status === 403) {
            $("deny-gate").style.display = "block";
            return;
          }
          if (!resp.ok) {
            throw new Error("HTTP " + resp.status);
          }
          const data = await resp.json();
          APPS = Array.isArray(data.applications) ? data.applications : [];
          $("main").style.display = "block";
          updateStats();
          render();
        } catch (e) {
          showToast("加载失败：" + (e.message || e), "err");
        }
      }

      function updateStats() {
        const counts = { pending: 0, approved: 0, rejected: 0 };
        IP_COUNTS = new Map();
        APPS.forEach((a) => {
          if (counts[a.status] !== undefined) counts[a.status]++;
          if (a.ip) IP_COUNTS.set(a.ip, (IP_COUNTS.get(a.ip) || 0) + 1);
        });
        $("stat-pending").textContent = counts.pending;
        $("stat-approved").textContent = counts.approved;
        $("stat-rejected").textContent = counts.rejected;
        $("stat-total").textContent = APPS.length;
        $("cnt-all").textContent = APPS.length;
        $("cnt-pending").textContent = counts.pending;
        $("cnt-approved").textContent = counts.approved;
        $("cnt-rejected").textContent = counts.rejected;
      }

      // Apply all filters (status / IP / free-text search) in order. Pulled
      // out of render() so we can also reuse it when computing batch targets.
      function getFilteredApps() {
        let list = activeStatus
          ? APPS.filter((a) => a.status === activeStatus)
          : APPS;
        if (activeIpFilter) {
          list = list.filter((a) => a.ip === activeIpFilter);
        }
        if (activeSearch) {
          const q = activeSearch.toLowerCase();
          list = list.filter(
            (a) =>
              (a.email || "").toLowerCase().includes(q) ||
              (a.ip || "").toLowerCase().includes(q) ||
              (a.purpose || "").toLowerCase().includes(q) ||
              (a.user_id || "").toLowerCase().includes(q),
          );
        }
        return list;
      }

      function refreshBatchBar() {
        const n = SELECTED.size;
        $("batchBar").classList.toggle("show", n > 0);
        $("batchCount").textContent = n;
        // Sync the header check-all box state (checked / partial / empty).
        const visible = getFilteredApps();
        const visibleSelected = visible.filter((a) =>
          SELECTED.has(a.id),
        ).length;
        const cb = $("checkAll");
        if (visible.length === 0) {
          cb.checked = false;
          cb.indeterminate = false;
        } else if (visibleSelected === visible.length) {
          cb.checked = true;
          cb.indeterminate = false;
        } else if (visibleSelected > 0) {
          cb.indeterminate = true;
        } else {
          cb.checked = false;
          cb.indeterminate = false;
        }
      }

      function render() {
        const filtered = getFilteredApps();
        const tbody = $("rows");
        if (filtered.length === 0) {
          tbody.innerHTML = `<tr><td colspan="7" class="empty">没有匹配的申请</td></tr>`;
          refreshBatchBar();
          return;
        }
        tbody.innerHTML = filtered.map(rowHtml).join("");
        // Bind action buttons
        tbody.querySelectorAll("[data-action]").forEach((btn) => {
          btn.addEventListener("click", () => decide(btn));
        });
        // Bind row checkboxes
        tbody.querySelectorAll("input.row-check").forEach((cb) => {
          cb.addEventListener("change", () => {
            const id = cb.dataset.id;
            if (cb.checked) SELECTED.add(id);
            else SELECTED.delete(id);
            refreshBatchBar();
          });
        });
        // Bind IP click-to-filter (only meaningful for duplicate IPs)
        tbody.querySelectorAll(".ip-link").forEach((el) => {
          el.addEventListener("click", (e) => {
            e.preventDefault();
            setIpFilter(el.dataset.ip);
          });
        });
        refreshBatchBar();
      }

      function rowHtml(a) {
        const created = a.created_at
          ? new Date(a.created_at).toLocaleString("zh-CN", { hour12: false })
          : "—";
        const statusKey = a.status || "pending";
        const statusLabel =
          { pending: "待审核", approved: "已通过", rejected: "已拒绝" }[
            statusKey
          ] || statusKey;
        const isPending = statusKey === "pending";
        const ip = a.ip || "";
        const ipCount = ip ? IP_COUNTS.get(ip) || 0 : 0;
        const ipDup = ipCount > 1;
        const ipHtml = ip
          ? `<a class="ip-link${ipDup ? " ip-dup" : ""}" data-ip="${esc(ip)}" href="#" title="${ipDup ? "该 IP 共 " + ipCount + " 条申请，点击仅看这条 IP" : "点击仅看这条 IP"}">${esc(ip)}${ipDup ? `<span class="ip-count">×${ipCount}</span>` : ""}</a>`
          : `<span style="color:var(--text-faint)">—</span>`;
        const checked = SELECTED.has(a.id) ? "checked" : "";
        // Only allow checkbox on pending rows (batch ops only target pending).
        const checkboxHtml = isPending
          ? `<input type="checkbox" class="row-check" data-id="${esc(a.id)}" ${checked} />`
          : "";
        return `<tr data-id="${esc(a.id)}">
          <td>${checkboxHtml}</td>
          <td class="email">
            ${esc(a.email || "—")}
            <div class="user-id" style="margin-top:4px">${esc((a.user_id || "").slice(0, 13))}…</div>
          </td>
          <td class="purpose">${esc(a.purpose || "—")}</td>
          <td class="ip">${ipHtml}</td>
          <td><span class="status status-${statusKey}">${statusLabel}</span></td>
          <td class="created">${esc(created)}</td>
          <td>
            <div class="actions">
              <button class="btn-approve" data-action="approved" data-id="${esc(a.id)}" ${isPending ? "" : "disabled"}>通过</button>
              <button class="btn-reject" data-action="rejected" data-id="${esc(a.id)}" ${isPending ? "" : "disabled"}>拒绝</button>
            </div>
          </td>
        </tr>`;
      }

      function setIpFilter(ip) {
        activeIpFilter = ip || "";
        const bar = $("ipFilterBar");
        if (activeIpFilter) {
          $("ipFilterValue").textContent = activeIpFilter;
          bar.classList.add("show");
        } else {
          bar.classList.remove("show");
        }
        render();
      }

      async function batchDecide(newStatus) {
        const ids = Array.from(SELECTED);
        if (ids.length === 0) return;
        // Filter to only pending ones (server will skip non-pending via update
        // but we want accurate confirm count).
        const pendingIds = APPS.filter(
          (a) => SELECTED.has(a.id) && a.status === "pending",
        ).map((a) => a.id);
        if (pendingIds.length === 0) {
          showToast("所选申请里没有待审核的", "err");
          return;
        }
        const verb = newStatus === "approved" ? "通过" : "拒绝";
        if (!confirm(`确认${verb} ${pendingIds.length} 条申请？`)) return;
        // Disable the bar buttons during the call.
        const aBtn = $("batchApprove");
        const rBtn = $("batchReject");
        aBtn.disabled = true;
        rBtn.disabled = true;
        try {
          const session = await getSession();
          const resp = await fetch(GW, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: "Bearer " + session.access_token,
            },
            body: JSON.stringify({
              endpoint: "admin_batch_review_api_applications",
              application_ids: pendingIds,
              status: newStatus,
            }),
          });
          const data = await resp.json();
          if (resp.ok && data.ok) {
            showToast(`已${verb} ${data.updated ?? pendingIds.length} 条`, "ok");
            // Update local state and re-render without a full reload.
            const idSet = new Set(pendingIds);
            APPS.forEach((a) => {
              if (idSet.has(a.id)) a.status = newStatus;
            });
            SELECTED.clear();
            updateStats();
            render();
          } else {
            showToast(data.error || `批量${verb}失败`, "err");
          }
        } catch (e) {
          showToast("网络错误：" + (e.message || e), "err");
        } finally {
          aBtn.disabled = false;
          rBtn.disabled = false;
        }
      }

      async function decide(btn) {
        const action = btn.dataset.action;
        const id = btn.dataset.id;
        const verb = action === "approved" ? "通过" : "拒绝";
        if (!confirm(`确认${verb}这个申请？`)) return;
        const row = btn.closest("tr");
        row.querySelectorAll("button").forEach((b) => (b.disabled = true));
        try {
          const session = await getSession();
          const resp = await fetch(GW, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: "Bearer " + session.access_token,
            },
            body: JSON.stringify({
              endpoint: "admin_review_api_application",
              application_id: id,
              status: action,
            }),
          });
          const data = await resp.json();
          if (resp.ok && data.ok) {
            showToast(`已${verb}`, "ok");
            // Update local data and re-render
            const app = APPS.find((a) => a.id === id);
            if (app) app.status = action;
            // Remove from batch selection — the row is no longer pending so
            // its checkbox won't render anyway, but the count badge would
            // stay stale otherwise.
            SELECTED.delete(id);
            updateStats();
            render();
          } else {
            showToast(data.error || `${verb}失败`, "err");
            row.querySelectorAll("button").forEach((b) => (b.disabled = false));
          }
        } catch (e) {
          showToast("网络错误：" + (e.message || e), "err");
          row.querySelectorAll("button").forEach((b) => (b.disabled = false));
        }
      }

      $("statusFilter").addEventListener("click", (e) => {
        const b = e.target.closest("[data-status]");
        if (!b) return;
        $("statusFilter")
          .querySelectorAll(".filter-btn")
          .forEach((x) => x.classList.remove("active"));
        b.classList.add("active");
        activeStatus = b.dataset.status;
        render();
      });

      $("reload-btn").addEventListener("click", () => loadApps());

      // Search box (instant filter; debounce not needed for ≤500 rows).
      $("search").addEventListener("input", (e) => {
        activeSearch = e.target.value.trim();
        render();
      });

      // IP filter clear
      $("ipFilterClear").addEventListener("click", () => setIpFilter(""));

      // Batch bar
      $("batchApprove").addEventListener("click", () => batchDecide("approved"));
      $("batchReject").addEventListener("click", () => batchDecide("rejected"));
      $("batchClear").addEventListener("click", () => {
        SELECTED.clear();
        render();
      });

      // Header check-all toggles all currently visible pending rows.
      $("checkAll").addEventListener("change", (e) => {
        const visible = getFilteredApps().filter((a) => a.status === "pending");
        if (e.target.checked) {
          visible.forEach((a) => SELECTED.add(a.id));
        } else {
          visible.forEach((a) => SELECTED.delete(a.id));
        }
        render();
      });

      init();
    </script>
  </body>
</html>
